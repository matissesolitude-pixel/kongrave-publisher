<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#0b0b0b; }
    </style>
  </head>
  <body>
    <!-- ep10 CASH IS A TRADE — MÉTAPHORE : deux chaises. Celle qui a AGI (noire) bascule et tombe ;
         celle qui est RESTÉE (rouge, cash = une position) demeure DEBOUT. Ne rien faire est un trade :
         tu restes debout pendant que l'impatient s'effondre. N&B + 1 rouge. Compris sans le son. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="6"
         data-width="1080" data-height="1920">
      <svg id="scene" class="clip" data-start="0" data-duration="6" data-track-index="1"
           width="1080" height="1920" viewBox="0 0 1080 1920">
        <rect x="0" y="0" width="1080" height="1920" fill="#0b0b0b"/>
        <line x1="90" y1="1440" x2="990" y2="1440" stroke="#fff" stroke-width="6"/>

        <!-- CHAISE ROUGE (cash, reste debout) -->
        <g id="chairRed" transform="translate(150,1440)">
          <g stroke="#C41E1E" stroke-width="17" stroke-linecap="round" fill="none">
            <path d="M14,-250 L14,-388"/><path d="M14,-250 L182,-250"/>
            <path d="M14,-250 L14,0"/><path d="M174,-250 L174,0"/>
            <path d="M14,-120 L174,-120"/>
          </g>
          <circle cx="14" cy="-388" r="12" fill="#C41E1E"/>
        </g>

        <!-- CHAISE NOIRE (a agi, bascule et tombe) -->
        <g id="chairBlk" transform="translate(380,1440)">
          <g stroke="#f2f2f2" stroke-width="17" stroke-linecap="round" fill="none">
            <path d="M14,-250 L14,-388"/><path d="M14,-250 L182,-250"/>
            <path d="M14,-250 L14,0"/><path d="M174,-250 L174,0"/>
            <path d="M14,-120 L174,-120"/>
          </g>
          <circle cx="14" cy="-388" r="12" fill="#f2f2f2"/>
        </g>
      </svg>
    </div>

    <script>
      window.__timelines=window.__timelines||{};
      const tl=gsap.timeline({paused:true});
      // 1) les deux chaises debout, un temps
      tl.to({},{duration:1.0});
      // 2) la chaise NOIRE (a agi) BASCULE autour de son pied avant droit et tombe
      tl.to("#chairBlk",{rotation:90, svgOrigin:"554 1440", duration:0.7, ease:"power2.in"},1.1);
      tl.to("#chairBlk",{rotation:86, svgOrigin:"554 1440", duration:0.25, ease:"power1.out"},1.8);   // petit rebond
      // 3) la chaise ROUGE (cash) reste DEBOUT, respiration légère (elle tient)
      tl.to("#chairRed",{scaleY:1.015, svgOrigin:"164 1440", duration:0.8,
                         ease:"sine.inOut", yoyo:true, repeat:5},0.4);
      window.__timelines["main"]=tl;
    </script>
  </body>
</html>
