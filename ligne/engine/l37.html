<!doctype html>
<html lang="en" data-resolution="portrait" data-fps="30">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>:root{--paper:#F2EFE7}*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}#stage{position:absolute;inset:0}svg{position:absolute;inset:0;width:1080px;height:1920px}</style>
</head>
<body>
  <!-- L37 « THE BREAK THAT CHANGED NOTHING » — S1 : émotion frame 0 = CURIOSITÉ — un niveau VIOLEMMENT brisé (éclats)
       et, juste au-dessus, une séquence de poussées/replis qui continue, sereine, indifférente. Le fusil = l'écart entre
       le fracas et l'indifférence. S2 : la cassure est UN événement, la structure est une SÉQUENCE (le motif : chaque
       poussée plus loin, chaque repli qui tient). S3 : DÉZOOM — la cassure se réduit à un détail, les repères de séquence
       n'ont rien enregistré. S4 : le bruyant capte l'attention, le silencieux prend l'argent. S5 : décharge — le test des
       deux repères décide EVENT vs TURN. Doctrine : aucun chiffre, pas de brun, teal = TOI, bas du cadre vide. -->
  <div id="stage" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="1"><svg id="svg" viewBox="0 0 1080 1920"></svg></div>
  <script>
    const TOTAL=__TOTAL__, SC=__SCENES__, SPEC=__SPEC__;
    const NS='http://www.w3.org/2000/svg', SVG=document.getElementById('svg');
    const YOU='#1E5F6E', INK='#20242A', PAPER='#F2EFE7', DEAD='#474D50';
    const CX=540;
    function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);(p||SVG).appendChild(e);return e;}
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,f)=>a+(b-a)*clamp(f,0,1),eIn=f=>f*f,eOut=f=>1-(1-f)*(1-f),eInOut=f=>f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
    const backOut=(p,s)=>{s=(s==null?1.9:s);const q=clamp(p,0,1)-1;return 1+(s+1)*q*q*q+s*q*q;};
    const setOp=(el,o)=>el.setAttribute('opacity',clamp(o,0,1).toFixed(3));

    /*INCLUDE:narrator*/

    // ═══ LE GROUPE ZOOMABLE (S3 = dézoom) ═══
    const Z=mk('g');
    // LA SÉQUENCE : poussées de plus en plus loin, replis qui tiennent — le motif qui MÈNE
    const SEQ=[], SW=[];                                   // points + repères (swings)
    (function(){
      const x0=230, x1=985, base=1230, rise=420, n=7;      // 7 jambes : poussée/repli alternés
      let x=x0, y=base;
      SEQ.push([x,y]);
      for(let i=0;i<n;i++){
        const up=(i%2===0), seg=(x1-x0)/n;
        const dy=up? -rise/((n+1)/2)*1.35 : rise/((n+1)/2)*0.55;
        x+=seg; y+=dy;
        SEQ.push([x,y]); SW.push([x,y,up]);
      }
    })();
    const seqLine=mk('polyline',{fill:'none',stroke:INK,'stroke-width':8,'stroke-linejoin':'round','stroke-linecap':'round',opacity:0},Z);
    const SWD=[]; for(let i=0;i<8;i++)SWD.push(mk('circle',{r:13,fill:PAPER,stroke:INK,'stroke-width':6,opacity:0},Z));
    // LE NIVEAU BRISÉ : deux tronçons + un vide + des éclats
    const LVY=1300, GAP0=470, GAP1=610;
    const lvA=mk('line',{stroke:INK,'stroke-width':9,'stroke-linecap':'round',opacity:0},Z);
    const lvB=mk('line',{stroke:INK,'stroke-width':9,'stroke-linecap':'round',opacity:0},Z);
    const SHARD=[]; for(let i=0;i<9;i++)SHARD.push(mk('line',{stroke:INK,'stroke-width':6,'stroke-linecap':'round',opacity:0},Z));
    function level(op,burst){
      lvA.setAttribute('x1',190);lvA.setAttribute('x2',GAP0);lvA.setAttribute('y1',LVY);lvA.setAttribute('y2',LVY);setOp(lvA,op);
      lvB.setAttribute('x1',GAP1);lvB.setAttribute('x2',985);lvB.setAttribute('y1',LVY);lvB.setAttribute('y2',LVY);setOp(lvB,op);
      for(let i=0;i<SHARD.length;i++){
        const a=(-0.85+i*0.21), d=48+burst*46+10*Math.sin(burst*7+i);
        const cx=(GAP0+GAP1)/2+(i-4)*17, cy=LVY;
        const e=SHARD[i];
        e.setAttribute('x1',cx.toFixed(1));e.setAttribute('y1',cy.toFixed(1));
        e.setAttribute('x2',(cx+Math.cos(a)*d).toFixed(1));e.setAttribute('y2',(cy+Math.sin(a)*d*0.7).toFixed(1));
        setOp(e,op*(0.55+0.45*burst));
      }
    }
    function drawSeq(upTo,op,color){
      const pts=SEQ.slice(0,Math.max(2,upTo));
      seqLine.setAttribute('points',pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '));
      seqLine.setAttribute('stroke',color||INK);setOp(seqLine,op);
    }
    function swings(op,color){for(let i=0;i<SWD.length;i++){const s=SW[i];
      if(!s){setOp(SWD[i],0);continue;}
      SWD[i].setAttribute('cx',s[0].toFixed(1));SWD[i].setAttribute('cy',s[1].toFixed(1));
      SWD[i].setAttribute('stroke',color||INK);setOp(SWD[i],op);}}
    function zoom(k,cx,cy){Z.setAttribute('transform',`translate(${(cx*(1-k)).toFixed(1)},${(cy*(1-k)).toFixed(1)}) scale(${k.toFixed(3)})`);}
    function hideZ(){setOp(seqLine,0);setOp(lvA,0);setOp(lvB,0);for(const e of SHARD)setOp(e,0);for(const e of SWD)setOp(e,0);}

    // le point isolé (la cassure vue comme UN événement) + le verdict
    const evDot=mk('circle',{r:17,fill:INK,opacity:0});
    const loud=mk('circle',{fill:'none',stroke:INK,'stroke-width':7,opacity:0});   // l'onde bruyante
    const youDot=mk('circle',{r:15,fill:YOU,opacity:0});

    // ── QUESTION (§M15) — 1re ligne pleine dès la frame 0 ──
    const QLINES=['THE LEVEL BROKE','WHY DID NOTHING CHANGE'];
    const FS=88,lineH=112,y0=210,qY=QLINES.map((s,li)=>y0+li*lineH);
    const qEls=QLINES.map((s,li)=>{const e=mk('text',{x:CX,y:qY[li],'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':FS,'letter-spacing':'1',opacity:0});e.textContent=s;return e;});
    const QMY=y0+2*lineH+96,qMark=mk('text',{x:CX,y:QMY,'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':200,opacity:0});qMark.textContent='?';
    qEls.forEach(e=>{const t=e.textContent,f=Math.min(FS,930/Math.max(1,t.length*0.66));e.setAttribute('font-size',f.toFixed(1));});
    function hideQ(){for(const e of qEls)setOp(e,0);setOp(qMark,0);}

    // ── ÉTIQUETTES (§M18) — putCap MESURE la largeur réelle ──
    function caption(sz){return mk('text',{'text-anchor':'middle','font-family':'Helvetica Neue, Arial, sans-serif','font-weight':(sz>44?800:700),'font-size':(sz||42),'data-fs':(sz||42),'letter-spacing':'1.5',opacity:0});}
    const capA=caption(42),capB=caption(42),capC=caption(42),capD=caption(38),capE=caption(38),capF=caption(38);
    function putCap(el,txt,cx,y,color,op){
      const MARGIN=70, MAXW=1080-2*MARGIN;
      if(el.__cap!==txt){ el.__cap=txt; el.textContent=txt;
        const nom=+el.getAttribute('data-fs')||+el.getAttribute('font-size')||42;
        el.setAttribute('font-size',nom);
        let w=el.getComputedTextLength()||0;
        if(!w) w=txt.length*nom*0.72;
        if(w>MAXW){ const fs=Math.max(18,nom*MAXW/w); el.setAttribute('font-size',fs.toFixed(1)); w=el.getComputedTextLength()||txt.length*fs*0.72; }
        el.__hw=w/2;
      }
      const x=clamp(+cx, MARGIN+el.__hw, 1080-MARGIN-el.__hw);
      el.setAttribute('x',x.toFixed(1));el.setAttribute('y',y);el.setAttribute('fill',color);setOp(el,op);}
    function hideCaps(){for(const e of [capA,capB,capC,capD,capE,capF])setOp(e,0);}
    function hideAll(){hideZ();setOp(evDot,0);setOp(loud,0);setOp(youDot,0);}

    // ═══ S1 — LE FRACAS, ET LA SÉQUENCE QUI S'EN MOQUE ═══
    // Verbe visuel : la contradiction simultanée (le bas explose, le haut continue).
    function s1(lf,t,s){
      const u=t-s; hideCaps(); hideAll(); zoom(1,CX,1100);
      const gf=clamp(1-(lf-0.86)/0.09,0,1);
      for(let k=0;k<qEls.length;k++){const qt=(k===0?0.18:u-(0.1+k*0.28)),ap=clamp(qt/0.18,0,1),sc=0.7+0.3*backOut(ap);setOp(qEls[k],ap*gf);qEls[k].setAttribute('transform',`translate(${(CX*(1-sc)).toFixed(2)} ${(qY[k]*(1-sc)).toFixed(2)}) scale(${sc.toFixed(3)})`);}
      const qm=u-0.9,qap=clamp(qm/0.2,0,1),qsc=0.6+0.4*backOut(qap);setOp(qMark,qap*gf*clamp(1-(u-4.6)/1.2,0,1));qMark.setAttribute('transform',`translate(${(CX*(1-qsc)).toFixed(2)} ${(QMY*(1-qsc)).toFixed(2)}) scale(${qsc.toFixed(3)})`);
      // ÉMOTION FRAME 0 : le niveau est DÉJÀ brisé (éclats vifs) et la séquence continue, sereine.
      const burst=clamp(1-u/1.4,0,1);
      level(1,0.35+0.65*burst);
      drawSeq(SEQ.length, 1, INK);
      swings(clamp((u-2.4)/0.8,0,1)*0.9, INK);
      // vie continue : la séquence respire (déplacement, deux harmoniques) — elle n'est PAS figée
      seqLine.setAttribute('transform',`translate(0,${(6*Math.sin(u*0.95)+3*Math.sin(u*1.9)).toFixed(1)})`);
      putCap(capA,'THE LEVEL BROKE',780,LVY+96,INK,clamp((u-1.8)/0.7,0,1)*gf);   // à droite : la gauche est la zone du narrateur
      putCap(capC,'THE SEQUENCE DID NOT NOTICE',700,760,DEAD,clamp((u-3.2)/0.8,0,1)*gf);
      // GAG : il TOMBE à travers le niveau qui se brise sous lui (agent propre à L37)
      const HG=(SPEC[0]&&SPEC[0].hook_gag)||{};
      MrD.gag(u,{primitive:HG.primitive||'fall', reaction:HG.reaction||'impuissant',
                 raccord:HG.raccord||'ecarte', agent:{x:(GAP0+GAP1)/2, y:LVY+140}, t:t, lookAt:CX,
                 rest:{x:150,y:1420,h:200}, h:330, op:gf});
    }

    // ═══ S2 — UN ÉVÉNEMENT vs UNE SÉQUENCE ═══
    // Verbe visuel : le rythme qui se marque (chaque poussée, chaque repli prend un repère).
    function s2(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideAll(); zoom(1,CX,1100);
      drawSeq(SEQ.length,1,INK); seqLine.setAttribute('transform','');
      // les repères s'allument un à un : le MOTIF
      for(let i=0;i<SWD.length;i++){const st=SW[i];
        if(!st){setOp(SWD[i],0);continue;}
        const ap=clamp((u-(0.4+i*0.32))/0.4,0,1);
        const b=4*Math.sin(u*2.1-i*0.7)+2*Math.sin(u*3.3-i*0.5);
        SWD[i].setAttribute('cx',st[0].toFixed(1));SWD[i].setAttribute('cy',(st[1]+b).toFixed(1));
        SWD[i].setAttribute('stroke',INK);setOp(SWD[i],ap);}
      // la cassure : UN point isolé, en bas
      evDot.setAttribute('cx',(GAP0+GAP1)/2);evDot.setAttribute('cy',LVY+16*Math.sin(u*1.6)+7*Math.sin(u*2.9));
      setOp(evDot,clamp((u-1.2)/0.6,0,1));
      level(clamp((u-1.0)/0.6,0,1)*0.35,0.2);
      putCap(capA,'ONE EVENT',(GAP0+GAP1)/2,LVY+108,DEAD,clamp((u-1.6)/0.7,0,1));
      putCap(capC,'A SEQUENCE OF THEM',760,700,INK,clamp((u-2.4)/0.7,0,1));
      putCap(capB,'EACH PUSH FURTHER, EACH PULLBACK HOLDS',CX,620,INK,clamp((u-3.6)/0.8,0,1));
      // il ENTRE et désigne le motif, puis il repart : une apparition, pas un décor
      const inW=eInOut(clamp((u-2.0)/0.9,0,1)), outW=eInOut(clamp((u-6.6)/1.1,0,1));
      if(u>2.0&&outW<1){const alive=(inW>0.95&&outW<0.05)?(4*Math.sin(u*1.2)+2*Math.sin(u*2.3)):0;
        const nx2=lerp(lerp(-150,290,inW),-170,outW)+alive;
        if(inW<0.95) MrD.say('walk', t, nx2, 1430, 214, 1-outW, false, 0,1,1);
        else MrD.pointAt('point', t, nx2, 1430, 214, 1-outW, 700);   // cible : le motif, à sa DROITE
      }else MrD.hide();
    }

    // ═══ S3 — DÉZOOM : la cassure devient un détail ═══
    // Verbe visuel : le recul (l'échelle change, la hiérarchie apparaît).
    function s3(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideAll();
      const k=lerp(1,0.54,eInOut(clamp((u-0.4)/2.2,0,1)));
      zoom(k,CX,1160);
      drawSeq(SEQ.length,1,INK); seqLine.setAttribute('transform',`translate(${(9*Math.sin(u*0.75)+4*Math.sin(u*1.55)).toFixed(1)},${(7*Math.sin(u*0.95)+3*Math.sin(u*1.9)).toFixed(1)})`);
      // VIE CONTINUE : chaque repère respire en POSITION (deux harmoniques, phase décalée).
      // Sans ça la scène se fige dès que le narrateur sort — défaut attrapé par le scan.
      for(let i=0;i<SWD.length;i++){const st=SW[i];
        if(!st){setOp(SWD[i],0);continue;}
        const bx=5*Math.sin(u*0.85+i*0.8)+2.5*Math.sin(u*1.75+i*0.4);
        const by=6*Math.sin(u*1.05+i*0.5)+3*Math.sin(u*2.05+i*0.9);
        SWD[i].setAttribute('cx',(st[0]+bx).toFixed(1));SWD[i].setAttribute('cy',(st[1]+by).toFixed(1));
        SWD[i].setAttribute('stroke',INK);setOp(SWD[i],1);}
      level(0.45,0.15);
      evDot.setAttribute('cx',(GAP0+GAP1)/2*k+CX*(1-k));evDot.setAttribute('cy',LVY*k+1160*(1-k));
      evDot.setAttribute('r',(17*k).toFixed(1));setOp(evDot,1);
      putCap(capA,'THE SAME BREAK, PULLED BACK',CX,700,INK,clamp((u-2.4)/0.8,0,1));
      putCap(capC,'THE SEQUENCE RECORDED NOTHING',CX,780,DEAD,clamp((u-3.6)/0.8,0,1));
      // il apparaît PETIT (le dézoom a besoin de toute la place) et hausse les épaules
      MrD.say('wave_hip', t, 930+5*Math.sin(u*1.1)+3*Math.sin(u*2.2), 1430, 176,
              clamp((u-3.0)/0.7,0,1)*(1-clamp((u-8.5)/1.0,0,1)), true, 0,1,1);
    }

    // ═══ S4 — LE BRUYANT CAPTE, LE SILENCIEUX PREND ═══
    // Verbe visuel : l'onde qui crie (la cassure pulse) pendant que la séquence avance sans bruit.
    function s4(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideAll(); zoom(1,CX,1100);
      // la cassure HURLE : onde concentrique + éclats qui repartent
      const p=(u*0.85)%1;
      loud.setAttribute('cx',(GAP0+GAP1)/2);loud.setAttribute('cy',LVY);
      loud.setAttribute('r',(30+240*p).toFixed(1));setOp(loud,(1-p)*0.85);
      level(1,0.5+0.5*Math.abs(Math.sin(u*3.1)));
      // la séquence, SILENCIEUSE : elle avance, en gris, sans effet
      drawSeq(SEQ.length,0.55,DEAD); seqLine.setAttribute('transform',`translate(${(7*Math.sin(u*0.8)+3*Math.sin(u*1.7)).toFixed(1)},0)`);
      swings(0.5,DEAD);
      // TOI : le regard aspiré vers le bruit
      const ty=lerp(820,LVY-40,eInOut(clamp((u-1.0)/1.6,0,1)));
      youDot.setAttribute('cx',(GAP0+GAP1)/2+18*Math.sin(u*1.3));youDot.setAttribute('cy',ty);setOp(youDot,clamp((u-0.6)/0.6,0,1));
      putCap(capA,'LOUD',(GAP0+GAP1)/2,LVY+110,INK,clamp((u-1.4)/0.6,0,1));
      putCap(capC,'SILENT',860,700,DEAD,clamp((u-2.2)/0.7,0,1));
      putCap(capB,'THE LOUD ONE TAKES YOUR ATTENTION',CX,600,INK,clamp((u-3.2)/0.8,0,1));
      putCap(capD,'THE SILENT ONE TAKES THE MONEY',CX,1560,DEAD,clamp((u-4.6)/0.9,0,1));
      MrD.hide();   // pic de tension : c'est TOI qui es aspiré, pas lui
    }

    // ═══ S5 — DÉCHARGE : le test des deux repères ═══
    // Verbe visuel : la vérification (deux repères s'allument, le verdict tombe).
    function s5(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideAll(); zoom(1,CX,1100);
      drawSeq(SEQ.length,1,INK); seqLine.setAttribute('transform','');
      // les deux repères du test : la dernière poussée, le dernier repli
      for(let i=0;i<SWD.length;i++){const st=SW[i];
        if(!st){setOp(SWD[i],0);continue;}
        const key=(i===SW.length-1||i===SW.length-2);
        const ap=key?clamp((u-0.8)/0.7,0,1):0.28;
        const b=key?(3*Math.sin(u*1.9-i)+1.5*Math.sin(u*3.1)) *(1-clamp((u-3.8)/0.8,0,1)):0;
        SWD[i].setAttribute('cx',st[0].toFixed(1));SWD[i].setAttribute('cy',(st[1]+b).toFixed(1));
        SWD[i].setAttribute('stroke',key?YOU:DEAD);setOp(SWD[i],ap);}
      level(0.30,0.1);
      putCap(capA,'DID THE PATTERN CHANGE?',CX,700,INK,clamp((u-1.4)/0.7,0,1));
      putCap(capC,'PUSH STILL FURTHER · PULLBACK STILL HOLDS',CX,1500,YOU,clamp((u-2.4)/0.8,0,1));
      putCap(capB,'THEN IT WAS AN EVENT, NOT A TURN',CX,600,INK,clamp((u-3.4)/0.9,0,1));
      // il revient une dernière fois désigner le test, puis s'immobilise (image finale >=3 s)
      const frozen=clamp((u-4.2)/0.7,0,1);
      const jit=(1-frozen)*(4*Math.sin(u*1.15)+2*Math.sin(u*2.25));
      MrD.pointAt('point', t, 150+jit, 1420, 190, clamp((u-1.8)/0.7,0,1), 820);   // cible : les repères, à sa DROITE
    }

    const RENDER={s1,s2,s3,s4,s5};const SCENEFN=SPEC.map(s=>RENDER[s.id]||s1);
    const clock={t:0};
    function sceneAt(t){let i=0;for(let k=0;k<SC.length;k++){if(t>=SC[k].s-1e-6)i=k;}return Math.min(i,SCENEFN.length-1);}
    function render(){const t=clock.t;const i=sceneAt(t),lf=clamp((t-SC[i].s)/SC[i].d,0,1);SCENEFN[i](lf,t,SC[i].s);}
    const tl=gsap.timeline({paused:true});
    tl.to(clock,{t:TOTAL,duration:TOTAL,ease:'none',onUpdate:render},0);
    tl.to(SVG,{opacity:1,duration:0.001},TOTAL-0.001);
    window.__timelines=window.__timelines||{};window.__timelines['main']=tl;
  </script>
</body>
</html>
