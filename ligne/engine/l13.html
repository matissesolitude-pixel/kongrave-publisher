<!doctype html>
<html lang="en" data-resolution="portrait" data-fps="30">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>:root{--paper:#F2EFE7}*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}#stage{position:absolute;inset:0}svg{position:absolute;inset:0;width:1080px;height:1920px}</style>
</head>
<body>
  <!-- L13 « THE GHOST LOSSES » — deux colonnes. GAUCHE : briques pleines encre = pertes PRISES (visibles, comptables).
       DROITE : le vide (S1) se peuple de briques FANTÔMES pointillées = winners sautés (S3), qui montent plus vite et dépassent
       (S4), se grisent (la perte qu'on ne compte jamais reste une perte — GRIS jamais rouge, M-COULEUR bas→haut), puis se font
       COMPTER : hachurées (S5). FUSIL : le vide à droite. Doctrine : aucun chiffre, aucune couleur chaude, bas du cadre vide,
       structures neutres = encre (pas de camp adverse). §perf : la colonne pleine se monte dès la 1re seconde (accroche). -->
  <div id="stage" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="1"><svg id="svg" viewBox="0 0 1080 1920"></svg></div>
  <script>
    const TOTAL=__TOTAL__, SC=__SCENES__, SPEC=__SPEC__;
    const NS='http://www.w3.org/2000/svg', SVG=document.getElementById('svg');
    const YOU='#1E5F6E', INK='#20242A', PAPER='#F2EFE7', DEAD='#474D50';
    const CX=540;
    function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);(p||SVG).appendChild(e);return e;}
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,f)=>a+(b-a)*clamp(f,0,1),eIn=f=>f*f,eOut=f=>1-(1-f)*(1-f);
    const backOut=(p,s)=>{s=(s==null?1.9:s);const q=clamp(p,0,1)-1;return 1+(s+1)*q*q*q+s*q*q;};

    // ── DÉFS : motif de hachures (brique COMPTÉE en S5) ──
    const defs=mk('defs',{});
    const hatch=mk('pattern',{id:'hatch',width:14,height:14,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},defs);
    mk('rect',{width:14,height:14,fill:PAPER},hatch);
    mk('line',{x1:0,y1:0,x2:0,y2:14,stroke:DEAD,'stroke-width':4},hatch);

    // ── CASTING ── deux colonnes de briques sur un axe invisible (bas du cadre vide)
    const BASEY=1330, BW=210, BH=74, STEP=84, LX=380, GX=700, NREAL=6, NGHOST=10;
    const brickTopY=i=>BASEY-i*STEP-BH, brickBotY=i=>BASEY-i*STEP;
    // colonne PLEINE (pertes prises) — encre, séparateurs papier
    const real=[]; for(let i=0;i<NREAL;i++) real.push(mk('rect',{x:LX-BW/2,y:brickTopY(i),width:BW,height:BH,rx:4,fill:INK,stroke:PAPER,'stroke-width':3,opacity:0}));
    // colonne FANTÔME (winners sautés) — contour pointillé + remplissage (gris puis hachures)
    const gOut=[], gFill=[];
    for(let i=0;i<NGHOST;i++){
      gFill.push(mk('rect',{x:GX-BW/2,y:brickBotY(i),width:BW,height:0,rx:4,fill:DEAD,opacity:0}));
      gOut.push(mk('rect',{x:GX-BW/2,y:brickTopY(i),width:BW,height:BH,rx:4,fill:'none',stroke:INK,'stroke-width':4,'stroke-dasharray':'11 9',opacity:0}));
    }
    // TOISE — cursor de mesure horizontal (teal fin) : ce qui est mesurable est comptable
    const toise=mk('line',{stroke:YOU,'stroke-width':3,'stroke-linecap':'round',opacity:0});
    function setToise(x1,x2,y,op){toise.setAttribute('x1',x1);toise.setAttribute('x2',x2);toise.setAttribute('y1',y.toFixed(1));toise.setAttribute('y2',y.toFixed(1));toise.setAttribute('opacity',clamp(op,0,1).toFixed(3));}
    function hideToise(){toise.setAttribute('opacity',0);}

    // helpers colonnes
    function setReal(n,baseOp){ for(let i=0;i<NREAL;i++){ const on=i<n; real[i].setAttribute('opacity',(on?baseOp:0).toFixed(3)); } }
    function realTopY(n){ return brickTopY(Math.max(0,n-1)); }
    function setGhostOutline(i,op){ gOut[i].setAttribute('opacity',clamp(op,0,1).toFixed(3)); }
    function setGhostFill(i,frac,mode){ const h=BH*clamp(frac,0,1); gFill[i].setAttribute('height',h.toFixed(1)); gFill[i].setAttribute('y',(brickBotY(i)-h).toFixed(1)); gFill[i].setAttribute('fill',mode==='hatch'?'url(#hatch)':DEAD); gFill[i].setAttribute('opacity',(frac>0?1:0).toFixed(3)); }
    function hideGhost(){ for(let i=0;i<NGHOST;i++){ setGhostOutline(i,0); setGhostFill(i,0); } }
    function ghostTopY(n){ return brickTopY(Math.max(0,n-1)); }

    // ── QUESTION (§M15) ──
    const QLINES=['WHERE DO HALF','YOUR LOSSES HIDE'];
    const FS=88,lineH=110,y0=250,qY=QLINES.map((s,li)=>y0+li*lineH);
    const qEls=QLINES.map((s,li)=>{const e=mk('text',{x:CX,y:qY[li],'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':FS,'letter-spacing':'1',opacity:0});e.textContent=s;return e;});
    const QMY=y0+2*lineH+150,qMark=mk('text',{x:CX,y:QMY,'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':200,opacity:0});qMark.textContent='?';
    function hideQ(){for(const e of qEls)e.setAttribute('opacity',0);qMark.setAttribute('opacity',0);}

    // ── ÉTIQUETTES (§M18 clamp) ──
    function caption(){return mk('text',{'text-anchor':'middle','font-family':'Helvetica Neue, Arial, sans-serif','font-weight':700,'font-size':40,'letter-spacing':'1.5',opacity:0});}
    const capReal=caption(),capGhost=caption();
    function putCap(el,txt,cx,y,color,op){el.textContent=txt;const hw=txt.length*(+el.getAttribute('font-size'))*0.30,x=clamp(+cx,40+hw,1040-hw);el.setAttribute('x',x.toFixed(1));el.setAttribute('y',y);el.setAttribute('fill',color);el.setAttribute('opacity',clamp(op,0,1).toFixed(3));}
    function hideCaps(){capReal.setAttribute('opacity',0);capGhost.setAttribute('opacity',0);}

    // ═══ S1 — question + la colonne PLEINE se monte (accroche 1re s), le vide à droite reste inerte ═══
    function s1(lf,t,s){
      const u=t-s; hideCaps(); hideGhost();
      const gf=clamp(1-(lf-0.82)/0.10,0,1);
      for(let k=0;k<qEls.length;k++){const qt=(k===0?0.18:u-(0.1+k*0.28)),ap=clamp(qt/0.18,0,1),sc=0.7+0.3*backOut(ap);qEls[k].setAttribute('opacity',(clamp(ap,0,1)*gf).toFixed(3));qEls[k].setAttribute('transform',`translate(${(CX*(1-sc)).toFixed(2)} ${(qY[k]*(1-sc)).toFixed(2)}) scale(${sc.toFixed(3)})`);}
      const qm=u-0.9,qap=clamp(qm/0.2,0,1),qsc=0.6+0.4*backOut(qap);qMark.setAttribute('opacity',(clamp(qap,0,1)*gf).toFixed(3));qMark.setAttribute('transform',`translate(${(CX*(1-qsc)).toFixed(2)} ${(QMY*(1-qsc)).toFixed(2)}) scale(${qsc.toFixed(3)})`);
      // §perf : les briques pleines montent dès la 1re seconde (accroche visuelle) — 4 briques, brique par brique
      let n=0; for(let i=0;i<4;i++){ const t0=0.3+i*0.42; const a=clamp((u-t0)/0.34,0,1); if(a>0){ n=i+1; const settle=1-0.12*Math.exp(-6*Math.max(0,u-t0-0.34))*Math.sin(20*(u-t0-0.34)); real[i].setAttribute('opacity',a.toFixed(3)); real[i].setAttribute('transform',`translate(0 ${((1-a)*24).toFixed(1)})`);} else real[i].setAttribute('opacity',0);}
      for(let i=4;i<NREAL;i++) real[i].setAttribute('opacity',0);
      // TENUE VIVANTE : la toise mesure la colonne de bas en haut, en continu — c'est le propos
      if(u>2.6){ const amp=BASEY-realTopY(4); const ph=0.5-0.5*Math.cos((u-2.6)*1.5); const y=BASEY-amp*ph; setToise(LX-BW/2-24,LX+BW/2+24,y,0.85);} else hideToise();
    }
    // ═══ S2 — la colonne PLEINE s'étoffe (6 briques), étiquetée, comptable ; toise continue ═══
    function s2(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideGhost();
      for(let i=0;i<4;i++){ real[i].setAttribute('opacity',1); real[i].setAttribute('transform','translate(0 0)'); }
      for(let i=4;i<NREAL;i++){ const t0=(i-4)*0.7; const a=clamp((u-t0)/0.4,0,1); real[i].setAttribute('opacity',a.toFixed(3)); real[i].setAttribute('transform',`translate(0 ${((1-a)*24).toFixed(1)})`); }
      putCap(capReal,'LOSSES YOU TOOK',LX,BASEY+70,INK,(u-0.4)/0.5);
      // toise continue de mesurer les 6 briques : solides, douloureuses, mais LÀ
      const amp=BASEY-realTopY(NREAL); const ph=0.5-0.5*Math.cos((u+0.4)*1.4); const y=BASEY-amp*ph; setToise(LX-BW/2-24,LX+BW/2+24,y,0.85);
    }
    // ═══ S3 — le vide se peuple : briques FANTÔMES pointillées, sans poids, qui PULSENT (elles hantent) ═══
    function s3(lf,t,s){
      const u=t-s; hideQ(); hideCaps();
      setReal(NREAL,1);                                   // la pleine ne bouge pas : elle est réglée
      putCap(capReal,'LOSSES YOU TOOK',LX,BASEY+70,INK,1);
      for(let i=0;i<NGHOST;i++) setGhostFill(i,0);
      let n=0; for(let i=0;i<6;i++){ const t0=i*0.34; const a=clamp((u-t0)/0.3,0,1); if(a>0){ n=i+1; const puls=(a>=1)?(0.35+0.35*(0.5+0.5*Math.sin(u*2.2+i*1.3))):a*0.7; setGhostOutline(i,puls); gOut[i].setAttribute('transform',`translate(0 ${((1-a)*22).toFixed(1)})`);} else setGhostOutline(i,0);}
      for(let i=6;i<NGHOST;i++) setGhostOutline(i,0);
      putCap(capGhost,'WINNERS YOU SKIPPED',GX,ghostTopY(6)-34,INK,(u-1.8)/0.5);
      // TENUE VIVANTE : une toise essaie de MESURER les fantômes — le propos (des pertes, mais qu'on ne compte pas)
      const amp=BASEY-ghostTopY(Math.max(1,n)); const y=BASEY-amp*(0.5-0.5*Math.cos(u*1.6));
      setToise(GX-BW/2-24,GX+BW/2+24,y,clamp((u-1.2)/0.6,0,1)*0.6);
    }
    // ═══ S4 — L'ESCALADE : la fantôme monte 2 pour 1, dépasse (1.6×), puis SE GRISE (la perte qu'on ne compte pas) ═══
    function s4(lf,t,s){
      const u=t-s; hideQ(); hideCaps();
      setReal(NREAL,1); putCap(capReal,'LOSSES YOU TOOK',LX,BASEY+70,INK,1);
      // accumulation cadencée : 6 -> 10 briques fantômes (deux fantômes pour une pleine — la fantôme domine)
      const grow=eOut(clamp(u/3.0,0,1)); const nG=Math.round(6+4*grow);
      for(let i=0;i<NGHOST;i++){ const on=i<nG; if(on){ const a=(i<6)?1:clamp((u-((i-6)/4)*2.6)/0.4,0,1); const puls=0.40+0.26*(0.5+0.5*Math.sin(u*2.0+i)); setGhostOutline(i,a>=1?puls:a*0.7); gOut[i].setAttribute('transform',`translate(0 ${((1-a)*22).toFixed(1)})`);} else setGhostOutline(i,0); }
      // beat final : délavage GRIS bas->haut (M-COULEUR, dérive progressive, jamais un cut) — ces pertes-là aussi sont des pertes
      const grey=clamp((u-3.0)/1.2,0,1);
      for(let i=0;i<NGHOST;i++){ if(i<nG){ const local=clamp((grey*(nG+1))-i,0,1); setGhostFill(i,local,'grey'); } }
      // TENUE VIVANTE : la toise monte le long de la fantôme qui domine — on POURRAIT la mesurer si on la comptait
      const amp=BASEY-ghostTopY(nG); const y=BASEY-amp*(0.5-0.5*Math.cos((u+0.3)*1.3));
      setToise(GX-BW/2-24,GX+BW/2+24,y,0.55);
      putCap(capGhost,'WINNERS YOU SKIPPED',GX,ghostTopY(nG)-34,(grey>0.4?DEAD:INK),1);
    }
    // ═══ S5 — DÉCHARGE : on ne récupère pas les fantômes — on les COMPTE (gris -> hachuré). Les deux lisibles. Tenue. ═══
    function s5(lf,t,s){
      const u=t-s; hideQ(); hideCaps();
      setReal(NREAL,1); putCap(capReal,'LOSSES YOU TOOK',LX,BASEY+70,INK,1);
      const nG=NGHOST;
      // une par une, la brique fantôme grise passe en HACHURÉ (comptée)
      for(let i=0;i<nG;i++){ const t0=i*0.16; const counted=clamp((u-t0)/0.4,0,1); setGhostFill(i,1,counted>=0.5?'hatch':'grey'); setGhostOutline(i,0.55); }
      putCap(capGhost,'COUNTED — NOT RECOVERED',GX,ghostTopY(nG)-34,DEAD,(u-0.4)/0.5);
      // TENUE VIVANTE (image finale) : la toise mesure MAINTENANT les deux colonnes — tout est comptable, l'histoire entière se lit
      const amp=BASEY-ghostTopY(nG); const ph=0.5-0.5*Math.cos((u+0.5)*0.9); const y=BASEY-amp*ph; setToise(LX-BW/2-24,GX+BW/2+24,y,0.7);
    }

    const RENDER={s1,s2,s3,s4,s5};const SCENEFN=SPEC.map(s=>RENDER[s.id]||s1);
    const clock={t:0};
    function sceneAt(t){let i=0;for(let k=0;k<SC.length;k++){if(t>=SC[k].s-1e-6)i=k;}return Math.min(i,SCENEFN.length-1);}
    function render(){const t=clock.t;const i=sceneAt(t),lf=clamp((t-SC[i].s)/SC[i].d,0,1);SCENEFN[i](lf,t,SC[i].s);}
    const tl=gsap.timeline({paused:true});
    tl.to(clock,{t:TOTAL,duration:TOTAL,ease:'none',onUpdate:render},0);
    tl.to(SVG,{opacity:1,duration:0.001},TOTAL-0.001);
    window.__timelines=window.__timelines||{};window.__timelines['main']=tl;
  </script>
</body>
</html>
