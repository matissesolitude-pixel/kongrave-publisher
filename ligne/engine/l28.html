<!doctype html>
<html lang="en" data-resolution="portrait" data-fps="30">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>:root{--paper:#F2EFE7}*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}#stage{position:absolute;inset:0}svg{position:absolute;inset:0;width:1080px;height:1920px}</style>
</head>
<body>
  <!-- L28 « THE MARKET THAT PAYS TO WAIT » (reproduction badlabels — putCap MESURÉ copié de l26, et TOUTES les étiquettes hors des colonnes
       animées : plus AUCUN texte dans la colonne des ticks de funding — le défaut du refus, « A RECEIVES », « COMPOUNDS », « THE DRIFT TURNS
       ANYWAY » étaient traversés par les jetons). Les étiquettes vivent en zone VIDE : au-dessus des jauges (y<660), sous toute l'animation
       (y>1230), ou étroites dans la gouttière centrale (x 400-680, entre les deux colonnes). TOI = deux jauges teal identiques (A gauche, B
       droite), fusil = leur dérive de funding OPPOSÉE cachée. S1 : jumelles parfaites déjà pleines (levier CURIOSITÉ). S2 : le mécanisme —
       des jetons REMONTENT dans A (reçoit, teal), TOMBENT hors de B (paie, gris). S3 : l'angle mort — les yeux braqués sur le prix (plat)
       pendant que la dérive ticke, ignorée. S4 : LA scène — les cycles défilent, ça COMPOSE : socle teal soulève A, dette grise leste B et
       son break-even recule. S5 : décharge — vérifier le SENS avant de tenir, choisir le vent arrière (le regard descend sous la jauge).
       Doctrine : aucun chiffre ; teal = reçu/vent arrière, gris = payé/dette (pas de rouge, pas de brun) ; TOI = jauge, jamais une figure ;
       bas du cadre vide. Mouvement à vitesse CONSTANTE (flottement épicyclique + ticks) : jamais de point mort. -->
  <div id="stage" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="1"><svg id="svg" viewBox="0 0 1080 1920"></svg></div>
  <script>
    const TOTAL=__TOTAL__, SC=__SCENES__, SPEC=__SPEC__;
    const NS='http://www.w3.org/2000/svg', SVG=document.getElementById('svg');
    const YOU='#1E5F6E', INK='#20242A', PAPER='#F2EFE7', DEAD='#474D50';
    const CX=540;
    function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);(p||SVG).appendChild(e);return e;}
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,f)=>a+(b-a)*clamp(f,0,1),eIn=f=>f*f,eOut=f=>1-(1-f)*(1-f),eInOut=f=>f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
    const backOut=(p,s)=>{s=(s==null?1.9:s);const q=clamp(p,0,1)-1;return 1+(s+1)*q*q*q+s*q*q;};
    const setOp=(el,o)=>el.setAttribute('opacity',clamp(o,0,1).toFixed(3));
    const hx=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
    const mix=(a,b,f)=>{const A=hx(a),B=hx(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],f))).join(',')})`;};
    // FLOTTEMENT ÉPICYCLIQUE : deux cercles superposés → la vitesse ne s'annule JAMAIS (un simple sin se fige à ses
    // extrêmes = point mort du scan). Les jauges, objets les plus contrastés, dérivent donc toujours d'une frame à l'autre.
    function epi(u,ph){return [10*Math.sin(u*2.2+ph)+5*Math.sin(u*1.35+ph+1.0), 8*Math.cos(u*2.2+ph)+4*Math.cos(u*1.35+ph+1.0)];}

    // ── LES DEUX POSITIONS (jauges teal identiques) — A gauche, B droite ──
    const GAx=330, GBx=750, GW=140, GBASE=1010, GFULL=320, GTOP=GBASE-GFULL;   // top ≈ 690
    const GXS=[GAx,GBx];
    const gauges=GXS.map(()=>mk('rect',{width:GW,rx:6,fill:YOU,opacity:0}));
    const bases =GXS.map(()=>mk('line',{stroke:INK,'stroke-width':6,opacity:0}));
    function setGauge(i,h,lift,wash,op,dx,dy){const x=GXS[i]+(dx||0), botY=GBASE-(lift||0)+(dy||0);
      gauges[i].setAttribute('x',(x-GW/2).toFixed(1));gauges[i].setAttribute('width',GW);
      gauges[i].setAttribute('y',(botY-h).toFixed(1));gauges[i].setAttribute('height',Math.max(3,h).toFixed(1));
      gauges[i].setAttribute('fill',mix(YOU,DEAD,wash||0));setOp(gauges[i],op);
      bases[i].setAttribute('x1',(x-92).toFixed(1));bases[i].setAttribute('x2',(x+92).toFixed(1));
      bases[i].setAttribute('y1',(botY+8).toFixed(1));bases[i].setAttribute('y2',(botY+8).toFixed(1));setOp(bases[i],op);}

    // ── LA DÉRIVE (flèche haut = reçu/teal · flèche bas = payé/gris) ──
    const drifts=GXS.map(()=>mk('path',{fill:'none','stroke-width':11,'stroke-linecap':'round','stroke-linejoin':'round',opacity:0}));
    function arrowPath(x,y,up,H){const t=up?y-H:y+H;return `M ${x} ${(up?y+H:y-H)} L ${x} ${t} M ${x-19} ${(up?y-H+19:y+H-19)} L ${x} ${t} L ${x+19} ${(up?y-H+19:y+H-19)}`;}
    function setDrift(i,x,y,up,H,color,op){drifts[i].setAttribute('d',arrowPath(x,y,up,H||22));drifts[i].setAttribute('stroke',color);setOp(drifts[i],op);}
    function hideDrift(){for(let i=0;i<2;i++)setOp(drifts[i],0);}

    // ── LE FUNDING QUI TICKE : jetons (reçoit/paie) — vie continue en POSITION, colonne COURTE (y 1032→1150) ──
    const FLOWN=5, FTOP=GBASE+22, FBOT=1150;
    const flows=[[],[]]; for(let g=0;g<2;g++)for(let i=0;i<FLOWN;i++)flows[g].push(mk('rect',{width:38,height:11,rx:5,opacity:0}));
    function setFlow(g,x,up,color,op,speed,u){const range=FBOT-FTOP;
      for(let i=0;i<FLOWN;i++){const ph=((u*speed)+i/FLOWN)%1, p=up?(1-ph):ph, y=FTOP+p*range, edge=Math.min(ph,1-ph);
        const e=flows[g][i];e.setAttribute('x',(x-19).toFixed(1));e.setAttribute('y',y.toFixed(1));
        e.setAttribute('fill',color);setOp(e,op*clamp(edge*7,0,1));}}
    function hideFlow(g){for(let i=0;i<FLOWN;i++)setOp(flows[g][i],0);}

    // ── LE POULS INTERNE (la position vit) : une barre claire remonte la jauge en boucle (vitesse constante) ──
    const PULSE=[[],[]]; for(let g=0;g<2;g++)for(let i=0;i<3;i++)PULSE[g].push(mk('rect',{width:GW-26,height:10,rx:4,opacity:0}));
    function setPulse(g,x,botY,topY,op,speed,u){const range=botY-topY;
      for(let i=0;i<3;i++){const ph=((u*speed)+i/3)%1, y=botY-ph*range, edge=Math.min(ph,1-ph);
        const e=PULSE[g][i];e.setAttribute('x',(x-(GW-26)/2).toFixed(1));e.setAttribute('y',y.toFixed(1));
        e.setAttribute('width',GW-26);e.setAttribute('fill',PAPER);setOp(e,op*clamp(edge*6,0,1));}}
    function hidePulse(){for(let g=0;g<2;g++)for(let i=0;i<3;i++)setOp(PULSE[g][i],0);}

    // ── L'ACCUMULATION (S4) : socle teal sous A (vent arrière) · dette grise sous B ──
    const accum=GXS.map((x,i)=>mk('rect',{fill:i===0?YOU:DEAD,rx:5,opacity:0}));
    function setAccum(i,cx,h,op){accum[i].setAttribute('x',(cx-GW/2).toFixed(1));accum[i].setAttribute('width',GW);
      if(i===0){accum[i].setAttribute('y',(GBASE-h).toFixed(1));}      // socle : sous la jauge soulevée
      else{accum[i].setAttribute('y',GBASE.toFixed(1));}               // dette : sous la base, vers le bas
      accum[i].setAttribute('height',Math.max(2,h).toFixed(1));setOp(accum[i],op);}
    // le break-even de B qui RECULE plus haut (ligne pointillée)
    const beLine=mk('line',{stroke:DEAD,'stroke-width':6,'stroke-dasharray':'18 12',opacity:0});
    function setBE(y,op,u){beLine.setAttribute('x1',(GBx-116).toFixed(1));beLine.setAttribute('x2',(GBx+116).toFixed(1));
      beLine.setAttribute('y1',y.toFixed(1));beLine.setAttribute('y2',y.toFixed(1));beLine.setAttribute('stroke-dashoffset',(u*16).toFixed(0));setOp(beLine,op);}

    // ── LE CYCLE JOUR/NUIT (S4) : un pip qui balaie un rail, cadence qui presse ──
    const cycTrack=mk('line',{x1:300,x2:780,y1:632,y2:632,stroke:INK,'stroke-width':3,opacity:0});
    const cycPip=mk('circle',{r:14,fill:INK,opacity:0});
    function setCycle(phase,op){setOp(cycTrack,op*0.5);
      const x=540+228*Math.sin(phase);cycPip.setAttribute('cx',x.toFixed(1));cycPip.setAttribute('cy',632);setOp(cycPip,op);}
    function hideCycle(){setOp(cycTrack,0);setOp(cycPip,0);}

    // ── LE REGARD (S3 braqué en haut · S5 descend vérifier) ──
    const eyes=GXS.map(()=>mk('ellipse',{fill:'none',stroke:INK,'stroke-width':7,rx:52,ry:30,opacity:0}));
    const pupils=GXS.map(()=>mk('circle',{r:16,fill:INK,opacity:0}));
    function setEye(i,cx,cy,dx,dy,op){eyes[i].setAttribute('cx',cx.toFixed(1));eyes[i].setAttribute('cy',cy.toFixed(1));setOp(eyes[i],op);
      pupils[i].setAttribute('cx',(cx+dx).toFixed(1));pupils[i].setAttribute('cy',(cy+dy).toFixed(1));setOp(pupils[i],op);}
    function hideEyes(){for(let i=0;i<2;i++){setOp(eyes[i],0);setOp(pupils[i],0);}}

    // ── LE PRIX (S3) : une flèche en haut qui reste PLATE ──
    const priceArrow=GXS.map(()=>mk('path',{fill:'none',stroke:INK,'stroke-width':9,'stroke-linecap':'round','stroke-linejoin':'round',opacity:0}));
    function setPrice(i,x,y,up,op){priceArrow[i].setAttribute('d',arrowPath(x,y,up,20));setOp(priceArrow[i],op);}
    function hidePrice(){for(let i=0;i<2;i++)setOp(priceArrow[i],0);}

    // ── L'ALTERNATIVE BARRÉE (S5) : la dette grise refusée ──
    const altBlock=mk('rect',{fill:DEAD,rx:5,width:118,height:150,opacity:0});
    const altX=[mk('line',{stroke:INK,'stroke-width':8,opacity:0}),mk('line',{stroke:INK,'stroke-width':8,opacity:0})];
    function setAlt(x,y,op){altBlock.setAttribute('x',(x-59).toFixed(1));altBlock.setAttribute('y',(y-75).toFixed(1));setOp(altBlock,op*0.85);
      altX[0].setAttribute('x1',x-72);altX[0].setAttribute('y1',y-86);altX[0].setAttribute('x2',x+72);altX[0].setAttribute('y2',y+86);setOp(altX[0],op);
      altX[1].setAttribute('x1',x+72);altX[1].setAttribute('y1',y-86);altX[1].setAttribute('x2',x-72);altX[1].setAttribute('y2',y+86);setOp(altX[1],op);}
    function hideAlt(){setOp(altBlock,0);setOp(altX[0],0);setOp(altX[1],0);}

    // ── QUESTION (§M15) — 1re ligne pleine dès la frame 0 ──
    const QLINES=['SAME TRADE —','WHY IS ONE','PAID TO HOLD'];
    const FS=72,lineH=88,y0=182,qY=QLINES.map((s,li)=>y0+li*lineH);
    const qEls=QLINES.map((s,li)=>{const e=mk('text',{x:CX,y:qY[li],'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':FS,'letter-spacing':'1',opacity:0});e.textContent=s;return e;});
    const QMY=y0+3*lineH+66,qMark=mk('text',{x:CX,y:QMY,'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':140,opacity:0});qMark.textContent='?';
    qEls.forEach(e=>{const t=e.textContent,f=Math.min(FS,930/Math.max(1,t.length*0.66));e.setAttribute('font-size',f.toFixed(1));});
    function hideQ(){for(const e of qEls)setOp(e,0);setOp(qMark,0);}

    // ── ÉTIQUETTES (§M18) — putCap MESURÉ (getComputedTextLength), copié de l26 : borne le centre par la demi-largeur RÉELLE ──
    function caption(sz){return mk('text',{'text-anchor':'middle','font-family':'Helvetica Neue, Arial, sans-serif','font-weight':(sz>44?800:700),'font-size':(sz||36),'data-fs':(sz||36),'letter-spacing':'1.5',opacity:0});}
    const capA=caption(40),capB=caption(44),capC=caption(36),capD=caption(36),capE=caption(34),capF=caption(34),capG=caption(34),capH=caption(34);
    function putCap(el,txt,cx,y,color,op){
      const MARGIN=70, MAXW=1080-2*MARGIN;
      if(el.__cap!==txt){ el.__cap=txt; el.textContent=txt;
        const nom=+el.getAttribute('data-fs')||+el.getAttribute('font-size')||38;
        el.setAttribute('font-size',nom);
        let w=el.getComputedTextLength()||0;
        if(!w) w=txt.length*nom*0.72;   // repli si la mesure échoue : estimation LARGE (>0.66) — jamais pire qu'avant
        if(w>MAXW){ const fs=Math.max(18,nom*MAXW/w); el.setAttribute('font-size',fs.toFixed(1)); w=el.getComputedTextLength()||txt.length*fs*0.72; }
        el.__hw=w/2;
      }
      const x=clamp(+cx, MARGIN+el.__hw, 1080-MARGIN-el.__hw);
      el.setAttribute('x',x.toFixed(1));el.setAttribute('y',y);el.setAttribute('fill',color);setOp(el,op);}
    function hideCaps(){for(const e of [capA,capB,capC,capD,capE,capF,capG,capH])setOp(e,0);}

    function hideExtras(){for(let g=0;g<2;g++)hideFlow(g);hidePulse();hideDrift();for(let i=0;i<2;i++)setOp(accum[i],0);
      setOp(beLine,0);hideCycle();hideEyes();hidePrice();hideAlt();}

    // ═══ S1 — LES JUMELLES : deux positions identiques, une dérive cachée opposée ═══
    // Verbe visuel : le miroir (deux objets identiques dont un est secrètement différent).
    function s1(lf,t,s){
      const u=t-s; hideCaps(); hideExtras();
      const gf=clamp(1-(lf-0.86)/0.10,0,1);
      for(let k=0;k<qEls.length;k++){const qt=(k===0?0.18:u-(0.1+k*0.26)),ap=clamp(qt/0.18,0,1),sc=0.7+0.3*backOut(ap);setOp(qEls[k],ap*gf);qEls[k].setAttribute('transform',`translate(${(CX*(1-sc)).toFixed(2)} ${(qY[k]*(1-sc)).toFixed(2)}) scale(${sc.toFixed(3)})`);}
      const qm=u-1.0,qap=clamp(qm/0.2,0,1),qsc=0.6+0.4*backOut(qap);setOp(qMark,qap*gf);qMark.setAttribute('transform',`translate(${(CX*(1-qsc)).toFixed(2)} ${(QMY*(1-qsc)).toFixed(2)}) scale(${qsc.toFixed(3)})`);
      // ── ÉMOTION FRAME 0 (levier CURIOSITÉ) : les deux jauges sont DÉJÀ pleines, jumelles parfaites, et elles
      //    dérivent (flottement épicyclique). Rien ne se construit : l'énigme (pourquoi l'une paierait ?) est entière à t=0.
      const eA=epi(u,0), eB=epi(u,0.6);
      setGauge(0,GFULL,0,0,1,eA[0],eA[1]);
      setGauge(1,GFULL,0,0,1,eB[0],eB[1]);
      // les positions sont VIVANTES : un pouls interne identique remonte les deux jauges
      setPulse(0,GAx+eA[0],GBASE-14+eA[1],GTOP+16+eA[1],1,0.42,u);
      setPulse(1,GBx+eB[0],GBASE-14+eB[1],GTOP+16+eB[1],1,0.42,u);
      putCap(capA,'POSITION A',GAx,640,YOU,1);                          // AU-DESSUS de la jauge (zone vide)
      putCap(capB,'POSITION B',GBx,640,YOU,1);
      // la micro-dérive cachée, opposée : sous A une flèche haut, sous B une flèche bas — à peine visibles
      const hint=clamp((u-1.9)/1.2,0,1)*0.5;
      setDrift(0,GAx,1200+4*Math.sin(u*1.7),true ,17,YOU ,hint);
      setDrift(1,GBx,1200+4*Math.sin(u*1.7+1.2),false,17,DEAD,hint);
      putCap(capC,'IDENTICAL — SAME SIZE, SAME WAY',CX,1310,DEAD,clamp((u-2.6)/0.8,0,1)*gf);   // SOUS tout (zone vide)
    }

    // ═══ S2 — LE MÉCANISME : le funding remonte dans A, sort de B ═══
    // Verbe visuel : le flux qui s'inverse (des jetons ENTRENT dans A, SORTENT de B).
    function s2(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideExtras();
      const eA=epi(u,0), eB=epi(u,0.6);
      setGauge(0,GFULL,0,0,1,eA[0],eA[1]);
      setGauge(1,GFULL,0,0,1,eB[0],eB[1]);
      putCap(capA,'POSITION A',GAx,652,YOU,1);
      putCap(capB,'POSITION B',GBx,652,YOU,1);
      // le flux funding se révèle puis TICKE en continu, en position
      const rev=clamp((u-0.4)/1.2,0,1);
      setFlow(0,GAx,true ,YOU ,rev,0.5,u);   // A reçoit : jetons teal qui remontent
      setFlow(1,GBx,false,DEAD,rev,0.5,u);   // B paie   : jetons gris qui descendent
      // les deux flèches se CONFIRMENT (sous les colonnes de ticks, zone déjà libre en bas)
      const cf=clamp((u-1.6)/0.8,0,1);
      setDrift(0,GAx,1200+4*Math.sin(u*1.9),true ,22,YOU ,cf);
      setDrift(1,GBx,1200+4*Math.sin(u*1.9+1.1),false,22,DEAD,cf);
      putCap(capC,'A RECEIVES',GAx,1305,YOU,cf);                        // SOUS la flèche (y>1230) : plus aucun tick ici
      putCap(capD,'B PAYS',GBx,1305,DEAD,cf);
      putCap(capE,'HOLDING IS BORROWING — YOUR SIDE DECIDES',CX,578,INK,clamp((u-3.0)/0.9,0,1));  // AU-DESSUS des jauges
    }

    // ═══ S3 — L'ANGLE MORT : tous les yeux sur le prix (plat), le funding tourne ignoré ═══
    // Verbe visuel : le regard braqué (l'attention fixée en haut, la dérive travaille en bas, non vue).
    function s3(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideExtras();
      const eA=epi(u,0), eB=epi(u,0.6);
      setGauge(0,GFULL,0,0,1,eA[0]*0.5,eA[1]*0.5);
      setGauge(1,GFULL,0,0,1,eB[0]*0.5,eB[1]*0.5);
      // le prix, en haut, reste PLAT (micro-tremblement) — l'attention s'y colle
      const jit=3*Math.sin(u*3.1)+1.5*Math.sin(u*4.7);
      setPrice(0,GAx,612+jit,true,1);
      setPrice(1,GBx,612-jit,true,1);
      // les regards braqués vers le HAUT (pupille tirée vers le prix), qui tremblent
      const px=2*Math.sin(u*2.3), py=-13+2*Math.sin(u*3.3);
      setEye(0,GAx,500,px,py,1);
      setEye(1,GBx,500,-px,py,1);
      putCap(capA,'EYES ON PRICE',CX,442,INK,clamp((u-0.6)/0.7,0,1));   // tout en haut (zone vide)
      putCap(capB,'PRICE FLAT',CX,586,DEAD,clamp((u-1.2)/0.7,0,1));   // gouttière centrale, entre les deux flèches prix
      // dessous, le funding TICKE quand même : A reçoit, B paie — dans l'angle mort
      setFlow(0,GAx,true ,YOU ,1,0.48,u);
      setFlow(1,GBx,false,DEAD,1,0.48,u);
      setDrift(0,GAx,1200+4*Math.sin(u*1.9),true ,20,YOU ,0.85);
      setDrift(1,GBx,1200+4*Math.sin(u*1.9+1.1),false,20,DEAD,0.85);
      putCap(capE,'THE DRIFT TICKS ANYWAY',CX,1315,DEAD,clamp((u-2.4)/0.9,0,1));   // SOUS tout (y>1230)
    }

    // ═══ S4 — LA SCÈNE : les cycles défilent, la dérive COMPOSE ═══
    // Verbe visuel : l'accumulation qui compose (socle teal soulève A · dette grise + break-even reculent B).
    function s4(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideExtras();
      const grow=clamp(u/3.2,0,1);
      const lift=104*grow*grow, debt=112*grow*grow, bR=118*grow;        // ça COMPOSE (accélère)
      const eA=epi(u,0), eB=epi(u,0.6);
      // A : portée par un socle teal (vent arrière) qui la soulève
      setAccum(0,GAx,lift,1);
      setGauge(0,GFULL,lift,0,1,eA[0]*0.6,eA[1]*0.6);
      putCap(capA,'PAID TO WAIT',GAx,1300,YOU,clamp((u-0.8)/0.7,0,1));   // SOUS l'ensemble (y>1230), pas dans la colonne de ticks
      // B : lestée par une dette grise, et son seuil de rentabilité RECULE plus haut
      setAccum(1,GBx,debt,0.9);
      setGauge(1,GFULL,0,0.30*grow,1,eB[0]*0.6,eB[1]*0.6);
      const beY=GTOP-30-bR;                                             // recule au-dessus de la jauge B
      setBE(beY,clamp((u-0.8)/0.7,0,1),u);
      putCap(capB,'BREAK-EVEN RISES',780,beY-50,DEAD,clamp((u-1.2)/0.8,0,1));  // TOUJOURS au-dessus de la ligne BE (jamais traversé)
      putCap(capD,'CHARGED TO WAIT',GBx,1300,DEAD,clamp((u-1.4)/0.7,0,1));
      // la cadence qui presse est portée par le funding qui accélère (pas de rail cycle : il encombrait la scène)
      setFlow(0,GAx,true ,YOU ,1,0.46+0.5*grow,u);
      setFlow(1,GBx,false,DEAD,1,0.46+0.5*grow,u);
      putCap(capE,'SAME START — OPPOSITE DRIFT COMPOUNDS',CX,1385,INK,clamp((u-2.6)/0.9,0,1));  // tout en bas (y>1230)
    }

    // ═══ S5 — DÉCHARGE : vérifier le SENS avant de tenir, choisir le vent arrière ═══
    // Verbe visuel : la vérification (le regard DESCEND sous la jauge lire la dérive, on choisit le côté payé).
    function s5(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideExtras();
      const SX=470;                                                     // une jauge unique, recentrée à gauche du centre
      const e0=epi(u,0);
      setGauge(0,GFULL,0,0,1,e0[0],e0[1]); gauges[0].setAttribute('x',(SX-GW/2+e0[0]).toFixed(1));
      gauges[0].setAttribute('y',(GBASE+e0[1]-GFULL).toFixed(1));setOp(gauges[0],1);
      bases[0].setAttribute('x1',(SX-92+e0[0]).toFixed(1));bases[0].setAttribute('x2',(SX+92+e0[0]).toFixed(1));
      bases[0].setAttribute('y1',(GBASE+8+e0[1]).toFixed(1));bases[0].setAttribute('y2',(GBASE+8+e0[1]).toFixed(1));setOp(bases[0],1);
      setOp(gauges[1],0);setOp(bases[1],0);
      // la position vérifiée est PAYÉE : un pouls teal remonte en continu (vent arrière, vie continue tout du long)
      setPulse(0,SX+e0[0],GBASE-14+e0[1],GTOP+16+e0[1],1,0.5,u);
      putCap(capA,'YOUR POSITION',SX,652,YOU,1);
      // le regard DESCEND : d'abord en haut (prix), puis il glisse SOUS la jauge (funding), s'arrête AU-DESSUS de la flèche
      const desc=eInOut(clamp((u-0.6)/1.4,0,1)), ey=lerp(560,1170,desc);
      setEye(0,SX,ey,2*Math.sin(u*2.4),lerp(-11,13,desc)+2*Math.sin(u*3.2),1);
      putCap(capC,'CHECK THE FUNDING, NOT JUST PRICE',CX,578,INK,clamp((u-1.0)/0.8,0,1));  // au-dessus (zone vide)
      // on lit la dérive sous la jauge, et on ORIENTE vers le côté payé (flèche haut teal + socle)
      const choose=clamp((u-2.4)/1.0,0,1);
      setAccum(0,SX,66*choose,choose);
      setDrift(0,SX,1268,true,24,YOU,clamp((u-2.0)/0.7,0,1));               // sous le regard, séparée de lui
      putCap(capD,'PAYS YOU TO WAIT',SX,1360,YOU,clamp((u-2.8)/0.8,0,1));   // sous la flèche
      // l'alternative (dette grise) montrée BARRÉE, à droite
      setAlt(880,940,clamp((u-2.0)/0.9,0,1));
      putCap(capF,'NOT THIS SIDE',880,1090,DEAD,clamp((u-2.6)/0.8,0,1));    // sous le bloc barré, colonne droite libre
      putCap(capB,'KNOW WHICH DRIFT YOU ARE IN',CX,1418,INK,clamp((u-3.4)/0.9,0,1));  // tout en bas
    }

    const RENDER={s1,s2,s3,s4,s5};const SCENEFN=SPEC.map(s=>RENDER[s.id]||s1);
    const clock={t:0};
    function sceneAt(t){let i=0;for(let k=0;k<SC.length;k++){if(t>=SC[k].s-1e-6)i=k;}return Math.min(i,SCENEFN.length-1);}
    function render(){const t=clock.t;const i=sceneAt(t),lf=clamp((t-SC[i].s)/SC[i].d,0,1);SCENEFN[i](lf,t,SC[i].s);}
    const tl=gsap.timeline({paused:true});
    tl.to(clock,{t:TOTAL,duration:TOTAL,ease:'none',onUpdate:render},0);
    tl.to(SVG,{opacity:1,duration:0.001},TOTAL-0.001);
    window.__timelines=window.__timelines||{};window.__timelines['main']=tl;
  </script>
</body>
