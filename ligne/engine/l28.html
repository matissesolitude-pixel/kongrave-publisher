<!doctype html>
<html lang="en" data-resolution="portrait" data-fps="30">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>:root{--paper:#F2EFE7}*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}#stage{position:absolute;inset:0}svg{position:absolute;inset:0;width:1080px;height:1920px}</style>
</head>
<body>
  <!-- L28 « THE MARKET THAT PAYS TO WAIT » — TOI = deux jauges teal (deux positions identiques : A à gauche, B à droite). Le fusil = leur
       DÉRIVE de funding opposée, cachée. S1 : émotion frame 0 = levier CURIOSITÉ — deux jauges JUMELLES, parfaitement identiques (même
       sens, même taille), déjà pleines et vivantes ; mais dessous, une micro-dérive opposée se devine (A une flèche vers le haut, B vers
       le bas). Pourquoi l'une serait-elle payée ? S2 : le mécanisme funding se révèle — un flux de jetons remonte DANS A (elle reçoit,
       teal) et descend HORS de B (elle paie, gris) ; les deux flèches se confirment. S3 : l'angle mort — un gros regard braqué en HAUT sur
       le prix (une flèche qui reste plate), pendant que dessous le funding continue de tourner, ignoré. S4 : LA scène — les cycles jour/nuit
       défilent, ça compose : sous A une COLONNE teal pousse (vent arrière) et la soulève ; sous B une DETTE grise s'accumule et son seuil
       de rentabilité (break-even) RECULE plus haut. S5 : décharge — une jauge unique, le regard DESCEND vérifier le funding sous elle, on
       choisit le côté payé (flèche haut teal + socle qui pousse), l'alternative dette grise est barrée à côté. Doctrine : aucun chiffre ;
       teal = reçu/vent arrière, gris = payé/dette (pas de rouge, pas de brun) ; TOI = jauge teal jamais une figure ; bas du cadre vide. -->
  <div id="stage" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="1"><svg id="svg" viewBox="0 0 1080 1920"></svg></div>
  <script>
    const TOTAL=__TOTAL__, SC=__SCENES__, SPEC=__SPEC__;
    const NS='http://www.w3.org/2000/svg', SVG=document.getElementById('svg');
    const YOU='#1E5F6E', INK='#20242A', PAPER='#F2EFE7', DEAD='#474D50';
    const CX=540;
    function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);(p||SVG).appendChild(e);return e;}
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,f)=>a+(b-a)*clamp(f,0,1),eIn=f=>f*f,eOut=f=>1-(1-f)*(1-f),eInOut=f=>f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
    const backOut=(p,s)=>{s=(s==null?1.9:s);const q=clamp(p,0,1)-1;return 1+(s+1)*q*q*q+s*q*q;};
    const setOp=(el,o)=>el.setAttribute('opacity',clamp(o,0,1).toFixed(3));
    const hx=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
    const mix=(a,b,f)=>{const A=hx(a),B=hx(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],f))).join(',')})`;};

    // ── LES DEUX POSITIONS (jauges teal, identiques) — A à gauche, B à droite ──
    const GAx=340, GBx=740, GW=142, GBASE=1010, GFULL=330, GTOP=GBASE-GFULL;   // top ≈ 680
    const GXS=[GAx,GBx];
    const gauges=GXS.map(x=>mk('rect',{width:GW,rx:6,fill:YOU,opacity:0}));
    const bases =GXS.map(x=>mk('line',{x1:x-92,x2:x+92,stroke:INK,'stroke-width':6,opacity:0}));
    // dessine la jauge i : hauteur h, fond soulevé de `lift`, teinte lavée `wash`, décalage horizontal `dx`
    function setGauge(i,h,lift,wash,op,dx){const x=GXS[i]+(dx||0), bot=GBASE-(lift||0);
      gauges[i].setAttribute('x',(x-GW/2).toFixed(1));gauges[i].setAttribute('width',GW);
      gauges[i].setAttribute('y',(bot-h).toFixed(1));gauges[i].setAttribute('height',Math.max(3,h).toFixed(1));
      gauges[i].setAttribute('fill',mix(YOU,DEAD,wash||0));setOp(gauges[i],op);
      bases[i].setAttribute('x1',(x-92).toFixed(1));bases[i].setAttribute('x2',(x+92).toFixed(1));
      bases[i].setAttribute('y1',(GBASE+8).toFixed(1));bases[i].setAttribute('y2',(GBASE+8).toFixed(1));setOp(bases[i],op);}

    // ── LA DÉRIVE (flèche haut = reçu/teal · flèche bas = payé/gris) ──
    const drifts=GXS.map(()=>mk('path',{fill:'none','stroke-width':11,'stroke-linecap':'round','stroke-linejoin':'round',opacity:0}));
    function arrowPath(x,y,up,H){const t=up?y-H:y+H, hd=up?y-H+20:y+H-20, b=up?y+H:y-H;
      return `M ${x} ${b} L ${x} ${t} M ${x-20} ${hd} L ${x} ${t} L ${x+20} ${hd}`;}
    function setDrift(i,x,y,up,H,color,op){drifts[i].setAttribute('d',arrowPath(x,y,up,H||24));drifts[i].setAttribute('stroke',color);setOp(drifts[i],op);}

    // ── LE FUNDING QUI TICKE : un flux de jetons (reçoit / paie) — vie continue, en POSITION ──
    const FLOWN=6;
    const flows=[[],[]]; for(let g=0;g<2;g++)for(let i=0;i<FLOWN;i++)flows[g].push(mk('rect',{width:38,height:11,rx:5,opacity:0}));
    // g=0 (A) : les jetons REMONTENT vers la jauge (income). g=1 (B) : ils DESCENDENT et tombent (outflow).
    function setFlow(g,x,up,color,op,speed,u){const yTop=GBASE+58,yBot=1360,range=yBot-yTop;
      for(let i=0;i<FLOWN;i++){const ph=((u*speed)+i/FLOWN)%1, p=up?(1-ph):ph, y=yTop+p*range, edge=Math.min(ph,1-ph);
        const e=flows[g][i];e.setAttribute('x',(x-19).toFixed(1));e.setAttribute('y',y.toFixed(1));
        e.setAttribute('fill',color);setOp(e,op*clamp(edge*7,0,1));}}
    function hideFlow(g){for(let i=0;i<FLOWN;i++)setOp(flows[g][i],0);}

    // ── LA POSITION EST VIVANTE : un pouls interne qui remonte la jauge, en boucle (vitesse constante, jamais figé) ──
    const PULSE=[[],[]]; for(let g=0;g<2;g++)for(let i=0;i<3;i++)PULSE[g].push(mk('rect',{width:GW-26,height:10,rx:4,opacity:0}));
    function setPulse(g,x,botY,topY,color,op,speed,u){const range=botY-topY;
      for(let i=0;i<3;i++){const ph=((u*speed)+i/3)%1, y=botY-ph*range, edge=Math.min(ph,1-ph);
        const e=PULSE[g][i];e.setAttribute('x',(x-(GW-26)/2).toFixed(1));e.setAttribute('y',y.toFixed(1));
        e.setAttribute('width',GW-26);e.setAttribute('fill',color);setOp(e,op*clamp(edge*6,0,1));}}
    function hidePulse(){for(let g=0;g<2;g++)for(let i=0;i<3;i++)setOp(PULSE[g][i],0);}

    // ── L'ACCUMULATION (S4) : socle teal sous A (vent arrière) · dette grise sous B ──
    const accum=GXS.map((x,i)=>mk('rect',{fill:i===0?YOU:DEAD,rx:5,opacity:0}));
    function setAccum(i,h,op){const x=GXS[i];accum[i].setAttribute('x',(x-GW/2).toFixed(1));accum[i].setAttribute('width',GW);
      if(i===0){accum[i].setAttribute('y',(GBASE-h).toFixed(1));}      // socle : de GBASE-h à GBASE (sous la jauge soulevée)
      else{accum[i].setAttribute('y',GBASE.toFixed(1));}               // dette : sous la base, vers le bas
      accum[i].setAttribute('height',Math.max(2,h).toFixed(1));setOp(accum[i],op);}
    // le seuil de rentabilité de B qui RECULE plus haut
    const beLine=mk('line',{stroke:DEAD,'stroke-width':6,'stroke-dasharray':'18 12',opacity:0});
    function setBE(y,op,u){beLine.setAttribute('x1',(GBx-118).toFixed(1));beLine.setAttribute('x2',(GBx+118).toFixed(1));
      beLine.setAttribute('y1',y.toFixed(1));beLine.setAttribute('y2',y.toFixed(1));beLine.setAttribute('stroke-dashoffset',(u*16).toFixed(0));setOp(beLine,op);}

    // ── LE CYCLE JOUR/NUIT (S4) : un pip qui balaie un rail, cadence qui presse ──
    const cycTrack=mk('line',{x1:300,x2:780,y1:610,y2:610,stroke:INK,'stroke-width':3,opacity:0});
    const cycPip=mk('circle',{r:14,fill:INK,opacity:0});
    function setCycle(phase,op){cycTrack.setAttribute('opacity',op*0.5);
      const x=540+230*Math.sin(phase);cycPip.setAttribute('cx',x.toFixed(1));cycPip.setAttribute('cy',610);setOp(cycPip,op);}
    function hideCycle(){setOp(cycTrack,0);setOp(cycPip,0);}

    // ── LE REGARD (S3 : braqué en haut sur le prix · S5 : descend vérifier le funding) ──
    const eyes=GXS.map(()=>mk('ellipse',{fill:'none',stroke:INK,'stroke-width':7,rx:54,ry:31,opacity:0}));
    const pupils=GXS.map(()=>mk('circle',{r:17,fill:INK,opacity:0}));
    function setEye(i,cx,cy,look,op){eyes[i].setAttribute('cx',cx.toFixed(1));eyes[i].setAttribute('cy',cy.toFixed(1));setOp(eyes[i],op);
      pupils[i].setAttribute('cx',(cx+ (look.dx||0)).toFixed(1));pupils[i].setAttribute('cy',(cy+(look.dy||0)).toFixed(1));setOp(pupils[i],op);}
    function hideEyes(){for(let i=0;i<2;i++){setOp(eyes[i],0);setOp(pupils[i],0);}}

    // ── LE PRIX (S3) : une flèche en haut qui reste PLATE (le funding tourne quand même) ──
    const priceArrow=GXS.map(()=>mk('path',{fill:'none',stroke:INK,'stroke-width':9,'stroke-linecap':'round','stroke-linejoin':'round',opacity:0}));
    function setPrice(i,x,y,up,op){priceArrow[i].setAttribute('d',arrowPath(x,y,up,22));setOp(priceArrow[i],op);}
    function hidePrice(){for(let i=0;i<2;i++)setOp(priceArrow[i],0);}

    // ── L'ALTERNATIVE BARRÉE (S5) : la dette grise refusée ──
    const altBlock=mk('rect',{fill:DEAD,rx:5,width:120,height:150,opacity:0});
    const altX=[mk('line',{stroke:INK,'stroke-width':8,opacity:0}),mk('line',{stroke:INK,'stroke-width':8,opacity:0})];
    function setAlt(x,y,op){altBlock.setAttribute('x',(x-60).toFixed(1));altBlock.setAttribute('y',(y-75).toFixed(1));setOp(altBlock,op*0.85);
      altX[0].setAttribute('x1',x-74);altX[0].setAttribute('y1',y-88);altX[0].setAttribute('x2',x+74);altX[0].setAttribute('y2',y+88);setOp(altX[0],op);
      altX[1].setAttribute('x1',x+74);altX[1].setAttribute('y1',y-88);altX[1].setAttribute('x2',x-74);altX[1].setAttribute('y2',y+88);setOp(altX[1],op);}
    function hideAlt(){setOp(altBlock,0);setOp(altX[0],0);setOp(altX[1],0);}

    // ── QUESTION (§M15) — 1re ligne pleine dès la frame 0 ──
    const QLINES=['SAME TRADE —','WHY IS ONE','PAID TO HOLD'];
    const FS=72,lineH=88,y0=178,qY=QLINES.map((s,li)=>y0+li*lineH);
    const qEls=QLINES.map((s,li)=>{const e=mk('text',{x:CX,y:qY[li],'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':FS,'letter-spacing':'1',opacity:0});e.textContent=s;return e;});
    const QMY=y0+3*lineH+70,qMark=mk('text',{x:CX,y:QMY,'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':140,opacity:0});qMark.textContent='?';
    qEls.forEach(e=>{const t=e.textContent,f=Math.min(FS,930/Math.max(1,t.length*0.66));e.setAttribute('font-size',f.toFixed(1));});
    function hideQ(){for(const e of qEls)setOp(e,0);setOp(qMark,0);}

    // ── ÉTIQUETTES (§M18) — auto-réductrices, jamais par-dessus l'objet ──
    function caption(sz){return mk('text',{'text-anchor':'middle','font-family':'Helvetica Neue, Arial, sans-serif','font-weight':(sz>44?800:700),'font-size':(sz||38),'data-fs':(sz||38),'letter-spacing':'1.5',opacity:0});}
    const capA=caption(40),capB=caption(44),capC=caption(36),capD=caption(36),capE=caption(34),capF=caption(34),capG=caption(34),capH=caption(34);
    function putCap(el,txt,cx,y,color,op){el.textContent=txt;
      const nom=+el.getAttribute('data-fs')||+el.getAttribute('font-size'), PER=0.66, MAXW=930;
      const fs=Math.min(nom,Math.max(20,MAXW/Math.max(1,txt.length*PER)));el.setAttribute('font-size',fs.toFixed(1));
      const hw=txt.length*fs*PER/2,x=clamp(+cx,40+hw,1040-hw);
      el.setAttribute('x',x.toFixed(1));el.setAttribute('y',y);el.setAttribute('fill',color);setOp(el,op);}
    function hideCaps(){for(const e of [capA,capB,capC,capD,capE,capF,capG,capH])setOp(e,0);}

    function hideExtras(){for(let g=0;g<2;g++)hideFlow(g);hidePulse();for(let i=0;i<2;i++){setOp(drifts[i],0);setOp(accum[i],0);}
      setOp(beLine,0);hideCycle();hideEyes();hidePrice();hideAlt();}

    // ═══ S1 — LES JUMELLES : deux positions identiques, une dérive cachée opposée ═══
    // Verbe visuel : le miroir (deux objets identiques dont un est secrètement différent).
    function s1(lf,t,s){
      const u=t-s; hideCaps(); hideExtras();
      const gf=clamp(1-(lf-0.86)/0.10,0,1);
      for(let k=0;k<qEls.length;k++){const qt=(k===0?0.18:u-(0.1+k*0.26)),ap=clamp(qt/0.18,0,1),sc=0.7+0.3*backOut(ap);setOp(qEls[k],ap*gf);qEls[k].setAttribute('transform',`translate(${(CX*(1-sc)).toFixed(2)} ${(qY[k]*(1-sc)).toFixed(2)}) scale(${sc.toFixed(3)})`);}
      const qm=u-1.0,qap=clamp(qm/0.2,0,1),qsc=0.6+0.4*backOut(qap);setOp(qMark,qap*gf);qMark.setAttribute('transform',`translate(${(CX*(1-qsc)).toFixed(2)} ${(QMY*(1-qsc)).toFixed(2)}) scale(${qsc.toFixed(3)})`);
      // ── ÉMOTION FRAME 0 (levier CURIOSITÉ) : les deux jauges sont DÉJÀ pleines, jumelles parfaites, et elles
      //    respirent chacune (deux harmoniques). Rien ne se construit : l'énigme (pourquoi l'une paierait ?) est entière à t=0.
      const bA=8*Math.sin(u*1.15)+4*Math.sin(u*2.05), bB=8*Math.sin(u*1.15+0.35)+4*Math.sin(u*2.05+0.5);
      setGauge(0,GFULL+bA,0,0,1,4*Math.sin(u*0.9));
      setGauge(1,GFULL+bB,0,0,1,4*Math.sin(u*0.9+0.4));
      // les positions sont VIVANTES : un pouls interne identique remonte les deux jauges (les jumelles ticquent pareil)
      setPulse(0,GAx,GBASE-14,GTOP+16,PAPER,0.42,0.2,u);
      setPulse(1,GBx,GBASE-14,GTOP+16,PAPER,0.42,0.2,u);
      putCap(capA,'POSITION A',GAx,GTOP-28,YOU,1);
      putCap(capB,'POSITION B',GBx,GTOP-28,YOU,1);
      // la micro-dérive cachée, opposée : sous A une flèche haut, sous B une flèche bas — à peine visibles, qui se devinent
      const hint=clamp((u-1.9)/1.2,0,1)*0.5;
      setDrift(0,GAx,GBASE+120+5*Math.sin(u*1.7),true,18,YOU,hint);
      setDrift(1,GBx,GBASE+120+5*Math.sin(u*1.7+1.2),false,18,DEAD,hint);
      putCap(capC,'IDENTICAL — SAME SIZE, SAME WAY',CX,GBASE+230,DEAD,clamp((u-2.6)/0.8,0,1)*gf);
    }

    // ═══ S2 — LE MÉCANISME : le funding remonte dans A, sort de B ═══
    // Verbe visuel : le flux qui s'inverse (des jetons ENTRENT dans A, SORTENT de B).
    function s2(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideExtras();
      const bA=6*Math.sin(u*1.15)+3*Math.sin(u*2.05), bB=6*Math.sin(u*1.15+0.35)+3*Math.sin(u*2.05+0.5);
      setGauge(0,GFULL+bA,0,0,1,3*Math.sin(u*0.9));
      setGauge(1,GFULL+bB,0,0,1,3*Math.sin(u*0.9+0.4));
      putCap(capA,'POSITION A',GAx,GTOP-28,YOU,1);
      putCap(capB,'POSITION B',GBx,GTOP-28,YOU,1);
      // le flux funding se révèle (fade court) puis TICKE en continu, en position
      const rev=clamp((u-0.4)/1.2,0,1);
      setFlow(0,GAx,true ,YOU ,rev,0.16,u);   // A reçoit : jetons teal qui remontent
      setFlow(1,GBx,false,DEAD,rev,0.16,u);   // B paie   : jetons gris qui descendent
      // les deux flèches de S1 se CONFIRMENT
      const cf=clamp((u-1.6)/0.8,0,1);
      setDrift(0,GAx,GBASE+118+5*Math.sin(u*1.9),true ,22,YOU ,cf);
      setDrift(1,GBx,GBASE+118+5*Math.sin(u*1.9+1.1),false,22,DEAD,cf);
      putCap(capC,'A RECEIVES',GAx,GBASE+210,YOU,cf);
      putCap(capD,'B PAYS',GBx,GBASE+210,DEAD,cf);
      putCap(capE,'HOLDING IS BORROWING — YOUR SIDE DECIDES',CX,GTOP-96,INK,clamp((u-3.0)/0.9,0,1));
    }

    // ═══ S3 — L'ANGLE MORT : tous les yeux sur le prix (plat), le funding tourne ignoré ═══
    // Verbe visuel : le regard braqué (l'attention fixée en haut, la dérive travaille en bas, non vue).
    function s3(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideExtras();
      const bA=6*Math.sin(u*1.15)+3*Math.sin(u*2.05), bB=6*Math.sin(u*1.15+0.35)+3*Math.sin(u*2.05+0.5);
      setGauge(0,GFULL+bA,0,0,1,0);
      setGauge(1,GFULL+bB,0,0,1,0);
      // le prix, en haut, reste PLAT (micro-tremblement seulement) — l'attention s'y colle
      const jit=3*Math.sin(u*3.1);
      setPrice(0,GAx,GTOP-96+jit,u<9?true:true,1);   // flèche prix (direction indécise, plate)
      setPrice(1,GBx,GTOP-96-jit,true,1);
      // les regards braqués vers le haut (pupille tirée vers le prix), qui tremblent
      const look={dx:2*Math.sin(u*2.3),dy:-14+2*Math.sin(u*3.3)};
      setEye(0,GAx,GTOP-190,look,1);
      setEye(1,GBx,GTOP-190,{dx:-2*Math.sin(u*2.3),dy:-14+2*Math.sin(u*3.3)},1);
      putCap(capA,'EYES ON PRICE',CX,GTOP-250,INK,clamp((u-0.6)/0.7,0,1));
      putCap(capB,'PRICE FLAT',CX,GTOP-56,DEAD,clamp((u-1.2)/0.7,0,1));
      // dessous, le funding TICKE quand même : A reçoit, B paie — dans l'angle mort
      setFlow(0,GAx,true ,YOU ,1,0.15,u);
      setFlow(1,GBx,false,DEAD,1,0.15,u);
      setDrift(0,GAx,GBASE+118+5*Math.sin(u*1.9),true ,20,YOU ,0.85);
      setDrift(1,GBx,GBASE+118+5*Math.sin(u*1.9+1.1),false,20,DEAD,0.85);
      putCap(capE,'THE DRIFT TURNS ANYWAY',CX,GBASE+228,DEAD,clamp((u-2.4)/0.9,0,1));
    }

    // ═══ S4 — LA SCÈNE : les cycles défilent, la dérive COMPOSE ═══
    // Verbe visuel : l'accumulation qui compose (socle teal soulève A · dette grise + break-even reculent B).
    function s4(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideExtras();
      const grow=clamp(u/3.2,0,1);                                   // des semaines qui passent
      const lift=110*grow*grow, debt=112*grow*grow, bR=72*grow;      // ça COMPOSE (accélère) ; bR borné pour rester dans le cadre
      const bA=5*Math.sin(u*1.4)+3*Math.sin(u*2.3), bB=5*Math.sin(u*1.4+0.4)+3*Math.sin(u*2.3+0.5);
      // A : portée par un socle teal (vent arrière) qui la soulève
      setAccum(0,lift,1);
      setGauge(0,GFULL+bA,lift,0,1,2*Math.sin(u*0.8));
      putCap(capA,'PAID TO WAIT',GAx,GTOP-40-lift,YOU,clamp((u-0.8)/0.7,0,1));
      // B : lestée par une dette grise, et son seuil de rentabilité RECULE plus haut
      setAccum(1,debt,0.9);
      setGauge(1,GFULL+bB,0,0.28*grow,1,2*Math.sin(u*0.8+0.4));
      const beY=GTOP-40-bR;
      setBE(beY,clamp((u-0.8)/0.7,0,1),u);
      putCap(capB,'BREAK-EVEN — NOW HIGHER',GBx,Math.max(560,beY-18),DEAD,clamp((u-1.2)/0.8,0,1));
      putCap(capD,'CHARGED TO WAIT',GBx,GBASE+debt+62,DEAD,clamp((u-1.4)/0.7,0,1));
      // les cycles jour/nuit défilent, cadence qui presse ; le funding ticke encore
      setCycle(u*(1.1+1.4*grow),clamp((u-0.3)/0.6,0,1));
      setFlow(0,GAx,true ,YOU ,1,0.14+0.22*grow,u);
      setFlow(1,GBx,false,DEAD,1,0.14+0.22*grow,u);
      putCap(capE,'SAME START — OPPOSITE DRIFT COMPOUNDS',CX,GBASE+debt+150,INK,clamp((u-2.6)/0.9,0,1));
    }

    // ═══ S5 — DÉCHARGE : vérifier le SENS avant de tenir, choisir le vent arrière ═══
    // Verbe visuel : la vérification (le regard DESCEND sous la jauge lire la dérive, on choisit le côté payé).
    function s5(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideExtras();
      const SX=430;                                                  // une jauge unique, recentrée
      const bA=6*Math.sin(u*1.2)+3*Math.sin(u*2.1);
      // dessine la jauge unique (index 0 réutilisé, mais à SX)
      const bot=GBASE, h=GFULL+bA;
      gauges[0].setAttribute('x',(SX-GW/2).toFixed(1));gauges[0].setAttribute('width',GW);
      gauges[0].setAttribute('y',(bot-h).toFixed(1));gauges[0].setAttribute('height',h.toFixed(1));
      gauges[0].setAttribute('fill',YOU);setOp(gauges[0],1);setOp(gauges[1],0);
      bases[0].setAttribute('x1',SX-92);bases[0].setAttribute('x2',SX+92);bases[0].setAttribute('y1',GBASE+8);bases[0].setAttribute('y2',GBASE+8);setOp(bases[0],1);setOp(bases[1],0);
      // la position vérifiée est PAYÉE : un pouls teal remonte en continu la jauge (le vent arrière ticke, vie continue tout du long)
      setPulse(0,SX,bot-14,bot-h+16,PAPER,0.5,0.2,u);
      putCap(capA,'YOUR POSITION',SX,GTOP-30,YOU,1);
      // le regard DESCEND : d'abord en haut (prix), puis il glisse sous la jauge (funding)
      const desc=eInOut(clamp((u-0.6)/1.4,0,1)), ey=lerp(GTOP-150,GBASE+150,desc);
      setEye(0,SX,ey,{dx:2*Math.sin(u*2.4),dy:lerp(-12,14,desc)+2*Math.sin(u*3.2)},1);
      putCap(capC,'CHECK THE FUNDING — NOT JUST PRICE',CX,GTOP-96,INK,clamp((u-1.0)/0.8,0,1));
      // on lit la dérive sous la jauge, et on ORIENTE vers le côté payé (flèche haut teal + socle)
      const choose=clamp((u-2.4)/1.0,0,1);
      const lift=70*choose;
      setAccum(0,lift,choose); accum[0].setAttribute('x',(SX-GW/2).toFixed(1));
      setDrift(0,SX,GBASE+150,true,26,YOU,clamp((u-2.0)/0.7,0,1));
      putCap(capD,'PAYS YOU TO WAIT',SX,GBASE+250,YOU,clamp((u-2.8)/0.8,0,1));
      // l'alternative (dette grise) montrée BARRÉE, à côté
      setAlt(880,GBASE-40,clamp((u-2.0)/0.9,0,1));
      putCap(capF,'NOT THIS SIDE',880,GBASE+90,DEAD,clamp((u-2.6)/0.8,0,1));
      putCap(capB,'KNOW WHICH DRIFT YOU’RE IN',CX,GTOP-166,INK,clamp((u-3.4)/0.9,0,1));
    }

    const RENDER={s1,s2,s3,s4,s5};const SCENEFN=SPEC.map(s=>RENDER[s.id]||s1);
    const clock={t:0};
    function sceneAt(t){let i=0;for(let k=0;k<SC.length;k++){if(t>=SC[k].s-1e-6)i=k;}return Math.min(i,SCENEFN.length-1);}
    function render(){const t=clock.t;const i=sceneAt(t),lf=clamp((t-SC[i].s)/SC[i].d,0,1);SCENEFN[i](lf,t,SC[i].s);}
    const tl=gsap.timeline({paused:true});
    tl.to(clock,{t:TOTAL,duration:TOTAL,ease:'none',onUpdate:render},0);
    tl.to(SVG,{opacity:1,duration:0.001},TOTAL-0.001);
    window.__timelines=window.__timelines||{};window.__timelines['main']=tl;
  </script>
