<!doctype html>
<html lang="en" data-resolution="portrait" data-fps="30">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>:root{--paper:#F2EFE7}*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}#stage{position:absolute;inset:0}svg{position:absolute;inset:0;width:1080px;height:1920px}</style>
</head>
<body>
  <!-- L2 « THE PARKING LOT » — 6 séquences (voice[0..5]) : hook · crowd · cluster · cascade · aftermath · replay.
       S1 HOOK : émotion frame 0 = levier TENSION — le prix (trait teal) tremble à un cheveu de la ligne où TON STOP
       est posé, sur le point de se faire prendre. S2 CROWD : verbe = convergence — une foule de figures fil-de-fer
       pointe TOUTES le même point sur la ligne (le niveau n'est pas TON choix). S3 CLUSTER : verbe = densité —
       les stops s'entassent JUSTE sous le chiffre rond, les take-profits SUR la ligne, le reste vide (le « parking »).
       S4 CASCADE : verbe = chaîne qui s'emballe — le prix touche, un front balaie l'amas, chaque marqueur tombe et
       pousse le prix un cran plus bas, en accélérant. S5 AFTERMATH : verbe = départ — l'amas vidé, le prix se retourne
       et FILE là où tu l'avais dit, un seul marqueur gris (TOI) reste au sol, l'écart se creuse. S6 REPLAY : verbe =
       reprise corrigée — le même piège revient, mais TON stop est posé À L'ÉCART : la cascade balaie l'amas, ton stop
       SURVIT et rejoint le move. Cette fois tu es dedans. Doctrine : aucun chiffre ; prix/toi = teal ; ordres des
       autres = gris neutre ; ligne = encre ; pas de brun, pas de rouge ; bas du cadre vide ; PAS de narrateur (pause). -->
  <div id="stage" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="1"><svg id="svg" viewBox="0 0 1080 1920"></svg></div>
  <script>
    const TOTAL=__TOTAL__, SC=__SCENES__, SPEC=__SPEC__;
    const NS='http://www.w3.org/2000/svg', SVG=document.getElementById('svg');
    const YOU='#1E5F6E', INK='#20242A', PAPER='#F2EFE7', DEAD='#474D50';
    const CX=540;
    function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);(p||SVG).appendChild(e);return e;}
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,f)=>a+(b-a)*clamp(f,0,1),eIn=f=>f*f,eOut=f=>1-(1-f)*(1-f),eInOut=f=>f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
    const backOut=(p,s)=>{s=(s==null?1.9:s);const q=clamp(p,0,1)-1;return 1+(s+1)*q*q*q+s*q*q;};
    const setOp=(el,o)=>el.setAttribute('opacity',clamp(o,0,1).toFixed(3));

    // ── GÉOMÉTRIE COMMUNE ──
    const X_L=150, X_R=930, LY=1080;                 // portée du prix, ligne « niveau »
    const LOTX0=360, LOTX1=748;                       // le « parking » (bande d'amas)

    // ── OBJETS (créés une fois, réutilisés scène par scène ; hideAll() les efface à chaque cut) ──
    const PRICE=mk('polyline',{fill:'none',stroke:YOU,'stroke-width':7,'stroke-linejoin':'round','stroke-linecap':'round',opacity:0});
    const LEVEL=mk('line',{stroke:INK,'stroke-width':5,'stroke-dasharray':'18 12',opacity:0});
    const SM=[]; for(let i=0;i<44;i++)SM.push(mk('rect',{rx:3,fill:DEAD,opacity:0}));   // stops des autres (gris)
    const TP=[]; for(let i=0;i<8;i++) TP.push(mk('rect',{rx:3,fill:INK,opacity:0}));    // take-profits (encre) sur la ligne
    const TEALM=[]; for(let i=0;i<3;i++)TEALM.push(mk('rect',{rx:4,fill:YOU,opacity:0}));// TON stop (teal)
    // foule fil-de-fer (S2)
    const NF=18, FHEAD=[],FBODY=[],FARM=[],FCONV=[];
    for(let i=0;i<NF;i++){
      FHEAD.push(mk('circle',{r:14,fill:'none',stroke:INK,'stroke-width':4,opacity:0}));
      FBODY.push(mk('line',{stroke:INK,'stroke-width':4,'stroke-linecap':'round',opacity:0}));
      FARM.push(mk('line',{stroke:INK,'stroke-width':4,'stroke-linecap':'round',opacity:0}));
      FCONV.push(mk('line',{stroke:INK,'stroke-width':2,'stroke-dasharray':'6 8',opacity:0}));
    }
    const TARGET=mk('circle',{fill:YOU,opacity:0}), TRING=mk('circle',{fill:'none',stroke:INK,'stroke-width':4,opacity:0});

    // positions de l'amas (partagées S3/S4/S6, état repris exact)
    const STOPBASE=[];
    (function(){const cols=8,rows=4,sx=(LOTX1-LOTX0)/cols; for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)
      STOPBASE.push({x:LOTX0+c*sx+3, y:LY+42+r*34, xn:c/(cols-1)});})();

    function stop(i,x,y,w,h,op,color){const e=SM[i];if(!e)return;e.setAttribute('x',x.toFixed(1));e.setAttribute('y',y.toFixed(1));
      e.setAttribute('width',Math.max(2,w).toFixed(1));e.setAttribute('height',Math.max(2,h).toFixed(1));e.setAttribute('fill',color||DEAD);setOp(e,op);}
    function tp(i,x,y,w,h,op){const e=TP[i];if(!e)return;e.setAttribute('x',x.toFixed(1));e.setAttribute('y',y.toFixed(1));
      e.setAttribute('width',w.toFixed(1));e.setAttribute('height',h.toFixed(1));setOp(e,op);}
    function teal(i,x,y,w,h,op){const e=TEALM[i];if(!e)return;e.setAttribute('x',x.toFixed(1));e.setAttribute('y',y.toFixed(1));
      e.setAttribute('width',w.toFixed(1));e.setAttribute('height',h.toFixed(1));setOp(e,op);}
    function drawPrice(fn,op){const pts=[];for(let i=0;i<=48;i++){const x=X_L+(X_R-X_L)*i/48;pts.push(x.toFixed(1)+','+fn(x).toFixed(1));}
      PRICE.setAttribute('points',pts.join(' '));setOp(PRICE,op);}
    function figure(i,fx,fy,u,op,pointT){
      const hx=fx, hy=fy-34, sx=fx, sy=fy-8, tx=CX, ty=LY;
      FHEAD[i].setAttribute('cx',hx.toFixed(1));FHEAD[i].setAttribute('cy',hy.toFixed(1));setOp(FHEAD[i],op);
      FBODY[i].setAttribute('x1',fx.toFixed(1));FBODY[i].setAttribute('y1',(fy-18).toFixed(1));FBODY[i].setAttribute('x2',fx.toFixed(1));FBODY[i].setAttribute('y2',(fy+30).toFixed(1));setOp(FBODY[i],op);
      const dx=tx-sx, dy=ty-sy, dl=Math.hypot(dx,dy)||1, ax=sx+dx/dl*42, ay=sy+dy/dl*42;
      FARM[i].setAttribute('x1',sx.toFixed(1));FARM[i].setAttribute('y1',sy.toFixed(1));FARM[i].setAttribute('x2',ax.toFixed(1));FARM[i].setAttribute('y2',ay.toFixed(1));setOp(FARM[i],op);
      FCONV[i].setAttribute('x1',ax.toFixed(1));FCONV[i].setAttribute('y1',ay.toFixed(1));
      FCONV[i].setAttribute('x2',(sx+dx*pointT).toFixed(1));FCONV[i].setAttribute('y2',(sy+dy*pointT).toFixed(1));
      FCONV[i].setAttribute('stroke-dashoffset',(-u*14).toFixed(0));setOp(FCONV[i],op*0.5*pointT);
    }
    function hideAll(){
      setOp(PRICE,0);setOp(LEVEL,0);setOp(TARGET,0);setOp(TRING,0);
      for(const e of SM)setOp(e,0);for(const e of TP)setOp(e,0);for(const e of TEALM)setOp(e,0);
      for(let i=0;i<NF;i++){setOp(FHEAD[i],0);setOp(FBODY[i],0);setOp(FARM[i],0);setOp(FCONV[i],0);}
    }

    // ── QUESTION (§M15) — 1re ligne pleine dès la frame 0 ──
    const QLINES=['WHY DOES','YOUR STOP','ALWAYS DIE?'];
    const FS=88,lineH=118,qy0=250,qY=QLINES.map((s,li)=>qy0+li*lineH);
    const qEls=QLINES.map((s,li)=>{const e=mk('text',{x:CX,y:qY[li],'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':FS,'letter-spacing':'1',opacity:0});e.textContent=s;return e;});
    const QMY=qy0+3*lineH+96,qMark=mk('text',{x:CX,y:QMY,'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':150,opacity:0});qMark.textContent='?';
    qEls.forEach(e=>{const t=e.textContent,f=Math.min(FS,930/Math.max(1,t.length*0.66));e.setAttribute('font-size',f.toFixed(1));});
    function hideQ(){for(const e of qEls)setOp(e,0);setOp(qMark,0);}

    // ── ÉTIQUETTES (§M18) — putCap MESURE (getComputedTextLength) et borne le centre : jamais coupé. Copié TEL QUEL de l26. ──
    function caption(sz){return mk('text',{'text-anchor':'middle','font-family':'Helvetica Neue, Arial, sans-serif','font-weight':(sz>44?800:700),'font-size':(sz||38),'data-fs':(sz||38),'letter-spacing':'1.5',opacity:0});}
    const capA=caption(40),capB=caption(44),capC=caption(36),capD=caption(36),capE=caption(34),capF=caption(34);
    function putCap(el,txt,cx,y,color,op){
      const MARGIN=70, MAXW=1080-2*MARGIN;
      if(el.__cap!==txt){ el.__cap=txt; el.textContent=txt;
        const nom=+el.getAttribute('data-fs')||+el.getAttribute('font-size')||38;
        el.setAttribute('font-size',nom);
        let w=el.getComputedTextLength()||0;
        if(!w) w=txt.length*nom*0.72;
        if(w>MAXW){ const fs=Math.max(18,nom*MAXW/w); el.setAttribute('font-size',fs.toFixed(1)); w=el.getComputedTextLength()||txt.length*fs*0.72; }
        el.__hw=w/2;
      }
      const x=clamp(+cx, MARGIN+el.__hw, 1080-MARGIN-el.__hw);
      el.setAttribute('x',x.toFixed(1));el.setAttribute('y',y);el.setAttribute('fill',color);setOp(el,op);}
    function hideCaps(){for(const e of [capA,capB,capC,capD,capE,capF])setOp(e,0);}

    // ═══ S1 — HOOK : le prix tremble à un cheveu de la ligne, TON STOP posé dessus (tension frame 0) ═══
    // Verbe visuel : l'imminence (le tip du prix vibre juste au-dessus du niveau, sur le point de le toucher).
    function s1(lf,t,s){
      const u=t-s; hideAll(); hideCaps();
      // question pop (seul draw-on autorisé) — 1re ligne pleine à t=0
      for(let k=0;k<qEls.length;k++){const qt=(k===0?0.18:u-(0.12+k*0.30)),ap=clamp(qt/0.18,0,1),sc=0.7+0.3*backOut(ap);
        setOp(qEls[k],ap);qEls[k].setAttribute('transform',`translate(${(CX*(1-sc)).toFixed(2)} ${(qY[k]*(1-sc)).toFixed(2)}) scale(${sc.toFixed(3)})`);}
      const qm=u-1.15,qap=clamp(qm/0.2,0,1),qsc=0.6+0.4*backOut(qap);
      setOp(qMark,qap);qMark.setAttribute('transform',`translate(${(CX*(1-qsc)).toFixed(2)} ${(QMY*(1-qsc)).toFixed(2)}) scale(${qsc.toFixed(3)})`);
      // illustration PLEINE dès u=0 : la ligne, TON stop posé dessus, le prix qui plonge vers lui
      LEVEL.setAttribute('x1',X_L);LEVEL.setAttribute('x2',X_R);LEVEL.setAttribute('y1',LY);LEVEL.setAttribute('y2',LY);setOp(LEVEL,1);
      drawPrice(x=>{const T=(x-X_L)/(X_R-X_L);
        const descend=940+((LY-38)-940)*eIn(T);
        const sway=14*Math.sin(u*1.6+T*6)+7*Math.sin(u*2.7+T*3.5);
        const dip=(20*Math.sin(u*1.1)+8*Math.sin(u*1.9))*T;      // le côté droit menace la ligne
        return descend+sway+dip;},1);
      const br=6*Math.sin(u*1.7)+3*Math.sin(u*2.9);
      teal(0,720,LY-16+br,72,30,1);                               // TON stop, posé sur la ligne
      putCap(capA,'THE LEVEL',270,LY+64,INK,1);
      putCap(capB,'YOUR STOP',756,LY+96+br,YOU,1);
    }

    // ═══ S2 — CROWD : une foule pointe TOUTE le même point (convergence) ═══
    // Verbe visuel : la convergence (chaque figure désigne l'unique niveau — le niveau n'est pas ton choix).
    function s2(lf,t,s){
      const u=t-s; hideAll(); hideCaps(); hideQ();
      // court segment de niveau sous la cible
      LEVEL.setAttribute('x1',300);LEVEL.setAttribute('x2',780);LEVEL.setAttribute('y1',LY);LEVEL.setAttribute('y2',LY);setOp(LEVEL,0.85);
      for(let i=0;i<NF;i++){const col=i%6,row=(i/6|0);
        const sway=16*Math.sin(u*1.3+i*1.1)+8*Math.sin(u*2.3+i*0.7);
        const bob=6*Math.sin(u*1.7+i*0.9)+3*Math.sin(u*2.6+i*0.5);
        const pointT=clamp((u-(0.6+i*0.11))/0.8,0,1);
        figure(i,140+col*150+sway,650+row*118+bob,u,1,pointT);}
      const tp0=clamp((u-1.0)/1.2,0,1),tr=15+4*Math.sin(u*3.0)+2*Math.sin(u*4.7);
      TARGET.setAttribute('cx',CX);TARGET.setAttribute('cy',(LY+3*Math.sin(u*1.6)).toFixed(1));TARGET.setAttribute('r',tr.toFixed(1));setOp(TARGET,tp0);
      TRING.setAttribute('cx',CX);TRING.setAttribute('cy',(LY+3*Math.sin(u*1.6)).toFixed(1));TRING.setAttribute('r',(tr+11).toFixed(1));setOp(TRING,tp0*0.8);
      putCap(capA,'EVERY TRADER',250,1300,INK,clamp((u-0.4)/0.6,0,1));
      putCap(capB,'THE OBVIOUS LEVEL',760,1300,YOU,clamp((u-1.6)/0.7,0,1));
    }

    // ═══ S3 — CLUSTER : les stops s'entassent JUSTE sous le rond, les TP dessus, le reste vide ═══
    // Verbe visuel : la densité (le contraste amas dense / vide EST la démonstration).
    function s3(lf,t,s){
      const u=t-s; hideAll(); hideCaps(); hideQ();
      LEVEL.setAttribute('x1',X_L);LEVEL.setAttribute('x2',X_R);LEVEL.setAttribute('y1',LY);LEVEL.setAttribute('y2',LY);setOp(LEVEL,1);
      for(let i=0;i<6;i++){const x=340+i*76,br=2*Math.sin(u*2.0+i*0.8);tp(i,x-16,LY-11+br,32,22,clamp((u-1.0-i*0.08)/0.5,0,1));}
      for(let i=0;i<STOPBASE.length;i++){const b=STOPBASE[i];
        const jx=4*Math.sin(u*2.2+i*0.9)+2*Math.sin(u*3.5+i*0.5);
        const jy=3*Math.sin(u*1.8+i*1.3)+2*Math.sin(u*3.1+i*0.7);
        stop(i,b.x+jx,b.y+jy,40,20,0.92);}
      putCap(capA,'THE ROUND NUMBER',300,942,INK,1);
      putCap(capB,'TAKE-PROFITS',792,1002,INK,clamp((u-1.4)/0.6,0,1));
      putCap(capC,'STOPS',235,1176,DEAD,clamp((u-2.2)/0.6,0,1));
    }

    // ═══ S4 — CASCADE : le prix touche, un front balaie l'amas, chaque chute pousse le prix plus bas, en accélérant ═══
    // Verbe visuel : la chaîne qui s'emballe (dominos + prix creusé à travers la zone).
    function s4(lf,t,s){
      const u=t-s; hideAll(); hideCaps(); hideQ();
      const T_TOUCH=2.4, SWEEP=5.4, f=eIn(clamp((u-T_TOUCH)/SWEEP,0,1)), fx=LOTX0+f*(LOTX1-LOTX0);
      LEVEL.setAttribute('x1',X_L);LEVEL.setAttribute('x2',X_R);LEVEL.setAttribute('y1',LY);LEVEL.setAttribute('y2',LY);setOp(LEVEL,1);
      drawPrice(x=>{const sway=8*Math.sin(u*2.0+x*0.02)+5*Math.sin(u*3.2+x*0.011);
        if(f<=0||x<=LOTX0||x>=fx)return LY-26+sway;
        const p=(x-LOTX0)/(fx-LOTX0);return (LY-26)+170*f*eIn(p)+sway;},1);
      for(let i=0;i<STOPBASE.length;i++){const b=STOPBASE[i];
        const fired=clamp((f-b.xn)/0.14,0,1),op=(1-fired)*0.92;
        const jx=4*Math.sin(u*2.2+i*0.9),jy=3*Math.sin(u*1.8+i*1.3);
        if(op>0.01)stop(i,b.x+jx,b.y+jy+150*eIn(fired),40,20,op);}
      putCap(capA,'EACH ONE TRIGGERS THE NEXT',CX,650,INK,1);
    }

    // ═══ S5 — AFTERMATH : l'amas vidé, le prix se retourne et FILE ; un seul marqueur gris (TOI) reste au sol ═══
    // Verbe visuel : le départ (l'écart se creuse entre la courbe partie et le point resté).
    function s5(lf,t,s){
      const u=t-s; hideAll(); hideCaps(); hideQ();
      LEVEL.setAttribute('x1',X_L);LEVEL.setAttribute('x2',X_R);LEVEL.setAttribute('y1',LY);LEVEL.setAttribute('y2',LY);setOp(LEVEL,0.45);
      const climb=clamp((u-0.3)/3.0,0,1),low=LY+150,lowX=0.24;    // creux à gauche → le marqueur resté reste dans le vide bas-gauche
      drawPrice(x=>{const T=(x-X_L)/(X_R-X_L);let y;
        if(T<lowX)y=(LY-20)+(low-(LY-20))*eIn(T/lowX);
        else{const r=(T-lowX)/(1-lowX);y=low+((760-climb*70)-low)*eOut(r);}
        const sway=7*Math.sin(u*1.5+T*5)+4*Math.sin(u*2.6+T*3);return y+sway;},1);
      const lowXpix=X_L+lowX*(X_R-X_L);
      stop(0,lowXpix-20,low-11,40,22,0.9,DEAD);                    // TOI, resté au sol, immobile
      // étiquettes en ZONES LIBRES : la courbe monte en diagonale → « THE MOVE » va dans la bande HAUTE (au-dessus du sommet),
      // « THE LOT IS EMPTY » en bas-droite (sous la montée), « YOU » sous le marqueur en bas-gauche.
      putCap(capB,'THE MOVE YOU CALLED',CX,640,YOU,clamp((u-1.0)/0.7,0,1));
      putCap(capA,'THE LOT IS EMPTY',760,1312,DEAD,clamp((u-0.6)/0.6,0,1));
      putCap(capC,'YOU',lowXpix,low+92,DEAD,clamp((u-2.2)/0.6,0,1));
    }

    // ═══ S6 — REPLAY : même piège, mais TON stop est À L'ÉCART — la cascade balaie l'amas, ton stop survit et rejoint le move ═══
    // Verbe visuel : la reprise corrigée (même mécanique, placement changé → résultat inversé).
    function s6(lf,t,s){
      const u=t-s; hideAll(); hideCaps(); hideQ();
      const T1=2.2,T2=6.6,SW=T2-T1, f=eIn(clamp((u-T1)/SW,0,1)), fx=LOTX0+f*(LOTX1-LOTX0), climb=clamp((u-T2)/3.0,0,1);
      const sideX=888, low=LY+120, lowX=0.30;
      LEVEL.setAttribute('x1',X_L);LEVEL.setAttribute('x2',X_R);LEVEL.setAttribute('y1',LY);LEVEL.setAttribute('y2',LY);setOp(LEVEL,1);
      function curveY(x){const T=(x-X_L)/(X_R-X_L),r=(T-lowX)/(1-lowX);
        if(T<lowX)return (LY-20)+(low-(LY-20))*eIn(T/lowX);
        return low+((735-climb*45)-low)*eOut(r);}
      drawPrice(x=>{const sway=7*Math.sin(u*1.9+x*0.018)+4*Math.sin(u*3.1+x*0.01);
        if(u<T2){if(f<=0||x<=LOTX0||x>=fx)return LY-26+sway;const p=(x-LOTX0)/(fx-LOTX0);return (LY-26)+150*f*eIn(p)+sway;}
        return curveY(x)+sway;},1);
      for(let i=0;i<STOPBASE.length;i++){const b=STOPBASE[i];
        const fired=clamp((f-b.xn)/0.14,0,1),op=(u<T2)?(1-fired)*0.9:0;
        const jx=4*Math.sin(u*2.2+i*0.9),jy=3*Math.sin(u*1.8+i*1.3);
        if(op>0.01)stop(i,b.x+jx,b.y+jy+150*eIn(fired),40,20,op);}
      let ty;
      if(u<T2)ty=LY-30+4*Math.sin(u*1.6)+2*Math.sin(u*2.7);
      else ty=curveY(sideX)-30+3*Math.sin(u*1.8);
      teal(0,sideX-32,ty,64,30,1);                                 // TON stop, à l'écart puis porté par le move
      putCap(capA,'THE SAME TRAP',300,930,DEAD,clamp((u-0.4)/0.6,0,1));
      putCap(capB,'YOUR STOP',sideX,LY+108,YOU,clamp((u-1.0)/0.6,0,1)*(u<T2?1:clamp(1-(u-T2)/0.5,0,1)));
      putCap(capC,"YOU'RE STILL IN",560,670,YOU,climb);
    }

    // dispatch PAR INDEX : L2 a 6 scènes (format hérité, sans champ id) → s1..s6
    const RENDER={s1,s2,s3,s4,s5,s6};const SCENEFN=SPEC.map((sp,i)=>RENDER['s'+(i+1)]||s1);
    const clock={t:0};
    function sceneAt(t){let i=0;for(let k=0;k<SC.length;k++){if(t>=SC[k].s-1e-6)i=k;}return Math.min(i,SCENEFN.length-1);}
    function render(){const t=clock.t;const i=sceneAt(t),lf=clamp((t-SC[i].s)/SC[i].d,0,1);SCENEFN[i](lf,t,SC[i].s);}
    const tl=gsap.timeline({paused:true});
    tl.to(clock,{t:TOTAL,duration:TOTAL,ease:'none',onUpdate:render},0);
    tl.to(SVG,{opacity:1,duration:0.001},TOTAL-0.001);
    window.__timelines=window.__timelines||{};window.__timelines['main']=tl;
  </script>
</body>
</html>
