<!doctype html>
<html lang="en" data-resolution="portrait" data-fps="30">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root{--paper:#F2EFE7;--ink:#20242A;--you:#1E5F6E;}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
    #stage{position:absolute;inset:0} svg{position:absolute;inset:0;width:1080px;height:1920px}
  </style>
</head>
<body>
  <!-- L3 S4 « LE SECOND NOMBRE N'EXISTE PAS » — grammaire JAUGE VERTICALE. Le bloc gauche s'efface, on garde la jauge
       OUVERTE. La caméra RECULE vers le haut pour trouver son plafond : jamais. Elle s'amincit, se DÉLAVE en barre grise
       infinie qui sort par le haut, sa butée du bas devient un point. Le $ s'efface : on ne peut plus la lire. -->
  <div id="stage" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="1">
    <svg id="svg" viewBox="0 0 1080 1920"></svg>
  </div>
  <script>
    const TOTAL=__TOTAL__;
    const NS='http://www.w3.org/2000/svg', SVG=document.getElementById('svg');
    const YOU='#1E5F6E', INK='#20242A', PAPER='#F2EFE7', AXIS='#C8CBC2', DEAD='#474D50';
    const CX=540, BASE_Y=1560, GW=200;
    function mk(tag,a,parent){const e=document.createElementNS(NS,tag);for(const k in(a||{}))e.setAttribute(k,a[k]);(parent||SVG).appendChild(e);return e;}
    const hx=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
    function mix(a,b,f){const A=hx(a),B=hx(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*f)).join(',')})`;}
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,f)=>a+(b-a)*clamp(f,0,1);

    const gTick=mk('g',{}); const TK=[]; const TW=1120;
    for(let i=0;i<16;i++){ const bx=i*70, h=18+((i*37)%44); TK.push({bx,h,el:mk('line',{stroke:AXIS,'stroke-width':4,'stroke-linecap':'round',opacity:0},gTick)}); }
    const axis=mk('line',{x1:120,y1:BASE_Y,x2:960,y2:BASE_Y,stroke:AXIS,'stroke-width':6,'stroke-linecap':'round'});
    const leftG=mk('rect',{fill:YOU}), lCb=mk('rect',{fill:INK,height:14}), lCt=mk('rect',{fill:INK,height:14});
    const lD=mk('text',{x:360,y:BASE_Y-90,'text-anchor':'middle',fill:PAPER,'font-family':'Georgia, serif','font-weight':'bold','font-size':120},null); lD.textContent='$';
    const rightG=mk('rect',{fill:YOU}), rCb=mk('rect',{fill:INK,height:14});
    const rD=mk('text',{x:540,y:BASE_Y-90,'text-anchor':'middle',fill:PAPER,'font-family':'Georgia, serif','font-weight':'bold','font-size':120},null); rD.textContent='$';

    function box(el,cx,w,top){ el.setAttribute('x',(cx-w/2).toFixed(1)); el.setAttribute('y',top.toFixed(1)); el.setAttribute('width',w.toFixed(1)); el.setAttribute('height',(BASE_Y-top).toFixed(1)); }
    function hcap(el,cx,w,y,op){ el.setAttribute('x',(cx-w/2-9).toFixed(1)); el.setAttribute('y',(y-7).toFixed(1)); el.setAttribute('width',(w+18).toFixed(1)); el.setAttribute('opacity',op); }

    const clock={t:0};
    function render(){
      const t=clock.t, f=t/TOTAL, pErase=0.10;
      const pb=(f<pErase)?0:Math.pow(clamp((f-pErase)/(1-pErase),0,1),2.2);    // RECUL vers le haut : lent puis ease-in
      const drift=(t*80)%TW, tko=lerp(0.42,0.06,pb);
      for(const k of TK){ let x=((k.bx-drift)%TW+TW)%TW; const on=x<=1080; k.el.setAttribute('opacity',on?tko:0);
        if(on){ k.el.setAttribute('x1',x.toFixed(1)); k.el.setAttribute('x2',x.toFixed(1)); k.el.setAttribute('y1',(BASE_Y+64).toFixed(1)); k.el.setAttribute('y2',(BASE_Y+64+k.h).toFixed(1)); } }
      axis.setAttribute('opacity',lerp(1,0.25,pb));
      // ── le bloc GAUCHE (fermé) s'EFFACE ──
      const lop=clamp(1-f/pErase,0,1); box(leftG,360,GW,BASE_Y-520); leftG.setAttribute('opacity',lop);
      hcap(lCb,360,GW,BASE_Y,lop); hcap(lCt,360,GW,BASE_Y-520,lop); lD.setAttribute('opacity',lop);
      // ── la jauge OUVERTE : glisse au centre, puis RECUL -> s'amincit + se délave, $ s'efface (illisible) ──
      const rx=lerp(720,540,clamp(f/pErase,0,1)), rw=lerp(GW,10,pb), rcol=mix(YOU,DEAD,pb);
      box(rightG,rx,rw,BASE_Y-1760); rightG.setAttribute('fill',rcol);        // du socle jusqu'HORS CADRE en haut
      hcap(rCb,rx,rw,BASE_Y,1); rCb.setAttribute('fill',mix(INK,DEAD,pb*0.5)); // butée du bas -> point minuscule
      rD.setAttribute('x',rx.toFixed(1)); rD.setAttribute('opacity',clamp(1-pb*2.4,0,1));
    }
    const tl=gsap.timeline({paused:true});
    tl.to(clock,{t:TOTAL,duration:TOTAL,ease:'none',onUpdate:render},0);
    tl.to(SVG,{opacity:1,duration:0.001},TOTAL-0.001);
    window.__timelines=window.__timelines||{}; window.__timelines['main']=tl;
  </script>
</body>
</html>
