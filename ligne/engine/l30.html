<!doctype html>
<html lang="en" data-resolution="portrait" data-fps="30">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>:root{--paper:#F2EFE7}*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}#stage{position:absolute;inset:0}svg{position:absolute;inset:0;width:1080px;height:1920px}</style>
</head>
<body>
  <!-- L30 « THE CONFIDENCE THAT LIES » — REPRODUCTION (le master précédent a été refusé par Meta, erreur opaque). Ce rendu DIFFÈRE
       matériellement : les jauges sont des VAISSEAUX (contour encre + remplissage teal) au lieu de barres nues ; la série = une ÉCHELLE
       de coches qui monte ; la 50/50 = une pièce fil-de-fer qui BASCULE ; Mr Dollar EN PAUSE (26/07) — aucun narrateur, émotion par objets ;
       le marché = un HORIZON neutre qui dérive ; la perte S4 = une FLAQUE grise qui déborde par le bas. TOI = jauges teal. Fusil de
       Tchekhov = la JAUGE DE CONFIANCE (teal, gorgée au bord du débordement) : elle arme la perte, et se résout en S5 (drapeau jaune,
       taille tenue). S1 : émotion frame 0 = TENSION — le vaisseau de confiance DÉJÀ trop-plein, la teal déborde le rebord, l'échelle de
       wins déjà montée : rien ne se construit. S2 : DIVERGENCE — l'edge (petit vaisseau STABLE) et la confiance (énorme) ont divergé ; la
       pièce bascule (le prochain trade reste 50/50) ; l'horizon-marché n'a aucune mémoire. S3 : LA POUSSÉE — la confiance POUSSE la jauge
       de taille au sommet (taille MAX) pendant que le doute s'effondre et se délave (doute MIN), au même instant. S4 : LA DÉCHARGE — un
       mouvement de marché ORDINAIRE (petite flèche encre) fait tourner le trade, mais la position était géante : la teal se vide dans une
       FLAQUE grise qui déborde, la série effacée ; à côté, à taille normale, le même mouvement n'est qu'une éraflure. NARRATEUR ABSENT.
       S5 : DÉCHARGE du fusil — la confiance regonfle, mais un DRAPEAU JAUNE se lève et la taille RESTE stable, alignée sur l'edge constant.
       Doctrine : aucun chiffre ; gris = perte/délavage (pas de rouge) ; pas de brun ; le drapeau jaune = fanion teal-ocre d'alerte (WARN),
       jamais le brun-camp ; la pièce = fil-de-fer ; TOI = jauge teal ; bas du cadre vide. -->
  <div id="stage" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="1"><svg id="svg" viewBox="0 0 1080 1920"></svg></div>
  <script>
    const TOTAL=__TOTAL__, SC=__SCENES__, SPEC=__SPEC__;
    const NS='http://www.w3.org/2000/svg', SVG=document.getElementById('svg');
    const YOU='#1E5F6E', INK='#20242A', PAPER='#F2EFE7', DEAD='#474D50', WARN='#C9A94A';
    const CX=540;
    function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);(p||SVG).appendChild(e);return e;}
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,f)=>a+(b-a)*clamp(f,0,1),eIn=f=>f*f,eOut=f=>1-(1-f)*(1-f),eInOut=f=>f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
    const backOut=(p,s)=>{s=(s==null?1.9:s);const q=clamp(p,0,1)-1;return 1+(s+1)*q*q*q+s*q*q;};
    const setOp=(el,o)=>el.setAttribute('opacity',clamp(o,0,1).toFixed(3));
    const hx=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
    const mix=(a,b,f)=>{const A=hx(a),B=hx(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],f))).join(',')})`;};

    // NARRATEUR MR DOLLAR : EN PAUSE (décision 26/07/2026) — aucun narrateur dans les nouveaux moteurs.
    // L'épisode repose sur la mécanique « émotion par objets » SEULE.

    // ═══ LES VAISSEAUX (jauges) : contour ENCRE (la capacité) + remplissage TEAL (la valeur) ═══
    // Le remplissage BOUGE en POSITION à chaque frame (hauteur + ballant dx, deux harmoniques) — jamais de l'opacité.
    const confFrame=mk('rect',{rx:12,fill:'none',stroke:INK,'stroke-width':5,opacity:0}), confFill=mk('rect',{rx:8,fill:YOU,opacity:0}),
          confBulge=mk('ellipse',{fill:YOU,opacity:0}), confBase=mk('line',{stroke:INK,'stroke-width':6,'stroke-linecap':'round',opacity:0});
    const sizeFrame=mk('rect',{rx:12,fill:'none',stroke:INK,'stroke-width':5,opacity:0}), sizeFill=mk('rect',{rx:8,fill:YOU,opacity:0}),
          sizeBase=mk('line',{stroke:INK,'stroke-width':6,'stroke-linecap':'round',opacity:0});
    const edgeFrame=mk('rect',{rx:10,fill:'none',stroke:INK,'stroke-width':5,opacity:0}), edgeFill=mk('rect',{rx:7,fill:YOU,opacity:0}),
          edgeBase=mk('line',{stroke:INK,'stroke-width':6,'stroke-linecap':'round',opacity:0});
    const doubtFrame=mk('rect',{rx:10,fill:'none',stroke:INK,'stroke-width':5,opacity:0}), doubtFill=mk('rect',{rx:7,fill:YOU,opacity:0}),
          doubtBase=mk('line',{stroke:INK,'stroke-width':6,'stroke-linecap':'round',opacity:0});
    const scrFrame=mk('rect',{rx:10,fill:'none',stroke:INK,'stroke-width':5,opacity:0}), scrFill=mk('rect',{rx:7,fill:YOU,opacity:0}),
          scrBase=mk('line',{stroke:INK,'stroke-width':6,'stroke-linecap':'round',opacity:0}), scrNick=mk('rect',{rx:3,fill:DEAD,opacity:0});
    const lossPool=mk('rect',{rx:14,fill:DEAD,opacity:0});           // la flaque grise qui déborde par le bas (S4)
    function frame(el,cx,w,baseY,vh,op,dx){dx=dx||0;
      el.setAttribute('x',(cx-w/2-9+dx).toFixed(1));el.setAttribute('y',(baseY-vh).toFixed(1));
      el.setAttribute('width',(w+18).toFixed(1));el.setAttribute('height',Math.max(4,vh).toFixed(1));setOp(el,op);}
    function fill(el,cx,w,baseY,h,wash,op,dx,bottom){dx=dx||0;bottom=bottom||0;h=Math.max(3,h);
      el.setAttribute('x',(cx-w/2+dx).toFixed(1));el.setAttribute('y',(baseY-bottom-h).toFixed(1));
      el.setAttribute('width',w.toFixed(1));el.setAttribute('height',h.toFixed(1));
      el.setAttribute('fill',mix(YOU,DEAD,wash||0));setOp(el,op);}
    function baseLine(el,cx,w,baseY,op){el.setAttribute('x1',(cx-w/2-18).toFixed(1));el.setAttribute('x2',(cx+w/2+18).toFixed(1));
      el.setAttribute('y1',(baseY+9).toFixed(1));el.setAttribute('y2',(baseY+9).toFixed(1));setOp(el,op);}

    // ── LA SÉRIE DE WINS : une ÉCHELLE de coches teal qui monte (S1) / une rangée effacée (S4) ──
    const WINS=[]; for(let i=0;i<7;i++)WINS.push(mk('rect',{rx:6,fill:YOU,opacity:0}));
    function win(i,x,y,w,h,color,op){const e=WINS[i];e.setAttribute('x',x.toFixed(1));e.setAttribute('y',y.toFixed(1));
      e.setAttribute('width',w.toFixed(1));e.setAttribute('height',Math.max(3,h).toFixed(1));e.setAttribute('fill',color);setOp(e,op);}

    // ── LA PIÈCE (fil-de-fer) qui BASCULE : le prochain trade reste 50/50 (S2) ──
    const coin=mk('ellipse',{fill:'none',stroke:INK,'stroke-width':6,opacity:0}), coinMark=mk('circle',{r:9,fill:INK,opacity:0});
    // ── LE MARCHÉ : un HORIZON neutre qui dérive, indifférent à la série (S2) ──
    const horizon=mk('line',{stroke:DEAD,'stroke-width':6,'stroke-linecap':'round',opacity:0}), horizDot=mk('circle',{r:11,fill:'none',stroke:DEAD,'stroke-width':5,opacity:0});
    // ── LES FLÈCHES : la POUSSÉE confiance→taille (S3) ; le mouvement ORDINAIRE du marché (S4) ──
    const pushLine=mk('line',{stroke:INK,'stroke-width':9,'stroke-linecap':'round',opacity:0}), pushHead=mk('polygon',{fill:INK,opacity:0});
    const tickLine=mk('line',{stroke:INK,'stroke-width':7,'stroke-linecap':'round',opacity:0}), tickHead=mk('polygon',{fill:INK,opacity:0});
    function drawArrow(lineEl,headEl,x1,y1,x2,y2,op){lineEl.setAttribute('x1',x1.toFixed(1));lineEl.setAttribute('y1',y1.toFixed(1));
      lineEl.setAttribute('x2',x2.toFixed(1));lineEl.setAttribute('y2',y2.toFixed(1));setOp(lineEl,op);
      const ang=Math.atan2(y2-y1,x2-x1),L=26,wg=0.5;
      const p=[[x2,y2],[x2-L*Math.cos(ang-wg),y2-L*Math.sin(ang-wg)],[x2-L*Math.cos(ang+wg),y2-L*Math.sin(ang+wg)]];
      headEl.setAttribute('points',p.map(q=>[q[0].toFixed(1),q[1].toFixed(1)].join(',')).join(' '));setOp(headEl,op);}
    // ── LE DRAPEAU JAUNE (fanion d'alerte, teal-ocre — jamais brun-camp) (S5) ──
    const flagPole=mk('line',{stroke:INK,'stroke-width':7,'stroke-linecap':'round',opacity:0}), flagPenn=mk('polygon',{fill:WARN,opacity:0});

    // ── QUESTION (§M15) — 1re ligne pleine dès la frame 0 ──
    const QLINES=['WHY IS FEELING SURE','SO DANGEROUS'];
    const FS=72,lineH=96,y0=210,qY=QLINES.map((s,li)=>y0+li*lineH);
    const qEls=QLINES.map((s,li)=>{const e=mk('text',{x:CX,y:qY[li],'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':FS,'letter-spacing':'1',opacity:0});e.textContent=s;return e;});
    const QMY=y0+2*lineH+92,qMark=mk('text',{x:CX,y:QMY,'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':158,opacity:0});qMark.textContent='?';
    qEls.forEach(e=>{const t=e.textContent,f=Math.min(FS,930/Math.max(1,t.length*0.66));e.setAttribute('font-size',f.toFixed(1));});
    function hideQ(){for(const e of qEls)setOp(e,0);setOp(qMark,0);}

    // ── ÉTIQUETTES (§M18) — putCap MESURE la largeur réelle (getComputedTextLength), COPIÉ TEL QUEL de l26 ──
    function caption(sz){return mk('text',{'text-anchor':'middle','font-family':'Helvetica Neue, Arial, sans-serif','font-weight':(sz>44?800:700),'font-size':(sz||38),'data-fs':(sz||38),'letter-spacing':'1.5',opacity:0});}
    const capA=caption(40),capB=caption(44),capC=caption(38),capD=caption(36),capE=caption(36),capF=caption(36);
    function putCap(el,txt,cx,y,color,op){
      // MESURE réelle (getComputedTextLength inclut le letter-spacing, ignoré par l'ancienne estimation ×0.66 —
      // cause du débordement live). Réduit la police pour tenir dans la zone sûre, puis borne le CENTRE par la
      // demi-largeur MESURÉE : un texte ne peut PLUS être coupé au bord.
      const MARGIN=70, MAXW=1080-2*MARGIN;
      if(el.__cap!==txt){ el.__cap=txt; el.textContent=txt;
        const nom=+el.getAttribute('data-fs')||+el.getAttribute('font-size')||38;
        el.setAttribute('font-size',nom);
        let w=el.getComputedTextLength()||0;
        if(!w) w=txt.length*nom*0.72;
        if(w>MAXW){ const fs=Math.max(18,nom*MAXW/w); el.setAttribute('font-size',fs.toFixed(1)); w=el.getComputedTextLength()||txt.length*fs*0.72; }
        el.__hw=w/2;
      }
      const x=clamp(+cx, MARGIN+el.__hw, 1080-MARGIN-el.__hw);
      el.setAttribute('x',x.toFixed(1));el.setAttribute('y',y);el.setAttribute('fill',color);setOp(el,op);}
    function hideCaps(){for(const e of [capA,capB,capC,capD,capE,capF])setOp(e,0);}

    // coupe franche : chaque scène ré-affiche SES objets, déjà pleins
    function hideDyn(){for(const e of [confFrame,confFill,confBulge,confBase,sizeFrame,sizeFill,sizeBase,edgeFrame,edgeFill,edgeBase,
      doubtFrame,doubtFill,doubtBase,scrFrame,scrFill,scrBase,scrNick,lossPool,coin,coinMark,horizon,horizDot,
      pushLine,pushHead,tickLine,tickHead,flagPole,flagPenn])setOp(e,0);
      for(const e of WINS)setOp(e,0);hideCaps();}

    // ═══ S1 — LA CONFIANCE TROP-PLEINE (émotion frame 0 : TENSION, au bord du débordement) ═══
    // Verbe visuel : le débordement (la teal gorge le vaisseau et passe le rebord ; l'échelle de wins déjà montée).
    function s1(lf,t,s){
      const u=t-s; hideDyn();
      const gf=clamp(1-(lf-0.85)/0.10,0,1);
      for(let k=0;k<qEls.length;k++){const qt=(k===0?0.18:u-(0.1+k*0.30)),ap=clamp(qt/0.18,0,1),sc=0.7+0.3*backOut(ap);setOp(qEls[k],ap*gf);qEls[k].setAttribute('transform',`translate(${(CX*(1-sc)).toFixed(2)} ${(qY[k]*(1-sc)).toFixed(2)}) scale(${sc.toFixed(3)})`);}
      const qm=u-0.95,qap=clamp(qm/0.2,0,1),qsc=0.6+0.4*backOut(qap);setOp(qMark,qap*gf);qMark.setAttribute('transform',`translate(${(CX*(1-qsc)).toFixed(2)} ${(QMY*(1-qsc)).toFixed(2)}) scale(${qsc.toFixed(3)})`);
      // ── ÉMOTION FRAME 0 : le vaisseau de confiance est DÉJÀ trop-plein, la teal DÉBORDE le rebord, gorgée (deux harmoniques). ──
      const cx=562, base=1338, w=176, vh=430;
      const over=44+22*Math.sin(u*1.15)+12*Math.sin(u*2.05);            // remplissage AU-DELÀ du rebord = danger
      const h=vh+over, dx=6*Math.sin(u*0.85)+3*Math.sin(u*1.70);
      frame(confFrame,cx,w,base,vh,1,dx);
      fill(confFill,cx,w,base,h,0,1,dx);
      const topY=base-h, rx=w/2-6+5*Math.sin(u*1.7), ry=20+7*Math.abs(Math.sin(u*1.9));  // la ménisque bombée qui va déborder
      confBulge.setAttribute('cx',(cx+dx).toFixed(1));confBulge.setAttribute('cy',topY.toFixed(1));
      confBulge.setAttribute('rx',rx.toFixed(1));confBulge.setAttribute('ry',ry.toFixed(1));setOp(confBulge,1);
      baseLine(confBase,cx,w,base,1);
      putCap(capA,'CONFIDENCE',cx,base+66,YOU,1);
      // ── L'ÉCHELLE DE WINS : des coches teal qui MONTENT vers la droite (la belle série) ──
      for(let i=0;i<6;i++){const wx=138+i*50, wy=1360-i*66+8*Math.sin(u*1.7+i*0.8)+4*Math.sin(u*2.9+i*0.5);
        win(i,wx,wy,44,30,YOU,1);}
      putCap(capB,'A GOOD RUN',256,980,YOU,clamp((u-1.6)/0.7,0,1)*gf);
    }

    // ═══ S2 — LA DIVERGENCE : l'edge STABLE, la confiance ÉNORME ; la pièce 50/50 ; l'horizon sans mémoire ═══
    // Verbe visuel : la comparaison A/B (deux vaisseaux qui ont DIVERGÉ) + la pièce qui bascule.
    function s2(lf,t,s){
      const u=t-s; hideQ(); hideDyn();
      // EDGE (petit vaisseau, STABLE) — à peine vivant, il ne grandit pas
      const ex=150, ebase=1300, ew=116, evh=230, edx=5*Math.sin(u*0.9)+2.5*Math.sin(u*1.9);
      const eh=150+5*Math.sin(u*1.3)+2*Math.sin(u*2.4);
      frame(edgeFrame,ex,ew,ebase,evh,1,edx); fill(edgeFill,ex,ew,ebase,eh,0,1,edx); baseLine(edgeBase,ex,ew,ebase,1);
      putCap(capC,'YOUR EDGE',ex,ebase+64,YOU,1);
      putCap(capE,'UNCHANGED',ex,ebase-evh-26,DEAD,clamp((u-2.4)/0.7,0,1));
      // CONFIANCE (énorme) — elle a divergé de l'edge
      const cx=452, cbase=1360, cw=164, cvh=520, cdx=6*Math.sin(u*0.80)+3*Math.sin(u*1.65);
      const ch=498+18*Math.sin(u*1.05)+10*Math.sin(u*1.95);
      frame(confFrame,cx,cw,cbase,cvh,1,cdx); fill(confFill,cx,cw,cbase,ch,0,1,cdx); baseLine(confBase,cx,cw,cbase,1);
      putCap(capA,'CONFIDENCE',cx,cbase+66,YOU,1);
      // LA PIÈCE fil-de-fer qui BASCULE (haut-droite) : toujours 50/50 — elle bobote et tourne (rx = vue de tranche)
      const coinCx=816, coinCy=748+13*Math.sin(u*1.4)+5*Math.sin(u*2.5);
      const crx=Math.max(4,48*Math.abs(Math.cos(u*2.7)));
      coin.setAttribute('cx',coinCx);coin.setAttribute('cy',coinCy.toFixed(1));coin.setAttribute('rx',crx.toFixed(1));coin.setAttribute('ry',48);setOp(coin,1);
      coinMark.setAttribute('cx',coinCx);coinMark.setAttribute('cy',coinCy.toFixed(1));setOp(coinMark,crx>30?0.9:0);
      putCap(capD,'STILL A COIN FLIP',816,656,INK,clamp((u-1.2)/0.6,0,1));
      // L'HORIZON-MARCHÉ : une ligne neutre qui dérive à peine, indifférente à la série (droite, dégagée)
      const hy=1132+10*Math.sin(u*0.85)+4*Math.sin(u*1.75), hdx=9*Math.sin(u*0.7)+4*Math.sin(u*1.5);
      horizon.setAttribute('x1',(702+hdx).toFixed(1));horizon.setAttribute('x2',(1000+hdx).toFixed(1));
      horizon.setAttribute('y1',hy.toFixed(1));horizon.setAttribute('y2',hy.toFixed(1));setOp(horizon,1);
      horizDot.setAttribute('cx',(840+hdx+16*Math.sin(u*1.1)).toFixed(1));horizDot.setAttribute('cy',(hy).toFixed(1));setOp(horizDot,clamp((u-1.6)/0.6,0,1));
      putCap(capF,'MARKET FORGETS',842,hy+82,DEAD,clamp((u-1.8)/0.6,0,1));
      putCap(capB,'CONFIDENCE GREW — YOUR EDGE DID NOT',CX,598,INK,clamp((u-3.0)/0.7,0,1));
    }

    // ═══ S3 — LA POUSSÉE : la confiance pousse la TAILLE au sommet, pendant que le doute s'effondre ═══
    // Verbe visuel : la poussée (une force soulève la taille) + l'effondrement délavé du doute.
    function s3(lf,t,s){
      const u=t-s; hideQ(); hideDyn();
      // CONFIANCE (gauche) : la source
      const cx=226, cbase=1360, cw=150, cvh=520, cdx=5*Math.sin(u*0.85)+2.5*Math.sin(u*1.7);
      const ch=498+18*Math.sin(u*1.1)+10*Math.sin(u*1.95);
      frame(confFrame,cx,cw,cbase,cvh,1,cdx); fill(confFill,cx,cw,cbase,ch,0,1,cdx); baseLine(confBase,cx,cw,cbase,1);
      putCap(capA,'CONFIDENCE',cx,cbase+64,YOU,1);
      // TAILLE (centre) : poussée vers le haut, elle grossit — le vaisseau se remplit
      const grow=eOut(clamp(u/2.4,0,1));
      const sx=548, sbase=1360, sw=182, svh=600, sdx=6*Math.sin(u*0.95)+3*Math.sin(u*1.8);
      const sh=(150+430*grow)+16*Math.sin(u*1.25)+9*Math.sin(u*2.15);
      frame(sizeFrame,sx,sw,sbase,svh,1,sdx); fill(sizeFill,sx,sw,sbase,sh,0,1,sdx); baseLine(sizeBase,sx,sw,sbase,1);
      putCap(capC,'POSITION SIZE',sx,sbase+64,YOU,1);
      // la flèche de poussée : de la confiance vers la taille (dans la gouttière entre les deux, jamais sur un texte)
      drawArrow(pushLine,pushHead, cx+cw/2+18, cbase-ch*0.55, sx-sw/2-18, sbase-sh*0.52, clamp((u-0.3)/0.6,0,1));
      // DOUTE (droite) : s'effondre et se délave (gris) — au plus bas
      const sink=eInOut(clamp(u/2.6,0,1));
      const dx3=862, dbase=1360, dw=118, dvh=340, ddx=4*Math.sin(u*0.8)+2*Math.sin(u*1.6);
      const dh=(300*(1-0.82*sink))+8*Math.sin(u*1.4)+4*Math.sin(u*2.3);
      frame(doubtFrame,dx3,dw,dbase,dvh,1,ddx); fill(doubtFill,dx3,dw,dbase,dh,0.20+0.72*sink,1,ddx); baseLine(doubtBase,dx3,dw,dbase,1);
      putCap(capD,'DOUBT',dx3,dbase+64,DEAD,1);
      putCap(capE,'AT ITS LOWEST',dx3,dbase-dvh-30,DEAD,clamp((u-2.2)/0.7,0,1));
      putCap(capB,'BIGGEST SIZE — LEAST DOUBT — SAME MOMENT',CX,594,INK,clamp((u-2.8)/0.7,0,1));
    }

    // ═══ S4 — LA DÉCHARGE : un mouvement ORDINAIRE, une perte ÉNORME (parce que la taille l'était). NARRATEUR ABSENT. ═══
    // Verbe visuel : la vidange (la teal se draine dans une FLAQUE grise qui déborde par le bas) vs l'éraflure.
    function s4(lf,t,s){
      const u=t-s; hideQ(); hideDyn();
      // la série de wins (haut), effacée à mesure et grisée
      const wipe=clamp((u-1.8)/2.6,0,1);
      for(let i=0;i<7;i++){const gone=clamp(wipe*7-i,0,1);
        const wx=246+i*88, wy=634+9*Math.sin(u*1.6+i*0.6)+4*Math.sin(u*2.8+i*0.4)+40*gone;   // les effacées glissent vers le bas
        win(i,wx,wy,56,32,mix(YOU,DEAD,gone),1-0.82*gone);}
      // GAUCHE — taille NORMALE : le même mouvement n'est qu'une éraflure
      const nx=150, nbase=1360, nw=104, nvh=230, ndx=4*Math.sin(u*0.9)+2*Math.sin(u*1.8);
      const nh=150+8*Math.sin(u*1.2)+4*Math.sin(u*2.1);
      frame(scrFrame,nx,nw,nbase,nvh,1,ndx); fill(scrFill,nx,nw,nbase,nh,0,1,ndx); baseLine(scrBase,nx,nw,nbase,1);
      scrNick.setAttribute('x',(nx-nw/2+ndx).toFixed(1));scrNick.setAttribute('y',(nbase-nh-18).toFixed(1));
      scrNick.setAttribute('width',nw);scrNick.setAttribute('height',(14+2*Math.sin(u*3.0)).toFixed(1));setOp(scrNick,clamp((u-1.5)/0.6,0,1));
      putCap(capC,'NORMAL SIZE',nx,nbase+64,YOU,1);
      putCap(capE,'JUST A SCRATCH',nx,nbase-nvh-30,DEAD,clamp((u-2.0)/0.6,0,1));
      // CENTRE — taille CONFIANCE : la teal se draine, une FLAQUE grise déborde par le bas et s'élargit
      const drain=eInOut(clamp((u-1.6)/2.6,0,1));
      const sx=578, sbase=1360, sw=188, svh=560, sdx=6*Math.sin(u*0.9)+3*Math.sin(u*1.75);
      const poolH=26+150*drain, poolW=sw+150*drain;
      lossPool.setAttribute('x',(sx-poolW/2+sdx).toFixed(1));lossPool.setAttribute('y',(sbase-poolH).toFixed(1));
      lossPool.setAttribute('width',poolW.toFixed(1));lossPool.setAttribute('height',poolH.toFixed(1));setOp(lossPool,drain>0.02?0.9:0);
      const tealH=(svh-40)*(1-0.86*drain)+13*Math.sin(u*1.2)+7*Math.sin(u*2.1);   // la teal restante, poussée au-dessus de la flaque
      frame(sizeFrame,sx,sw,sbase,svh,1,sdx); fill(sizeFill,sx,sw,sbase,tealH,0,1,sdx,poolH); baseLine(sizeBase,sx,sw,sbase,1);
      putCap(capA,'CONFIDENCE SIZE',sx,sbase+64,YOU,1);
      // le mouvement ORDINAIRE du marché : une petite flèche encre, à droite du vaisseau ; l'étiquette AU-DESSUS de la jauge (bande libre)
      const ay=820+10*Math.sin(u*1.3), ax=800+6*Math.sin(u*1.7);
      drawArrow(tickLine,tickHead, ax, ay, ax, ay+96, 1);
      putCap(capD,'AN ORDINARY MOVE',820,748,INK,clamp((u-0.5)/0.6,0,1));
      putCap(capB,'THE STREAK ARMED THE TRADE THAT ENDED IT',CX,566,INK,clamp((u-3.0)/0.7,0,1));
    }

    // ═══ S5 — DÉCHARGE DU FUSIL : la confiance regonfle, mais la taille TIENT (drapeau jaune) ═══
    // Verbe visuel : la retenue (la taille refuse de monter) + le fanion d'alerte qui se lève.
    function s5(lf,t,s){
      const u=t-s; hideQ(); hideDyn();
      // CONFIANCE (gauche) : elle regonfle
      const cx=244, cbase=1360, cw=150, cvh=560, cdx=5*Math.sin(u*0.85)+2.5*Math.sin(u*1.7);
      const ch=470+44*eOut(clamp(u/2.2,0,1))+16*Math.sin(u*1.1)+9*Math.sin(u*1.95);
      frame(confFrame,cx,cw,cbase,cvh,1,cdx); fill(confFill,cx,cw,cbase,ch,0,1,cdx); baseLine(confBase,cx,cw,cbase,1);
      putCap(capA,'CONFIDENCE',cx,cbase+64,YOU,1);
      // TAILLE (centre) : elle RESTE stable — ne monte pas avec la confiance
      const sx=556, sbase=1360, sw=178, svh=430, sdx=4*Math.sin(u*0.9)+2*Math.sin(u*1.8);
      const hold=306, sh=hold+11*Math.sin(u*1.2)+5*Math.sin(u*2.1);
      frame(sizeFrame,sx,sw,sbase,svh,1,sdx); fill(sizeFill,sx,sw,sbase,sh,0,1,sdx); baseLine(sizeBase,sx,sw,sbase,1);
      putCap(capC,'SIZE — HELD',sx,sbase+64,YOU,1);
      // LE DRAPEAU JAUNE se lève près de la taille et la fait tenir
      const rise=eOut(clamp((u-0.4)/1.3,0,1));
      const fx=sx+sw/2+62, fbaseY=sbase-svh, ftopY=fbaseY-30-190*rise;
      flagPole.setAttribute('x1',fx);flagPole.setAttribute('x2',fx);flagPole.setAttribute('y1',(fbaseY).toFixed(1));flagPole.setAttribute('y2',ftopY.toFixed(1));setOp(flagPole,rise);
      const wave=11*Math.sin(u*3.0)+5*Math.sin(u*5.1);
      flagPenn.setAttribute('points',`${fx},${ftopY.toFixed(1)} ${(fx+92).toFixed(1)},${(ftopY+24+wave).toFixed(1)} ${fx},${(ftopY+50).toFixed(1)}`);setOp(flagPenn,rise);
      putCap(capE,'A YELLOW FLAG, NOT GREEN',760,ftopY-26,WARN,clamp((u-1.4)/0.6,0,1));
      // EDGE (droite) : constante — la taille s'aligne sur elle, pas sur la confiance
      const ex=890, ebase=1300, ew=110, evh=250, edx=4*Math.sin(u*0.9)+2*Math.sin(u*1.9);
      const eh=196+4*Math.sin(u*1.3)+2*Math.sin(u*2.4);
      frame(edgeFrame,ex,ew,ebase,evh,1,edx); fill(edgeFill,ex,ew,ebase,eh,0,1,edx); baseLine(edgeBase,ex,ew,ebase,1);
      putCap(capD,'EDGE — CONSTANT',ex,ebase-evh-28,YOU,clamp((u-2.0)/0.7,0,1));
      putCap(capB,'STAY THE SAME SIZE — A BONUS, NOT A TRAP',CX,592,INK,clamp((u-2.6)/0.7,0,1));
    }

    const RENDER={s1,s2,s3,s4,s5};const SCENEFN=SPEC.map(s=>RENDER[s.id]||s1);
    const clock={t:0};
    function sceneAt(t){let i=0;for(let k=0;k<SC.length;k++){if(t>=SC[k].s-1e-6)i=k;}return Math.min(i,SCENEFN.length-1);}
    function render(){const t=clock.t;const i=sceneAt(t),lf=clamp((t-SC[i].s)/SC[i].d,0,1);SCENEFN[i](lf,t,SC[i].s);}
    const tl=gsap.timeline({paused:true});
    tl.to(clock,{t:TOTAL,duration:TOTAL,ease:'none',onUpdate:render},0);
    tl.to(SVG,{opacity:1,duration:0.001},TOTAL-0.001);
    window.__timelines=window.__timelines||{};window.__timelines['main']=tl;
  </script>
