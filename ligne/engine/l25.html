<!doctype html>
<html lang="en" data-resolution="portrait" data-fps="30">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>:root{--paper:#F2EFE7}*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}#stage{position:absolute;inset:0}svg{position:absolute;inset:0;width:1080px;height:1920px}</style>
</head>
<body>
  <!-- L25 « THE STOP YOU MOVED » — TOI = jauge teal (ta position). Le STOP = un trait net verrouillé par un cadenas teal (la promesse
       faite au calme). S1 : émotion frame 0 = levier TENSION — le prix est DÉJÀ à un cheveu du trait, le cadenas pulse : l'instant juste
       avant. S2 : la promesse a été prise AVANT que la peur entre — deux emplacements vides (FEAR / HOPE) marquent leur absence.
       S3 : ils entrent, poussent, le cadenas SAUTE et le trait GLISSE plus bas ; l'ancienne position reste en fantôme. S4 : la ligne qui
       a bougé une fois bouge toujours — un ESCALIER de stops fantômes descend, la jauge se délave puis s'effondre, alors que le PREMIER
       stop n'était qu'une éraflure. S5 : décharge — le cadenas TIENT, le prix touche, une éraflure grise sort, la jauge reste debout.
       Doctrine : aucun chiffre ; gris = perte/délavage (pas de rouge) ; pas de brun ; FEAR/HOPE = ronds d'encre pulsants, jamais des
       visages ; TOI jamais une figure ; bas du cadre vide. -->
  <div id="stage" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="1"><svg id="svg" viewBox="0 0 1080 1920"></svg></div>
  <script>
    const TOTAL=__TOTAL__, SC=__SCENES__, SPEC=__SPEC__;
    const NS='http://www.w3.org/2000/svg', SVG=document.getElementById('svg');
    const YOU='#1E5F6E', INK='#20242A', PAPER='#F2EFE7', DEAD='#474D50';
    const CX=540;
    function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);(p||SVG).appendChild(e);return e;}
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,f)=>a+(b-a)*clamp(f,0,1),eIn=f=>f*f,eOut=f=>1-(1-f)*(1-f),eInOut=f=>f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
    const backOut=(p,s)=>{s=(s==null?1.9:s);const q=clamp(p,0,1)-1;return 1+(s+1)*q*q*q+s*q*q;};
    const setOp=(el,o)=>el.setAttribute('opacity',clamp(o,0,1).toFixed(3));
    const hx=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
    const mix=(a,b,f)=>{const A=hx(a),B=hx(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],f))).join(',')})`;};

    // ── TA POSITION (jauge teal) ──
    const GX=250, GW=130, GBASE=1330, GFULL=420;
    const gauge=mk('rect',{x:GX-GW/2,width:GW,rx:5,fill:YOU,opacity:0});
    const gaugeBase=mk('line',{x1:GX-95,y1:GBASE+8,x2:GX+95,y2:GBASE+8,stroke:INK,'stroke-width':6,opacity:0});
    function setGauge(h,wash,op){gauge.setAttribute('y',(GBASE-h).toFixed(1));gauge.setAttribute('height',Math.max(3,h).toFixed(1));
      gauge.setAttribute('fill',mix(YOU,DEAD,wash||0));setOp(gauge,op);setOp(gaugeBase,op);}

    // ── LE STOP : un trait net + son CADENAS (la promesse) ──
    const TX0=440, TX1=930;
    const ghosts=[]; for(let i=0;i<5;i++)ghosts.push(mk('line',{x1:TX0,x2:TX1,stroke:DEAD,'stroke-width':4,'stroke-dasharray':'14 11',opacity:0}));
    const stop=mk('line',{x1:TX0,x2:TX1,stroke:INK,'stroke-width':9,opacity:0});
    const lockBody=mk('rect',{width:52,height:44,rx:6,fill:YOU,opacity:0});
    const lockArc=mk('path',{fill:'none',stroke:YOU,'stroke-width':9,opacity:0});
    function setStop(y,op){stop.setAttribute('y1',y.toFixed(1));stop.setAttribute('y2',y.toFixed(1));setOp(stop,op);}
    function setLock(y,open,op,wob){const lx=TX1-92, ly=y-58+(wob||0);
      lockBody.setAttribute('x',lx);lockBody.setAttribute('y',ly.toFixed(1));
      lockBody.setAttribute('fill',open?DEAD:YOU);setOp(lockBody,op);
      const a=open?22:0;                                                  // ouvert : l'anse bascule
      lockArc.setAttribute('d',`M ${lx+10} ${ly} L ${lx+10} ${ly-16} A 16 16 0 0 1 ${lx+42+a} ${ly-16-a*0.3} L ${lx+42+a} ${ly-2}`);
      lockArc.setAttribute('stroke',open?DEAD:YOU);setOp(lockArc,op);}
    function hideStop(){setOp(stop,0);setOp(lockBody,0);setOp(lockArc,0);for(const g of ghosts)setOp(g,0);}

    // ── LE PRIX qui descend vers le trait ──
    const PX=690;
    const price=mk('circle',{r:19,fill:INK,opacity:0});
    const trail=mk('polyline',{fill:'none',stroke:INK,'stroke-width':5,'stroke-linejoin':'round',opacity:0});
    function setPrice(y,op){price.setAttribute('cx',PX);price.setAttribute('cy',y.toFixed(1));setOp(price,op);}

    // ── FEAR / HOPE : deux présences (ronds d'encre), absentes puis envahissantes ──
    const fear=mk('circle',{r:30,fill:INK,opacity:0}), hope=mk('circle',{r:30,fill:INK,opacity:0});
    const fearSlot=mk('circle',{r:30,fill:'none',stroke:DEAD,'stroke-width':4,'stroke-dasharray':'10 8',opacity:0});
    const hopeSlot=mk('circle',{r:30,fill:'none',stroke:DEAD,'stroke-width':4,'stroke-dasharray':'10 8',opacity:0});
    const pushA=mk('line',{stroke:INK,'stroke-width':5,opacity:0}), pushB=mk('line',{stroke:INK,'stroke-width':5,opacity:0});
    function hidePresences(){for(const e of [fear,hope,fearSlot,hopeSlot,pushA,pushB])setOp(e,0);}

    // ── L'ÉRAFLURE (la petite tranche qui sort quand le stop est honoré) ──
    const scratch=mk('rect',{x:GX-GW/2,width:GW,rx:4,fill:DEAD,opacity:0});

    // ── QUESTION (§M15) — 1re ligne pleine dès la frame 0 ──
    const QLINES=['WHAT HAPPENS WHEN YOU','MOVE YOUR STOP'];
    const FS=64,lineH=90,y0=200,qY=QLINES.map((s,li)=>y0+li*lineH);
    const qEls=QLINES.map((s,li)=>{const e=mk('text',{x:CX,y:qY[li],'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':FS,'letter-spacing':'1',opacity:0});e.textContent=s;return e;});
    const QMY=y0+2*lineH+92,qMark=mk('text',{x:CX,y:QMY,'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':150,opacity:0});qMark.textContent='?';
    function hideQ(){for(const e of qEls)setOp(e,0);setOp(qMark,0);}

    // ── ÉTIQUETTES (§M18) ──
    function caption(sz){return mk('text',{'text-anchor':'middle','font-family':'Helvetica Neue, Arial, sans-serif','font-weight':(sz>44?800:700),'font-size':(sz||38),'letter-spacing':'1.5',opacity:0});}
    const capA=caption(40),capB=caption(44),capC=caption(36),capD=caption(36),capE=caption(36);
    function putCap(el,txt,cx,y,color,op){el.textContent=txt;const hw=txt.length*(+el.getAttribute('font-size'))*0.30,x=clamp(+cx,40+hw,1040-hw);el.setAttribute('x',x.toFixed(1));el.setAttribute('y',y);el.setAttribute('fill',color);setOp(el,op);}
    function hideCaps(){for(const e of [capA,capB,capC,capD,capE])setOp(e,0);}

    const SY0=1000;                                                       // la position d'origine du stop

    // ═══ S1 — LE STOP POSÉ, VERROUILLÉ — ET LE PRIX DÉJÀ À UN CHEVEU ═══
    // Verbe visuel : l'approche (la distance se referme, la promesse tient encore).
    function s1(lf,t,s){
      const u=t-s; hideCaps(); hidePresences(); setOp(scratch,0); for(const g of ghosts)setOp(g,0);
      const gf=clamp(1-(lf-0.82)/0.10,0,1);
      for(let k=0;k<qEls.length;k++){const qt=(k===0?0.18:u-(0.1+k*0.28)),ap=clamp(qt/0.18,0,1),sc=0.7+0.3*backOut(ap);setOp(qEls[k],ap*gf);qEls[k].setAttribute('transform',`translate(${(CX*(1-sc)).toFixed(2)} ${(qY[k]*(1-sc)).toFixed(2)}) scale(${sc.toFixed(3)})`);}
      const qm=u-0.9,qap=clamp(qm/0.2,0,1),qsc=0.6+0.4*backOut(qap);setOp(qMark,qap*gf);qMark.setAttribute('transform',`translate(${(CX*(1-qsc)).toFixed(2)} ${(QMY*(1-qsc)).toFixed(2)}) scale(${qsc.toFixed(3)})`);
      // ── ÉMOTION FRAME 0 (levier TENSION) : le trait est DÉJÀ posé et verrouillé, et le prix est DÉJÀ juste
      //    au-dessus — à un cheveu. Rien à construire : la tension est entière dès la première frame.
      setGauge(GFULL+7*Math.sin(u*1.15)+4*Math.sin(u*2.05),0,1);
      putCap(capA,'YOUR POSITION',GX,GBASE+76,YOU,1);
      setStop(SY0,1);
      setLock(SY0,false,1,4*Math.sin(u*2.8)+2*Math.sin(u*1.3));                             // le cadenas respire (la promesse tient)
      putCap(capC,'YOUR STOP',TX0+140,SY0+62,INK,1);
      setPrice(SY0-58-44*Math.abs(Math.sin(u*0.75))-14*Math.sin(u*1.9)-6*Math.sin(u*3.3),1); // le prix rôde tout près, il ne se pose jamais
      putCap(capD,'PRICE',PX,SY0-150,INK,clamp((u-0.6)/0.5,0,1)*gf);
    }

    // ═══ S2 — LA PROMESSE A ÉTÉ FAITE AVANT QUE LA PEUR ENTRE ═══
    // Verbe visuel : l'absence marquée (deux emplacements vides — la décision est prise sans eux).
    function s2(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); setOp(scratch,0); for(const g of ghosts)setOp(g,0);
      setGauge(GFULL+7*Math.sin(u*1.15)+4*Math.sin(u*2.05),0,1);
      putCap(capA,'YOUR POSITION',GX,GBASE+76,YOU,1);
      setStop(SY0,1); setLock(SY0,false,1,4*Math.sin(u*2.6)+2*Math.sin(u*1.2));
      setPrice(SY0-150-52*Math.abs(Math.sin(u*0.65))-15*Math.sin(u*1.8)-6*Math.sin(u*3.1),1);
      // les deux places VIDES : la peur et l'espoir ne sont pas encore dans la pièce
      setOp(fear,0);setOp(hope,0);setOp(pushA,0);setOp(pushB,0);
      for(const [el,x] of [[fearSlot,150],[hopeSlot,1000]]){
        el.setAttribute('cx',x);el.setAttribute('cy',(1150+7*Math.sin(u*1.4+x)).toFixed(1));
        el.setAttribute('stroke-dashoffset',(u*16).toFixed(0));setOp(el,0.7);}
      putCap(capC,'FEAR — NOT HERE YET',150,1246,DEAD,clamp((u-0.7)/0.6,0,1));
      putCap(capD,'HOPE — NOT HERE YET',1000,1246,DEAD,clamp((u-1.1)/0.6,0,1));
      putCap(capB,'A PROMISE MADE WHILE THINKING CLEARLY',CX,660,INK,clamp((u-2.2)/0.7,0,1));
    }

    // ═══ S3 — ILS ENTRENT, LE CADENAS SAUTE, LE TRAIT GLISSE ═══
    // Verbe visuel : la poussée (deux forces entrent dans le cadre et déplacent la ligne).
    function s3(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); setOp(scratch,0);
      setGauge(GFULL,0.10*clamp((u-2.0)/2.0,0,1),1);
      putCap(capA,'YOUR POSITION',GX,GBASE+76,YOU,1);
      // ils entrent
      const inx=eInOut(clamp(u/1.4,0,1));
      const fx=lerp(150,455,inx), hxp=lerp(1000,915,inx), py=1150;
      setOp(fearSlot,0);setOp(hopeSlot,0);
      for(const [el,x,ph] of [[fear,fx,0],[hope,hxp,2.1]]){
        el.setAttribute('cx',x.toFixed(1));el.setAttribute('cy',(py+9*Math.sin(u*2.6+ph)).toFixed(1));
        el.setAttribute('r',(30+4*Math.sin(u*3.1+ph)).toFixed(1));setOp(el,1);}
      putCap(capC,'FEAR',fx,py+72,INK,1);
      putCap(capD,'HOPE',hxp,py+72,INK,1);
      // le cadenas saute (1.4) et le trait GLISSE plus bas
      const pop=clamp((u-1.4)/0.25,0,1), slide=eInOut(clamp((u-1.6)/1.3,0,1));
      const sy=SY0+112*slide;
      ghosts[0].setAttribute('y1',SY0);ghosts[0].setAttribute('y2',SY0);setOp(ghosts[0],pop*0.75);   // l'ancienne place reste visible
      ghosts[0].setAttribute('stroke-dashoffset',(u*14).toFixed(0));
      setStop(sy,1); setLock(sy,pop>0.5,1,(pop>0.5?7:4)*Math.sin(u*(pop>0.5?4.2:2.6)));
      // les deux poussées, qui appuient sur le trait
      pushA.setAttribute('x1',(fx+34).toFixed(1));pushA.setAttribute('y1',py);pushA.setAttribute('x2',(fx+34).toFixed(1));pushA.setAttribute('y2',(sy+16).toFixed(1));setOp(pushA,pop*0.8);
      pushB.setAttribute('x1',(hxp-34).toFixed(1));pushB.setAttribute('y1',py);pushB.setAttribute('x2',(hxp-34).toFixed(1));pushB.setAttribute('y2',(sy+16).toFixed(1));setOp(pushB,pop*0.8);
      setPrice(sy-58-22*Math.abs(Math.sin(u*0.9))-8*Math.sin(u*2.5),1);
      putCap(capB,'JUST A LITTLE MORE ROOM',CX,660,INK,clamp((u-2.6)/0.7,0,1));
    }

    // ═══ S4 — L'ESCALIER : la ligne qui a bougé une fois bouge toujours ═══
    // Verbe visuel : l'escalier descendant (chaque recul laisse son fantôme, la jauge se vide).
    function s4(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); setOp(scratch,0);
      // les reculs, de plus en plus rapides
      const STEPS=[[0.20,112],[1.05,112],[1.75,112],[2.30,112]];
      let sy=SY0+112, k=0;
      for(let i=0;i<STEPS.length;i++){const [t0,dd]=STEPS[i];const p=eInOut(clamp((u-t0)/0.42,0,1));sy+=dd*p;if(p>0.5)k=i+1;}
      // les fantômes des positions précédentes = l'escalier
      const GY=[SY0,SY0+112,SY0+224,SY0+336,SY0+448];
      for(let i=0;i<ghosts.length;i++){
        ghosts[i].setAttribute('y1',GY[i]);ghosts[i].setAttribute('y2',GY[i]);
        ghosts[i].setAttribute('stroke-dashoffset',((i%2?1:-1)*u*13).toFixed(0));
        setOp(ghosts[i], GY[i]<sy-8 ? (i===0?0.85:0.6) : 0);}
      const dead=clamp((u-2.85)/0.9,0,1);                                 // le dernier recul vide tout
      setGauge(GFULL*(1-0.72*clamp(u/3.0,0,1))*(1-dead)+6*dead, 0.35+0.65*dead, 1);
      putCap(capA,'YOUR POSITION',GX,GBASE+76,YOU,1);
      setStop(Math.min(sy,1420),1); setLock(Math.min(sy,1420),true,1,6*Math.sin(u*3.6));
      setPrice(Math.min(sy,1420)-52-20*Math.abs(Math.sin(u*1.15))-8*Math.sin(u*2.8),1);
      // les présences restent aux commandes, elles respirent
      for(const [el,x,ph] of [[fear,455,0],[hope,915,2.1]]){
        el.setAttribute('cx',x);el.setAttribute('cy',(1150+11*Math.sin(u*2.4+ph)).toFixed(1));
        el.setAttribute('r',(30+5*Math.sin(u*3.1+ph)).toFixed(1));setOp(el,0.85);}
      setOp(pushA,0);setOp(pushB,0);setOp(fearSlot,0);setOp(hopeSlot,0);
      putCap(capC,'WHERE YOU SAID YOU WERE WRONG',TX0+230,SY0-28,DEAD,clamp((u-3.4)/0.7,0,1));
      putCap(capB,'A LINE THAT MOVES ONCE MOVES ALWAYS',CX,640,INK,clamp((u-3.0)/0.7,0,1));
      putCap(capE,'THE SCRATCH BECAME THE ACCOUNT',CX,1520,DEAD,clamp((u-4.2)/0.7,0,1));
    }

    // ═══ S5 — DÉCHARGE : le cadenas TIENT, la sortie n'est qu'une éraflure ═══
    // Verbe visuel : la ligne qui ne cède pas (la poussée s'écrase contre elle).
    function s5(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); for(const g of ghosts)setOp(g,0); setOp(fearSlot,0);setOp(hopeSlot,0);
      // ils poussent — mais le trait ne bouge pas (il vibre à peine, et revient)
      const resist=clamp(u/1.6,0,1), sy=SY0+7*Math.sin(u*5.2)*(1-resist*0.75);
      for(const [el,x,ph] of [[fear,455,0],[hope,915,2.1]]){
        el.setAttribute('cx',(x+9*Math.sin(u*2.2+ph)).toFixed(1));el.setAttribute('cy',(1150+9*Math.sin(u*2.6+ph)).toFixed(1));
        el.setAttribute('r',(30-8*resist+4*Math.sin(u*3.1+ph)).toFixed(1));setOp(el,1-0.45*resist);}
      putCap(capC,'FEAR',455,1226,DEAD,1-0.3*resist);
      putCap(capD,'HOPE',915,1226,DEAD,1-0.3*resist);
      pushA.setAttribute('x1',489);pushA.setAttribute('y1',1150);pushA.setAttribute('x2',489);pushA.setAttribute('y2',(sy+16).toFixed(1));setOp(pushA,(1-resist)*0.8);
      pushB.setAttribute('x1',881);pushB.setAttribute('y1',1150);pushB.setAttribute('x2',881);pushB.setAttribute('y2',(sy+16).toFixed(1));setOp(pushB,(1-resist)*0.8);
      setStop(sy,1); setLock(sy,false,1,4*Math.sin(u*2.4));               // LE CADENAS TIENT
      // le prix touche le trait : une éraflure sort de la jauge, le reste tient debout
      const hit=clamp((u-1.7)/0.5,0,1), out=clamp((u-2.2)/0.8,0,1);
      setPrice(lerp(sy-120,sy-20,eIn(hit))+(hit>=1?7*Math.sin(u*1.9):0),1);
      const kept=GFULL*(1-0.06*out);
      setGauge(kept,0,1);
      scratch.setAttribute('y',(GBASE-GFULL-6-34*out).toFixed(1));scratch.setAttribute('height',(GFULL*0.06).toFixed(1));setOp(scratch,out*0.9);
      putCap(capA,'YOUR POSITION — STILL HERE',GX,GBASE+76,YOU,1);
      putCap(capE,'A SCRATCH',GX,GBASE-GFULL-70-34*out,DEAD,out);
      putCap(capB,'DON’T MOVE IT ONCE IT’S LIVE',CX,640,INK,clamp((u-2.6)/0.7,0,1));
    }

    const RENDER={s1,s2,s3,s4,s5};const SCENEFN=SPEC.map(s=>RENDER[s.id]||s1);
    const clock={t:0};
    function sceneAt(t){let i=0;for(let k=0;k<SC.length;k++){if(t>=SC[k].s-1e-6)i=k;}return Math.min(i,SCENEFN.length-1);}
    function render(){const t=clock.t;const i=sceneAt(t),lf=clamp((t-SC[i].s)/SC[i].d,0,1);SCENEFN[i](lf,t,SC[i].s);}
    const tl=gsap.timeline({paused:true});
    tl.to(clock,{t:TOTAL,duration:TOTAL,ease:'none',onUpdate:render},0);
    tl.to(SVG,{opacity:1,duration:0.001},TOTAL-0.001);
    window.__timelines=window.__timelines||{};window.__timelines['main']=tl;
  </script>
</body>
</html>
