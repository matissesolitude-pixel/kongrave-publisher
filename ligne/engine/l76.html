<!doctype html>
<html lang="en" data-resolution="portrait" data-fps="30">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>:root{--paper:#F2EFE7}*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}#stage{position:absolute;inset:0}svg{position:absolute;inset:0;width:1080px;height:1920px}</style>
</head>
<body>
  <!-- L76 « FOUR VOICES, ONE CHART » — MONTAGE PARALLÈLE. TOFU. Deux traders, même graphe : l'un entend 4 voix, l'autre 1.
       S1 : deux bandes, même bougie ; HAUT 4 flux entrent, BAS 1. S2 : les 4 déposent des verdicts contradictoires sur LA MÊME bougie
       (2 haut, 1 bas, 1 plat), tous défendables ; BAS un verdict unique. S3 : deux jauges — 'clarity' plate, 'ties to break' qui monte
       à chaque flux ajouté. S4 : fin de séance — HAUT zone vide, 4 verdicts non départagés ; BAS une position + une raison écrite,
       vérifiable. S5 : la prise — les 4 flux HIÉRARCHISÉS (un prioritaire désigné, 3 subordonnés), la décision sort + CTA @kongrave_.
       Doctrine : teal = décision/hiérarchie ; gris = bruit/voix contradictoires ; pas de brun ; bas du cadre vide. -->
  <div id="stage" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="1"><svg id="svg" viewBox="0 0 1080 1920"></svg></div>
  <script>
    const TOTAL=__TOTAL__, SC=__SCENES__, SPEC=__SPEC__;
    const NS='http://www.w3.org/2000/svg', SVG=document.getElementById('svg');
    const YOU='#1E5F6E', INK='#20242A', PAPER='#F2EFE7', DEAD='#474D50';
    const CX=540, TY=780, BY=1160;
    function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);(p||SVG).appendChild(e);return e;}
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,f)=>a+(b-a)*clamp(f,0,1),eIn=f=>f*f,eOut=f=>1-(1-f)*(1-f),eInOut=f=>f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
    const backOut=(p,s)=>{s=(s==null?1.9:s);const q=clamp(p,0,1)-1;return 1+(s+1)*q*q*q+s*q*q;};
    const setOp=(el,o)=>el.setAttribute('opacity',clamp(o,0,1).toFixed(3));

    const candleT=mk('rect',{fill:INK,rx:4,opacity:0}), candleB=mk('rect',{fill:INK,rx:4,opacity:0});
    const wickT=mk('line',{stroke:INK,'stroke-width':4,opacity:0}), wickB=mk('line',{stroke:INK,'stroke-width':4,opacity:0});
    // flux (arrows) : 4 top + 1 bottom
    const FL=[]; const FLh=[]; for(let i=0;i<6;i++){FL.push(mk('line',{'stroke-width':5,'stroke-linecap':'round',opacity:0}));FLh.push(mk('polygon',{opacity:0}));}
    // verdicts (petites flèches sur la bougie) : haut 4, bas 1
    const VD=[]; for(let i=0;i<5;i++)VD.push(mk('polygon',{opacity:0}));
    // jauges S3
    const gcO=mk('rect',{fill:'none',stroke:INK,'stroke-width':4,rx:6,opacity:0}), gcF=mk('rect',{fill:YOU,rx:4,opacity:0});
    const gtO=mk('rect',{fill:'none',stroke:INK,'stroke-width':4,rx:6,opacity:0}), gtF=mk('rect',{fill:DEAD,rx:4,opacity:0});
    // S4
    const zone=mk('rect',{fill:'none',stroke:DEAD,'stroke-width':4,'stroke-dasharray':'12 10',rx:8,opacity:0});
    const pos=mk('rect',{fill:YOU,'fill-opacity':0.3,stroke:YOU,'stroke-width':4,rx:6,opacity:0});
    const reason=mk('line',{stroke:YOU,'stroke-width':5,'stroke-linecap':'round',opacity:0});
    const hier=mk('line',{stroke:YOU,'stroke-width':5,'stroke-linecap':'round',opacity:0});

    function candle(el,wk,cx,cy,up,op){el.setAttribute('x',cx-26);el.setAttribute('width',52);el.setAttribute('y',cy-46);el.setAttribute('height',92);setOp(el,op);
      wk.setAttribute('x1',cx);wk.setAttribute('x2',cx);wk.setAttribute('y1',cy-80);wk.setAttribute('y2',cy+80);setOp(wk,op);}
    function arrow(ln,hd,x0,y0,x1,y1,col,op){ln.setAttribute('x1',x0);ln.setAttribute('y1',y0);ln.setAttribute('x2',x1);ln.setAttribute('y2',y1);ln.setAttribute('stroke',col);setOp(ln,op);
      const a=Math.atan2(y1-y0,x1-x0),s=16;const p=[[x1,y1],[x1-s*Math.cos(a-0.4),y1-s*Math.sin(a-0.4)],[x1-s*Math.cos(a+0.4),y1-s*Math.sin(a+0.4)]];hd.setAttribute('points',p.map(q=>q.join(',')).join(' '));hd.setAttribute('fill',col);setOp(hd,op);}
    function vArrow(el,cx,cy,dir,col,op){const s=20;let p; if(dir>0)p=[[cx,cy-s],[cx-14,cy+6],[cx+14,cy+6]]; else if(dir<0)p=[[cx,cy+s],[cx-14,cy-6],[cx+14,cy-6]]; else p=[[cx-16,cy-4],[cx+16,cy-4],[cx+16,cy+4],[cx-16,cy+4]];el.setAttribute('points',p.map(q=>q.join(',')).join(' '));el.setAttribute('fill',col);setOp(el,op);}

    // ── QUESTION (§M15) ──
    const QL=['SAME CHART.','HOW MANY VOICES?'];
    const FS=82,lineH=108,y0v=215,qY=QL.map((s,li)=>y0v+li*lineH);
    const qEls=QL.map((s,li)=>{const e=mk('text',{x:CX,y:qY[li],'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':FS,'letter-spacing':'1',opacity:0});e.textContent=s;return e;});
    const QMY=y0v+2*lineH+90,qMark=mk('text',{x:CX,y:QMY,'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':150,opacity:0});qMark.textContent='?';
    qEls.forEach(e=>{const t=e.textContent,f=Math.min(FS,900/Math.max(1,t.length*0.62));e.setAttribute('font-size',f.toFixed(1));});
    function hideQ(){for(const e of qEls)setOp(e,0);setOp(qMark,0);}

    function caption(sz){return mk('text',{'text-anchor':'middle','font-family':'Helvetica Neue, Arial, sans-serif','font-weight':(sz>44?800:700),'font-size':(sz||38),'data-fs':(sz||38),'letter-spacing':'1.5',opacity:0});}
    const capA=caption(42),capB=caption(46),capC=caption(38),capD=caption(38),capE=caption(46),capF=caption(34);
    function putCap(el,txt,cx,y,color,op){
      const MARGIN=56, MAXW=1080-2*MARGIN;
      if(el.__cap!==txt){ el.__cap=txt; el.textContent=txt;
        const nom=+el.getAttribute('data-fs')||+el.getAttribute('font-size')||38;
        el.setAttribute('font-size',nom); let w=el.getComputedTextLength()||0; if(!w) w=txt.length*nom*0.72;
        if(w>MAXW){ const fs=Math.max(18,nom*MAXW/w); el.setAttribute('font-size',fs.toFixed(1)); w=el.getComputedTextLength()||txt.length*fs*0.72; }
        el.__hw=w/2;
      }
      const x=clamp(+cx, MARGIN+el.__hw, 1080-MARGIN-el.__hw);
      el.setAttribute('x',x.toFixed(1));el.setAttribute('y',y);el.setAttribute('fill',color);setOp(el,op);}
    function hideCaps(){for(const e of [capA,capB,capC,capD,capE,capF])setOp(e,0);}
    function ctaTOFU(u){putCap(capE,'@kongrave_',CX,250,YOU,clamp((u-3.6)/0.8,0,1));putCap(capF,'THE MECHANICS NOBODY EXPLAINS',CX,306,INK,clamp((u-3.9)/0.8,0,1));}
    function hideDyn(){for(const e of [candleT,candleB,wickT,wickB,gcO,gcF,gtO,gtF,zone,pos,reason,hier])setOp(e,0);for(const a of [FL,FLh,VD])for(const e of a)setOp(e,0);hideCaps();}

    const srcXY=[[150,TY-140],[930,TY-140],[150,TY+150],[930,TY+150]]; // origines des 4 flux (haut)

    // ═══ S1 — QUATRE FLUX EN HAUT, UN EN BAS ═══
    function s1(lf,t,s){
      const u=t-s; hideDyn();
      const gf=clamp(1-(lf-0.85)/0.10,0,1);
      for(let k=0;k<qEls.length;k++){const qt=(k===0?0.18:u-(0.1+k*0.30)),ap=clamp(qt/0.18,0,1),sc=0.7+0.3*backOut(ap);setOp(qEls[k],ap*gf);qEls[k].setAttribute('transform',`translate(${(CX*(1-sc)).toFixed(2)} ${(qY[k]*(1-sc)).toFixed(2)}) scale(${sc.toFixed(3)})`);}
      const qm=u-0.95,qap=clamp(qm/0.2,0,1),qsc=0.6+0.4*backOut(qap);setOp(qMark,qap*gf);qMark.setAttribute('transform',`translate(${(CX*(1-qsc)).toFixed(2)} ${(QMY*(1-qsc)).toFixed(2)}) scale(${qsc.toFixed(3)})`);
      const br=8*Math.sin(u*1.3)+4*Math.sin(u*2.4);
      candle(candleT,wickT,CX,TY+br,1,clamp(u/0.3,0,1)*gf);candle(candleB,wickB,CX,BY-br,1,clamp(u/0.3,0,1)*gf);
      const ext=clamp(u/1.2,0,1);
      for(let i=0;i<4;i++){const [sx,sy]=srcXY[i];const ex=lerp(sx,CX+(sx<CX?-46:46),ext),ey=lerp(sy,TY+(sy<TY?-46:46),ext);arrow(FL[i],FLh[i],sx,sy,ex,ey,DEAD,clamp((u-0.2-i*0.08)/0.4,0,1)*gf);}
      arrow(FL[4],FLh[4],150,BY-140,CX-46,BY-30,YOU,clamp((u-0.2)/0.4,0,1)*gf);
      putCap(capC,'FOUR VOICES',300,TY-200,DEAD,clamp((u-0.3)/0.5,0,1)*gf);
      putCap(capD,'ONE VOICE',300,BY+200,YOU,clamp((u-0.3)/0.5,0,1)*gf);
      putCap(capB,'SAME CANDLE — DIFFERENT NOISE',CX,1400,INK,clamp((u-3.0)/0.8,0,1)*gf);
    }

    // ═══ S2 — VERDICTS CONTRADICTOIRES ═══
    function s2(lf,t,s){
      const u=t-s; hideQ(); hideDyn();
      const br=8*Math.sin(u*1.3)+4*Math.sin(u*2.4);
      candle(candleT,wickT,CX,TY+br,1,1);candle(candleB,wickB,CX,BY-br,1,1);
      // 4 verdicts autour de la bougie haute : up, up, down, flat
      const dirs=[1,1,-1,0], vx=[CX-90,CX+90,CX-90,CX+90], vy=[TY-70,TY-70,TY+70,TY+70];
      const n=Math.floor(clamp(u/1.2,0,1)*4);
      for(let i=0;i<4;i++){vArrow(VD[i], vx[i], vy[i]+br+3*Math.sin(u*1.6+i), dirs[i], dirs[i]>0?YOU:DEAD, i<n?1:0);}
      // 1 verdict en bas
      vArrow(VD[4], CX+90, BY-70-br+3*Math.sin(u*1.5), 1, YOU, clamp(u/0.4,0,1));
      putCap(capC,'TWO UP · ONE DOWN · ONE FLAT',CX,TY+180,DEAD,clamp((u-1.4)/0.6,0,1));
      putCap(capB,'ALL REASONABLE — ALL CONTRADICTING',CX,540,INK,clamp((u-2.8)/0.7,0,1));
    }

    // ═══ S3 — CLARTÉ PLATE, ÉGALITÉS QUI MONTENT ═══
    function s3(lf,t,s){
      const u=t-s; hideQ(); hideDyn();
      candle(candleT,wickT,340,TY,1,0.9);candle(candleB,wickB,340,BY,1,0.9);
      const add=clamp(u/2.4,0,1);
      // jauge clarté (plate) + jauge égalités (monte)
      const gy=700,gh=260;
      gcO.setAttribute('x',560);gcO.setAttribute('y',gy);gcO.setAttribute('width',80);gcO.setAttribute('height',gh);setOp(gcO,clamp(u/0.4,0,1));
      const cf=0.4;gcF.setAttribute('x',565);gcF.setAttribute('y',(gy+gh-5-cf*(gh-10)).toFixed(1));gcF.setAttribute('width',70);gcF.setAttribute('height',(cf*(gh-10)).toFixed(1));setOp(gcF,clamp(u/0.4,0,1));
      gtO.setAttribute('x',880);gtO.setAttribute('y',gy);gtO.setAttribute('width',80);gtO.setAttribute('height',gh);setOp(gtO,clamp(u/0.4,0,1));
      const tf=lerp(0.2,0.95,add)+0.01*Math.sin(u*3);gtF.setAttribute('x',885);gtF.setAttribute('y',(gy+gh-5-tf*(gh-10)).toFixed(1));gtF.setAttribute('width',70);gtF.setAttribute('height',(tf*(gh-10)).toFixed(1));setOp(gtF,clamp(u/0.4,0,1));
      putCap(capC,'CLARITY',600,gy+gh+46,YOU,clamp((u-0.4)/0.5,0,1));
      putCap(capD,'TIES TO BREAK',900,gy+gh+46,DEAD,clamp((u-0.4)/0.5,0,1));
      putCap(capB,'MORE SOURCES — MORE TIES, NO RULE',CX,1240,INK,clamp((u-2.8)/0.7,0,1));
    }

    // ═══ S4 — SANS TRADE / AVEC TRADE ET RAISON ═══
    function s4(lf,t,s){
      const u=t-s; hideQ(); hideDyn();
      // HAUT : zone vide, 4 verdicts non départagés
      candle(candleT,wickT,CX,TY,1,0.6);
      const dirs=[1,1,-1,0], vx=[CX-90,CX+90,CX-90,CX+90], vy=[TY-70,TY-70,TY+70,TY+70];
      for(let i=0;i<4;i++)vArrow(VD[i], vx[i], vy[i]+3*Math.sin(u*1.6+i), dirs[i], dirs[i]>0?YOU:DEAD, 0.7);
      zone.setAttribute('x',CX-90);zone.setAttribute('y',TY+120);zone.setAttribute('width',180);zone.setAttribute('height',110);setOp(zone,clamp(u/0.4,0,1));
      putCap(capC,'NO TRADE — NO REASON',CX,TY+290,DEAD,clamp((u-0.6)/0.5,0,1));
      // BAS : une position + raison écrite
      pos.setAttribute('x',CX-90);pos.setAttribute('y',(BY-55+6*Math.sin(u*1.4)).toFixed(1));pos.setAttribute('width',180);pos.setAttribute('height',110);setOp(pos,clamp((u-1.4)/0.5,0,1));
      reason.setAttribute('x1',CX-120);reason.setAttribute('x2',(CX-120+240*clamp((u-1.8)/0.6,0,1)).toFixed(1));reason.setAttribute('y1',BY+90);reason.setAttribute('y2',BY+90);setOp(reason,clamp((u-1.8)/0.4,0,1));
      putCap(capD,'A TRADE — AND A REASON YOU CAN CHECK',CX,BY+150,YOU,clamp((u-2.2)/0.6,0,1));
      putCap(capB,'END OF SESSION',CX,540,INK,clamp((u-3.0)/0.7,0,1));
    }

    // ═══ S5 — LA HIÉRARCHIE + CTA ═══
    function s5(lf,t,s){
      const u=t-s; hideQ(); hideDyn();
      candle(candleT,wickT,CX,900,1,0.9);
      // les 4 flux, un seul prioritaire (teal), 3 subordonnés (gris)
      const hi=clamp((u-0.6)/0.8,0,1);
      for(let i=0;i<4;i++){const [sx,sy]=srcXY[i];const prio=(i===1);const col=prio?YOU:DEAD;
        const ex=CX+(sx<CX?-46:46),ey=900+(sy<TY?-46:46);
        arrow(FL[i],FLh[i],sx,sy-(TY-900),ex,ey,col,prio?1:(1-hi*0.6));}
      // le trait qui désigne le prioritaire
      hier.setAttribute('x1',CX+46);hier.setAttribute('x2',900);hier.setAttribute('y1',854);hier.setAttribute('y2',760);setOp(hier,hi);
      putCap(capC,'ONE PRIORITY — THREE SUBORDINATE',CX,700,YOU,clamp((u-0.4)/0.5,0,1));
      // la décision sort
      pos.setAttribute('x',CX-90);pos.setAttribute('y',(1080-lerp(0,120,eOut(clamp((u-1.4)/1.2,0,1)))+6*Math.sin(u*1.4)).toFixed(1));pos.setAttribute('width',180);pos.setAttribute('height',lerp(0,120,eOut(clamp((u-1.4)/1.2,0,1))).toFixed(1));setOp(pos,clamp((u-1.4)/0.5,0,1));
      putCap(capD,'CONFUSION IS A LACK OF HIERARCHY',CX,1300,INK,clamp((u-2.2)/0.6,0,1));
      ctaTOFU(u);
    }

    const RENDER={s1,s2,s3,s4,s5};const SCENEFN=SPEC.map(s=>RENDER[s.id]||s1);
    const clock={t:0};
    function sceneAt(t){let i=0;for(let k=0;k<SC.length;k++){if(t>=SC[k].s-1e-6)i=k;}return Math.min(i,SCENEFN.length-1);}
    function render(){const t=clock.t;const i=sceneAt(t),lf=clamp((t-SC[i].s)/SC[i].d,0,1);SCENEFN[i](lf,t,SC[i].s);}
    const tl=gsap.timeline({paused:true});
    tl.to(clock,{t:TOTAL,duration:TOTAL,ease:'none',onUpdate:render},0);
    tl.to(SVG,{opacity:1,duration:0.001},TOTAL-0.001);
    window.__timelines=window.__timelines||{};window.__timelines['main']=tl;
  </script>
</body>
</html>
