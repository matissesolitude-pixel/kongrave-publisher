<!doctype html>
<html lang="en" data-resolution="portrait" data-fps="30">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>:root{--paper:#F2EFE7}*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}#stage{position:absolute;inset:0}svg{position:absolute;inset:0;width:1080px;height:1920px}</style>
</head>
<body>
  <!-- L29 « THE AVERAGE THAT SINKS YOU » — TOI = la JAUGE teal (ta taille de position). Le PRIX MOYEN = un trait teal pointillé qui
       DESCEND quand tu ajoutes plus bas. Le PRIX = un point d'encre qui coule, toujours sous ton prix moyen. S1 : émotion frame 0 =
       levier RECONNAISSANCE/TENSION — dès t=0 ta position est DÉJÀ grosse, ton prix moyen a DÉJÀ descendu, et le prix coule dessous
       dans une bande grise de perte qui s'agrandit ; « ça semble malin » et pourtant tu enfonces. S2 : le cas gagnant honnête — le prix
       REMONTE, franchit ton prix moyen amélioré, la jauge se dé-délave (revient teal plein) : parfois ça marche. S3 : les ciseaux — TA
       TAILLE monte, TON IDÉE (2e barre) tombe et se délave ; elles se croisent ; la tranche de perte qui pèle sur la grosse jauge est
       plus ÉPAISSE qu'au début : chaque pas coûte plus. S4 : LA scène — l'escalier d'ajouts qui accélère, la jauge devient ÉNORME (une
       coche « RATIONAL » à chaque add), le prix ne s'arrête pas, la jauge géante S'EFFONDRE ENTIÈREMENT en gris — pas une perte, TOUT —
       à côté, minuscule, l'éraflure qu'aurait coûté un stop au 1er prix. S5 : décharge — diptyque BUILDING (niveaux d'ajout décidés à
       l'avance + une ligne d'arrêt ferme) vs DIGGING (ajouts improvisés sans fin, aucune ligne). Doctrine : aucun chiffre ; gris =
       perte/délavage (jamais de rouge) ; pas de brun ; TOI jamais une figure ; bas du cadre vide. -->
  <div id="stage" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="1"><svg id="svg" viewBox="0 0 1080 1920"></svg></div>
  <script>
    const TOTAL=__TOTAL__, SC=__SCENES__, SPEC=__SPEC__;
    const NS='http://www.w3.org/2000/svg', SVG=document.getElementById('svg');
    /*INCLUDE:narrator*/
    const YOU='#1E5F6E', INK='#20242A', PAPER='#F2EFE7', DEAD='#474D50';
    const CX=540;
    function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);(p||SVG).appendChild(e);return e;}
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,f)=>a+(b-a)*clamp(f,0,1),eIn=f=>f*f,eOut=f=>1-(1-f)*(1-f),eInOut=f=>f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
    const backOut=(p,s)=>{s=(s==null?1.9:s);const q=clamp(p,0,1)-1;return 1+(s+1)*q*q*q+s*q*q;};
    // onde triangulaire : vitesse CONSTANTE (jamais nulle sur une frame entière) — garantit la progression pendant les longues tenues.
    const tri=(u,period,amp)=>{const x=u/period-Math.floor(u/period);return amp*(x<0.5?(4*x-1):(3-4*x));};
    const setOp=(el,o)=>el.setAttribute('opacity',clamp(o,0,1).toFixed(3));
    const hx=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
    const mix=(a,b,f)=>{const A=hx(a),B=hx(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],f))).join(',')})`;};

    // ── TA POSITION (jauge teal, à gauche) — croît vers le HAUT ──
    const GX=250, GW=150, GBASE=1360;
    const gaugeBase=mk('line',{x1:GX-90,y1:GBASE+8,x2:GX+90,y2:GBASE+8,stroke:INK,'stroke-width':6,opacity:0});
    const gauge=mk('rect',{x:GX-GW/2,width:GW,rx:6,fill:YOU,opacity:0});
    function setGauge(h,wash,op){gauge.setAttribute('y',(GBASE-Math.max(2,h)).toFixed(1));gauge.setAttribute('height',Math.max(2,h).toFixed(1));
      gauge.setAttribute('fill',mix(YOU,DEAD,wash||0));setOp(gauge,op);setOp(gaugeBase,op);}
    // la tranche de perte qui pèle sur le haut de la jauge (S3)
    const slice=mk('rect',{x:GX-GW/2,width:GW,rx:6,fill:DEAD,opacity:0});
    // le tas gris qui reste après l'effondrement (S4)
    const heap=mk('rect',{rx:6,fill:DEAD,opacity:0});
    // l'éraflure minuscule (ce qu'aurait coûté un stop au 1er prix) (S4)
    const scratch=mk('rect',{rx:3,fill:DEAD,opacity:0});

    // ── TON IDÉE (2e barre, S3) — tombe et se délave ──
    const IX=478, IW=118;
    const ideaBar=mk('rect',{x:IX-IW/2,width:IW,rx:6,fill:YOU,opacity:0});
    function setIdea(h,wash,op){ideaBar.setAttribute('y',(GBASE-Math.max(2,h)).toFixed(1));ideaBar.setAttribute('height',Math.max(2,h).toFixed(1));
      ideaBar.setAttribute('fill',mix(YOU,DEAD,wash||0));setOp(ideaBar,op);}

    // ── TON PRIX MOYEN (trait teal pointillé) + LA BANDE DE PERTE (grise) ──
    const AX0=430, AX1=930;
    const avg=mk('line',{stroke:YOU,'stroke-width':6,'stroke-dasharray':'18 10',opacity:0});
    function setAvg(y,op,off){avg.setAttribute('x1',AX0);avg.setAttribute('x2',AX1);avg.setAttribute('y1',y.toFixed(1));avg.setAttribute('y2',y.toFixed(1));if(off!=null)avg.setAttribute('stroke-dashoffset',off.toFixed(0));setOp(avg,op);}
    const lossBand=mk('rect',{fill:DEAD,'fill-opacity':0.20,rx:5,opacity:0});
    function setLoss(y0,y1,op){lossBand.setAttribute('x',AX0);lossBand.setAttribute('width',AX1-AX0);
      lossBand.setAttribute('y',Math.min(y0,y1).toFixed(1));lossBand.setAttribute('height',Math.max(1,Math.abs(y1-y0)).toFixed(1));setOp(lossBand,op);}

    // ── LE PRIX (point d'encre qui coule) + sa comète ──
    const price=mk('circle',{r:18,fill:INK,opacity:0});
    const trail=mk('polyline',{fill:'none',stroke:INK,'stroke-width':5,'stroke-linejoin':'round','stroke-linecap':'round',opacity:0});
    function setPrice(x,y,op){price.setAttribute('cx',x.toFixed(1));price.setAttribute('cy',y.toFixed(1));setOp(price,op);}
    function priceAt(fn,u){const pts=[];for(let k=7;k>=0;k--)pts.push(fn(Math.max(0,u-k*0.09)));
      trail.setAttribute('points',pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '));setOp(trail,0.5);
      const last=fn(u);setPrice(last[0],last[1],1);return last;}

    // ── ESCALIER D'AJOUTS (S4) + NIVEAUX PRÉVUS / LIGNE D'ARRÊT (S5) : pools ──
    const LINES=[]; for(let i=0;i<9;i++)LINES.push(mk('line',{stroke:YOU,'stroke-width':5,'stroke-dasharray':'16 10',opacity:0}));
    const BLOCKS=[]; for(let i=0;i<16;i++)BLOCKS.push(mk('rect',{rx:5,opacity:0}));
    let lk=0, bk=0;
    function resetPools(){lk=0;bk=0;}
    function ln(x1,x2,y,op,off){const e=LINES[lk++];if(!e)return;e.setAttribute('x1',x1);e.setAttribute('x2',x2);
      e.setAttribute('y1',y.toFixed(1));e.setAttribute('y2',y.toFixed(1));if(off!=null)e.setAttribute('stroke-dashoffset',off.toFixed(0));setOp(e,op);}
    function blk(xc,y,w,h,wash,op){const e=BLOCKS[bk++];if(!e)return;e.setAttribute('x',(xc-w/2).toFixed(1));e.setAttribute('y',y.toFixed(1));
      e.setAttribute('width',w.toFixed(1));e.setAttribute('height',Math.max(2,h).toFixed(1));e.setAttribute('fill',mix(YOU,DEAD,wash||0));setOp(e,op);}
    function flushPools(){for(let i=lk;i<LINES.length;i++)setOp(LINES[i],0);for(let i=bk;i<BLOCKS.length;i++)setOp(BLOCKS[i],0);}

    // ── LE STOP FERME (trait d'encre, S5) ──
    const stopL=mk('line',{stroke:INK,'stroke-width':9,opacity:0});

    // ── QUESTION (§M15) — 1re ligne pleine dès la frame 0 ──
    const QLINES=['WHY DO ACCOUNTS DIE','FROM A BETTER AVERAGE'];
    const FS=66,lineH=92,y0=230,qY=QLINES.map((s,li)=>y0+li*lineH);
    const qEls=QLINES.map((s,li)=>{const e=mk('text',{x:CX,y:qY[li],'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':FS,'letter-spacing':'1',opacity:0});e.textContent=s;return e;});
    const QMY=y0+2*lineH+96,qMark=mk('text',{x:CX,y:QMY,'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':170,opacity:0});qMark.textContent='?';
    // AUTO-AJUSTEMENT de la question : une ligne trop longue est réduite pour tenir dans le cadre.
    qEls.forEach(e=>{const t=e.textContent,f=Math.min(FS,930/Math.max(1,t.length*0.66));e.setAttribute('font-size',f.toFixed(1));});
    function hideQ(){for(const e of qEls)setOp(e,0);setOp(qMark,0);}

    // ── ÉTIQUETTES (§M18) ──
    function caption(sz){return mk('text',{'text-anchor':'middle','font-family':'Helvetica Neue, Arial, sans-serif','font-weight':(sz>44?800:700),'font-size':(sz||38),'data-fs':(sz||38),'letter-spacing':'1.5',opacity:0});}
    const capA=caption(40),capB=caption(44),capC=caption(36),capD=caption(36),capE=caption(36),capF=caption(44);
    function putCap(el,txt,cx,y,color,op){
      // MESURE réelle (getComputedTextLength inclut le letter-spacing, ignoré par l'ancienne
      // estimation ×0.66 — cause du débordement live). Réduit la police pour tenir dans la zone
      // sûre, puis borne le centre par la demi-largeur MESURÉE : plus de coupe au bord.
      const MARGIN=70, MAXW=1080-2*MARGIN;
      if(el.__cap!==txt){ el.__cap=txt; el.textContent=txt;
        const nom=+el.getAttribute('data-fs')||+el.getAttribute('font-size')||38;
        el.setAttribute('font-size',nom);
        let w=el.getComputedTextLength()||0;
        if(!w) w=txt.length*nom*0.72;
        if(w>MAXW){ const fs=Math.max(18,nom*MAXW/w); el.setAttribute('font-size',fs.toFixed(1)); w=el.getComputedTextLength()||txt.length*fs*0.72; }
        el.__hw=w/2;
      }
      const x=clamp(+cx, MARGIN+el.__hw, 1080-MARGIN-el.__hw);
      el.setAttribute('x',x.toFixed(1));el.setAttribute('y',y.toFixed(1));el.setAttribute('fill',color);setOp(el,op);}
    function hideCaps(){for(const e of [capA,capB,capC,capD,capE,capF])setOp(e,0);}

    function hideExtras(){setOp(slice,0);setOp(heap,0);setOp(scratch,0);setOp(ideaBar,0);setOp(stopL,0);}

    // ═══ S1 — DÉJÀ SOUS L'EAU : position grosse, prix moyen descendu, le prix qui coule dessous ═══
    // Verbe visuel : le naufrage (le prix coule sous un prix moyen déjà « amélioré », la perte s'ouvre).
    function s1(lf,t,s){
      const u=t-s; hideCaps(); resetPools(); hideExtras();
      const gf=clamp(1-(lf-0.82)/0.10,0,1);
      for(let k=0;k<qEls.length;k++){const qt=(k===0?0.18:u-(0.1+k*0.30)),ap=clamp(qt/0.18,0,1),sc=0.7+0.3*backOut(ap);setOp(qEls[k],ap*gf);qEls[k].setAttribute('transform',`translate(${(CX*(1-sc)).toFixed(2)} ${(qY[k]*(1-sc)).toFixed(2)}) scale(${sc.toFixed(3)})`);}
      const qm=u-1.0,qap=clamp(qm/0.2,0,1),qsc=0.6+0.4*backOut(qap);setOp(qMark,qap*gf);qMark.setAttribute('transform',`translate(${(CX*(1-qsc)).toFixed(2)} ${(QMY*(1-qsc)).toFixed(2)}) scale(${qsc.toFixed(3)})`);
      // ── ÉMOTION FRAME 0 : rien à construire — la position est DÉJÀ grosse, le prix moyen DÉJÀ descendu,
      //    et le prix coule DÉJÀ dessous. La tension (« ça semble malin, et pourtant j'enfonce ») est entière à t=0.
      const gh=372+7*Math.sin(u*1.25)+3*Math.sin(u*2.1);
      setGauge(gh,0,1); putCap(capA,'YOUR POSITION',GX,GBASE+72,YOU,1);
      const avgY=966+5*Math.sin(u*1.05)+3*Math.sin(u*1.75);
      setAvg(avgY,1,-u*16); putCap(capC,'YOUR AVERAGE',AX1-140,avgY-24,YOU,1);
      const pf=uu=>[690+34*Math.sin(uu*0.85)+13*Math.sin(uu*1.55), 1078+118*clamp(uu/8,0,1)+12*Math.sin(uu*1.7)+6*Math.sin(uu*2.9)];
      const last=priceAt(pf,u);
      setLoss(avgY,last[1],0.9);                       // la zone de perte s'ouvre sous le prix moyen et grandit
      putCap(capD,'PRICE',last[0]+72,last[1]+8,INK,clamp((u-0.6)/0.5,0,1)*gf);
      putCap(capB,'BIGGER POSITION, LOWER AVERAGE — IT FEELS SMART',CX,668,INK,clamp((u-2.6)/0.7,0,1)*gf);
      flushPools();
    }

    // ═══ S2 — LE CAS GAGNANT HONNÊTE : le prix remonte, franchit le prix moyen, la perte devient gain ═══
    // Verbe visuel : la remontée (le prix grimpe À TRAVERS le prix moyen, la jauge se dé-délave).
    function s2(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); resetPools(); hideExtras();
      const avgY=966;
      setAvg(avgY,1,-u*16); putCap(capC,'YOUR AVERAGE — CHEAPER',AX1-190,avgY-24,YOU,1);
      const pf=uu=>{const c=eInOut(clamp((uu-0.6)/2.8,0,1));return [690+30*Math.sin(uu*0.8)+12*Math.sin(uu*1.5), lerp(1178,avgY-72,c)+9*Math.sin(uu*1.7)+5*Math.sin(uu*2.9)];};
      const last=priceAt(pf,u);
      const won=clamp((avgY-last[1])/64,0,1);            // au-dessus du prix moyen = gain
      setGauge(372+6*Math.sin(u*1.3)+3*Math.sin(u*2.05), 0.30*(1-won), 1);   // se dé-délave en gagnant
      putCap(capA, won>0.5?'YOUR POSITION — A WIN':'YOUR POSITION',GX,GBASE+72,YOU,1);
      setLoss(avgY, Math.max(last[1],avgY-1), 0.9*(1-won));
      putCap(capD,'SAME THING, CHEAPER',AX0+180,avgY+68,YOU,clamp((u-1.2)/0.6,0,1));
      putCap(capB,'SOMETIMES IT WORKS — PRICE COMES BACK',CX,660,INK,clamp((u-3.2)/0.7,0,1));
      flushPools();
    }

    // ═══ S3 — LES CISEAUX : la taille monte, l'idée tombe — et la perte pèle plus épais ═══
    // Verbe visuel : les ciseaux inversés (deux barres se croisent : taille max, idée min).
    function s3(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); resetPools(); hideExtras(); setOp(avg,0);
      const rise=eInOut(clamp(u/2.6,0,1));
      const gh=360+156*rise+6*Math.sin(u*1.2)+3*Math.sin(u*2.0);
      setGauge(gh,0,1); putCap(capA,'YOUR SIZE',GX,GBASE+72,YOU,1);
      const idh=lerp(430,150,rise)+6*Math.sin(u*1.35)+3*Math.sin(u*2.25);
      setIdea(idh,rise,1); putCap(capC,'YOUR IDEA',IX,GBASE+72,mix(YOU,DEAD,rise),1);
      // la tranche de perte pèle sur le haut de la jauge — un pas de plus, plus épais qu'au début
      const step=clamp((u-2.4)/0.6,0,1), sliceH=24+78*step+4*Math.sin(u*2.3);
      slice.setAttribute('x',(GX-GW/2).toFixed(1));slice.setAttribute('width',GW);
      slice.setAttribute('y',(GBASE-gh).toFixed(1));slice.setAttribute('height',Math.max(2,sliceH).toFixed(1));setOp(slice,0.85);
      // le prix, à droite, fait son pas de plus contre toi
      const pf=uu=>[812+22*Math.sin(uu*0.9)+9*Math.sin(uu*1.65), 972+164*eInOut(clamp(uu/3,0,1))+11*Math.sin(uu*1.8)+6*Math.sin(uu*2.7)];
      priceAt(pf,u); putCap(capD,'PRICE',812,946,INK,clamp((u-0.5)/0.5,0,1));
      putCap(capE,'EVERY STEP COSTS MORE',CX,GBASE-gh-46-10*Math.sin(u*2.2),DEAD,clamp((u-2.6)/0.6,0,1));
      putCap(capB,'SIZE UP WHILE THE IDEA BREAKS DOWN',CX,660,INK,clamp((u-1.4)/0.7,0,1));
      flushPools();
    }

    // ═══ S4 — L'ESCALIER SANS FIN → L'EFFONDREMENT : pas de point d'arrêt, ça prend TOUT ═══
    // Verbe visuel : l'accumulation qui accélère puis l'effondrement total (la jauge géante vidée d'un coup).
    function s4(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); resetPools(); hideExtras(); setOp(avg,0);
      const ADDS=[0.15,0.70,1.10,1.45,1.72,1.94];        // cadence qui presse (lent → pressé)
      let n=1; for(const a of ADDS) if(u>a) n++;
      const targetH=Math.min(772, 292+n*82);
      const gh=targetH+7*Math.sin(u*1.4)+3*Math.sin(u*2.3);
      const dead=clamp((u-2.95)/1.0,0,1);                 // la fois de trop : tout part
      const shown=gh*(1-0.95*dead)+8*dead;
      setGauge(shown, 0.34*clamp(u/2.4,0,1)+0.6*dead, 1);
      putCap(capA, dead>0.6?'YOUR POSITION — GONE':'YOUR POSITION',GX,GBASE+72,dead>0.6?DEAD:YOU,1);
      // l'escalier des ajouts (marches teal larges qui descendent) — il RESTE en fantôme après l'effondrement
      // (tous ces ajouts « rationnels » → rien), et il dérive verticalement (vie continue garantie : ligne large × déplacement).
      const nt=Math.min(n,7);
      for(let i=0;i<nt;i++){const ty=772+i*66+tri(u,1.9,7)+3*Math.sin(u*1.3+i); ln(AX0, AX0+168, ty, (0.8-0.5*dead), -u*13-(i%2?8:0));}
      // le tas gris qui reste après l'effondrement — il tremble (vie continue, deux harmoniques)
      const hh=14+6*Math.sin(u*1.15)+3*Math.sin(u*2.05);
      heap.setAttribute('x',(GX-GW/2).toFixed(1));heap.setAttribute('width',GW);
      heap.setAttribute('y',(GBASE-hh-4*Math.sin(u*1.7)).toFixed(1));heap.setAttribute('height',Math.max(2,hh).toFixed(1));setOp(heap,dead*0.9);
      // l'éraflure : ce qu'aurait coûté un stop au 1er prix — minuscule, à côté
      scratch.setAttribute('x',(GX+128+6*Math.sin(u*2.3)).toFixed(1));scratch.setAttribute('y',(1338+4*Math.sin(u*3.1)).toFixed(1));
      scratch.setAttribute('width',58);scratch.setAttribute('height',13);setOp(scratch,clamp((u-3.3)/0.6,0,1));
      putCap(capE,'A STOP HERE = A SCRATCH',GX+320,1352,DEAD,clamp((u-3.5)/0.6,0,1));
      // le prix ne s'arrête pas de couler : balayage horizontal à VITESSE CONSTANTE (triangle) → jamais figé de tout le hold
      const pf=uu=>[818+tri(uu,2.4,40)+9*Math.sin(uu*1.7), 640+150*clamp(uu/2.6,0,1)+13*Math.sin(uu*1.45)+6*Math.sin(uu*2.35)];
      priceAt(pf,u);
      putCap(capB, dead>0.6?'IT DOESN’T TAKE A LOSS — IT TAKES EVERYTHING':'RATIONAL — ONE MORE ADD',CX,656,dead>0.6?INK:DEAD,clamp((u-0.6)/0.5,0,1));
      flushPools();
    }

    // ═══ S5 — DÉCHARGE : BUILDING (niveaux + ligne d'arrêt décidés avant) vs DIGGING (sans fin, sans arrêt) ═══
    // Verbe visuel : le diptyque (deux versions côte à côte — l'une a une ligne, l'autre creuse).
    function s5(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); resetPools(); hideExtras(); setOp(avg,0);setOp(price,0);setOp(trail,0);setOp(gauge,0);setOp(gaugeBase,0);setOp(lossBand,0);
      const br=(w1,w2,ph)=>5*Math.sin(u*w1+ph)+2.6*Math.sin(u*w2+ph);    // micro-vie continue (deux harmoniques) jusqu'au bout
      const BW=150, BH=56, G=10, TOP=756;
      // ── GAUCHE : BUILDING — blocs décidés + niveaux prévus + LIGNE D'ARRÊT ferme ──
      const LX=282;
      for(let i=0;i<3;i++) blk(LX, TOP+i*(BH+G)+br(1.2,2.0,i), BW, BH, 0, 1);
      for(let i=0;i<3;i++) ln(LX-96, LX+96, TOP+3*(BH+G)+i*64+br(1.0,1.8,i+3), 0.72, -u*14);
      const stopY=TOP+3*(BH+G)+3*64+34;
      stopL.setAttribute('x1',LX-112);stopL.setAttribute('x2',LX+112);stopL.setAttribute('y1',(stopY+br(1.3,2.1,9)).toFixed(1));stopL.setAttribute('y2',(stopY+br(1.3,2.1,9)).toFixed(1));setOp(stopL,1);
      putCap(capA,'POSITION BUILDING',LX,TOP-42,YOU,1);
      putCap(capC,'LEVELS DECIDED BEFORE',LX,stopY+52,YOU,clamp((u-1.0)/0.6,0,1));
      putCap(capE,'A LINE TO STOP',LX,stopY+100,INK,clamp((u-1.4)/0.6,0,1));
      // ── DROITE : DIGGING — ajouts improvisés sans fin, aucune ligne d'arrêt, ça creuse en gris ──
      const RX=800;
      const nd=Math.min(6, 4+Math.floor(clamp(u/1.1,0,2)));
      for(let i=0;i<nd;i++) blk(RX, TOP+i*(BH+G)+br(1.35,2.15,i), BW-8, BH, Math.min(1,i*0.18), 1);
      // « one more add » : un bloc gris qui NE se pose jamais — glisse à vitesse constante (triangle) sous la pile qui creuse.
      const restY=TOP+nd*(BH+G)+tri(u,2.2,26)+3*Math.sin(u*1.7);
      blk(RX, restY, BW-8, BH-6, 1, 0.6);
      putCap(capB,'DIGGING',RX,TOP-42,DEAD,1);
      putCap(capD,'NO LINE — ONE MORE ADD',RX,restY+BH+14,DEAD,clamp((u-1.0)/0.6,0,1));
      putCap(capF,'HAVE A LINE WHERE YOU STOP',CX,662,INK,clamp((u-2.4)/0.7,0,1));
      flushPools();
    }


    // ── MR DOLLAR : il APPARAÎT POUR PARLER (pas de gag). Ses venues sont des évènements. ──
    const NBEATS={2:['point',880,1420],4:['idle',200,1410]};
    function narrate(i,lf,t,s){
      const u=t-s;
      if(i===0){
        // il entre en S1, il parle, il désigne le "?" — zone libre calculée, jamais devinée
        MrD.enter(u,{t:t, routine:'designe', lookAt:CX,
                     rest:{x:180,y:1425,h:206}, op:clamp(1-(lf-0.86)/0.09,0,1)});
        return;
      }
      const b=NBEATS[i];
      if(!b){ MrD.hide(); return; }                      // absent des autres scènes : ses venues sont des évènements
      const inn=clamp((u-1.4)/0.8,0,1), out=clamp((u-6.8)/1.1,0,1);
      if(out>=1||inn<=0){ MrD.hide(); return; }
      const jit=4*Math.sin(u*1.15)+2*Math.sin(u*2.25);
      // SÉQUENCEUR : il change d'attitude pendant l'apparition (jamais 5 s de pointage figé)
      const pose=MrD.seq(u-1.4, b[0]==='point'?'designe':'attend');
      if(pose==='point') MrD.pointAt('point',t,b[1]+jit,b[2],200,inn*(1-out),CX);
      else MrD.say(pose,t,b[1]+jit,b[2],196,inn*(1-out),b[1]>CX);
    }

    const RENDER={s1,s2,s3,s4,s5};const SCENEFN=SPEC.map(s=>RENDER[s.id]||s1);
    const clock={t:0};
    function sceneAt(t){let i=0;for(let k=0;k<SC.length;k++){if(t>=SC[k].s-1e-6)i=k;}return Math.min(i,SCENEFN.length-1);}
    function render(){const t=clock.t;const i=sceneAt(t),lf=clamp((t-SC[i].s)/SC[i].d,0,1);SCENEFN[i](lf,t,SC[i].s);narrate(i,lf,t,SC[i].s);}
    const tl=gsap.timeline({paused:true});
    tl.to(clock,{t:TOTAL,duration:TOTAL,ease:'none',onUpdate:render},0);
    tl.to(SVG,{opacity:1,duration:0.001},TOTAL-0.001);
    window.__timelines=window.__timelines||{};window.__timelines['main']=tl;
  </script>
