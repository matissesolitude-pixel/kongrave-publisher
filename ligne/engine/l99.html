<!doctype html>
<html lang="en" data-resolution="portrait" data-fps="30">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>:root{--paper:#F2EFE7}*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}#stage{position:absolute;inset:0}svg{position:absolute;inset:0;width:1080px;height:1920px}</style>
</head>
<body>
  <!-- L99 « THE LEVEL THEY BOTH DREW » — MÉTAPHORE SEULE (pas de fusil). S1 : émotion frame 0 = levier CURIOSITÉ — un
       niveau horizontal net coupe le cadre, une bougie monte dessous au ras du trait (tension), et DEUX figures fil-de-fer
       l'encadrent, identiques ; l'œil cherche la différence. La figure gauche accroche un JETON teal sur le trait puis sort ;
       la droite reste, plantée, à regarder. S2 : le trait tient, une trajectoire monte, le jeton teal MONTE avec le prix et
       sort par le haut — la figure droite ne bouge pas. S3 : la figure droite déroule un CALQUE qui se superpose EXACTEMENT
       à la trajectoire (juste au trait près), puis on découvre sous le niveau un SOCKET vide : aucun jeton n'y est jamais
       tombé. S4 : escalade froide — trois niveaux, trois calques justes, trois sockets vides ; les calques se délavent
       teal→gris (le juste ne se conserve pas). S5 : diptyque — deux traits identiques, gauche avec jeton posé (teal plein),
       droite sans (reste encre) ; une seule variable, le jeton posé AVANT ; CTA abonnement FOLLOW KONGRAVE tenu jusqu'au bout.
       Doctrine : aucun chiffre ; teal = le jeton posé (ce qui paie) ; gris = ce qui se perd ; pas de brun ; bas du cadre vide. -->
  <div id="stage" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="1"><svg id="svg" viewBox="0 0 1080 1920"></svg></div>
  <script>
    const TOTAL=__TOTAL__, SC=__SCENES__, SPEC=__SPEC__;
    const NS='http://www.w3.org/2000/svg', SVG=document.getElementById('svg');
    const YOU='#1E5F6E', INK='#20242A', PAPER='#F2EFE7', DEAD='#474D50';
    const CX=540;
    function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);(p||SVG).appendChild(e);return e;}
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,f)=>a+(b-a)*clamp(f,0,1),eIn=f=>f*f,eOut=f=>1-(1-f)*(1-f),eInOut=f=>f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
    const backOut=(p,s)=>{s=(s==null?1.9:s);const q=clamp(p,0,1)-1;return 1+(s+1)*q*q*q+s*q*q;};
    const setOp=(el,o)=>el.setAttribute('opacity',clamp(o,0,1).toFixed(3));
    const lerpColor=(f)=>{ // teal → gris (délavage d'une valeur perdue), f de 0 (teal) à 1 (gris)
      const a=[0x1E,0x5F,0x6E],b=[0x47,0x4D,0x50],c=a.map((v,i)=>Math.round(lerp(v,b[i],f)));
      return `rgb(${c[0]},${c[1]},${c[2]})`;};

    // ── LES NIVEAUX (traits horizontaux, encre) ──
    const LEVELS=[]; for(let i=0;i<6;i++)LEVELS.push(mk('line',{stroke:INK,'stroke-width':7,'stroke-linecap':'round',opacity:0}));
    // ── LES CALQUES / TRAJECTOIRES (tracés) ──
    const TRACES=[]; for(let i=0;i<4;i++)TRACES.push(mk('polyline',{fill:'none',stroke:INK,'stroke-width':6,'stroke-linejoin':'round','stroke-linecap':'round',opacity:0}));
    const REALPATH=mk('polyline',{fill:'none',stroke:INK,'stroke-width':6,'stroke-linejoin':'round','stroke-linecap':'round',opacity:0});
    // ── LES JETONS (teal, ce qui est POSÉ et paie) ──
    const MARKERS=[]; for(let i=0;i<4;i++)MARKERS.push(mk('circle',{r:24,fill:YOU,opacity:0}));
    // ── LES SOCKETS (emplacement VIDE — rien n'y est tombé) ──
    const SOCKETS=[]; for(let i=0;i<4;i++)SOCKETS.push(mk('rect',{rx:7,fill:'none',stroke:DEAD,'stroke-width':5,'stroke-dasharray':'10 8',opacity:0}));
    // ── LA BOUGIE (le prix qui teste le niveau — encre) ──
    const candBody=mk('rect',{rx:4,fill:INK,opacity:0});
    const candWick=mk('line',{stroke:INK,'stroke-width':6,'stroke-linecap':'round',opacity:0});

    function level(i,x1,x2,y,sw,color,op){const e=LEVELS[i];e.setAttribute('x1',x1.toFixed(1));e.setAttribute('x2',x2.toFixed(1));
      e.setAttribute('y1',y.toFixed(1));e.setAttribute('y2',y.toFixed(1));e.setAttribute('stroke',color);e.setAttribute('stroke-width',sw);setOp(e,op);}
    function marker(i,x,y,r,op){const e=MARKERS[i];e.setAttribute('cx',x.toFixed(1));e.setAttribute('cy',y.toFixed(1));e.setAttribute('r',r.toFixed(1));setOp(e,op);}
    function socket(i,x,y,w,h,op){const e=SOCKETS[i];e.setAttribute('x',(x-w/2).toFixed(1));e.setAttribute('y',(y-h/2).toFixed(1));
      e.setAttribute('width',w.toFixed(1));e.setAttribute('height',h.toFixed(1));setOp(e,op);}
    function trace(i,pts,color,op){const e=TRACES[i];e.setAttribute('points',pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '));e.setAttribute('stroke',color);setOp(e,op);}
    function realpath(pts,op){REALPATH.setAttribute('points',pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '));setOp(REALPATH,op);}
    function candle(cx,yTop,yBot,op){candBody.setAttribute('x',(cx-38).toFixed(1));candBody.setAttribute('width',76);
      candBody.setAttribute('y',yTop.toFixed(1));candBody.setAttribute('height',Math.max(4,yBot-yTop).toFixed(1));setOp(candBody,op);
      candWick.setAttribute('x1',cx);candWick.setAttribute('x2',cx);candWick.setAttribute('y1',(yTop-42).toFixed(1));candWick.setAttribute('y2',yTop.toFixed(1));setOp(candWick,op);}

    // ── LES FIGURES FIL-DE-FER (rôles d'échange, encre, sans visage) ──
    function mkFig(){return {h:mk('circle',{r:24,fill:'none',stroke:INK,'stroke-width':6,opacity:0}),
      b:mk('line',{stroke:INK,'stroke-width':6,'stroke-linecap':'round',opacity:0}),
      a:mk('line',{stroke:INK,'stroke-width':6,'stroke-linecap':'round',opacity:0}),
      l1:mk('line',{stroke:INK,'stroke-width':6,'stroke-linecap':'round',opacity:0}),
      l2:mk('line',{stroke:INK,'stroke-width':6,'stroke-linecap':'round',opacity:0})};}
    const figL=mkFig(), figR=mkFig();
    function drawFig(F,fx,hy,hx,hyd,op){
      F.h.setAttribute('cx',fx.toFixed(1));F.h.setAttribute('cy',hy.toFixed(1));setOp(F.h,op);
      F.b.setAttribute('x1',fx);F.b.setAttribute('x2',fx);F.b.setAttribute('y1',(hy+24).toFixed(1));F.b.setAttribute('y2',(hy+134).toFixed(1));setOp(F.b,op);
      F.a.setAttribute('x1',fx);F.a.setAttribute('y1',(hy+54).toFixed(1));F.a.setAttribute('x2',hx.toFixed(1));F.a.setAttribute('y2',hyd.toFixed(1));setOp(F.a,op);
      F.l1.setAttribute('x1',fx);F.l1.setAttribute('y1',(hy+134).toFixed(1));F.l1.setAttribute('x2',(fx-24).toFixed(1));F.l1.setAttribute('y2',(hy+180).toFixed(1));setOp(F.l1,op);
      F.l2.setAttribute('x1',fx);F.l2.setAttribute('y1',(hy+134).toFixed(1));F.l2.setAttribute('x2',(fx+24).toFixed(1));F.l2.setAttribute('y2',(hy+180).toFixed(1));setOp(F.l2,op);}
    function hideFig(F){for(const k in F)setOp(F[k],0);}

    function hideAll(){for(const e of LEVELS)setOp(e,0);for(const e of TRACES)setOp(e,0);for(const e of MARKERS)setOp(e,0);
      for(const e of SOCKETS)setOp(e,0);setOp(REALPATH,0);setOp(candBody,0);setOp(candWick,0);hideFig(figL);hideFig(figR);}

    // ── QUESTION (§M15) — 1re ligne pleine dès la frame 0 ──
    const QLINES=["WHY DOESN'T BEING","RIGHT PAY?"];
    const FS=76,lineH=100,y0=210,qY=QLINES.map((s,li)=>y0+li*lineH);
    const qEls=QLINES.map((s,li)=>{const e=mk('text',{x:CX,y:qY[li],'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':FS,'letter-spacing':'1',opacity:0});e.textContent=s;return e;});
    const QMY=y0+2*lineH+92,qMark=mk('text',{x:CX,y:QMY,'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':150,opacity:0});qMark.textContent='?';
    qEls.forEach(e=>{const t=e.textContent,f=Math.min(FS,930/Math.max(1,t.length*0.66));e.setAttribute('font-size',f.toFixed(1));});
    function hideQ(){for(const e of qEls)setOp(e,0);setOp(qMark,0);}

    // ── ÉTIQUETTES (§M18) — putCap MESURE la largeur réelle, copié TEL QUEL depuis l26.html ──
    function caption(sz){return mk('text',{'text-anchor':'middle','font-family':'Helvetica Neue, Arial, sans-serif','font-weight':(sz>44?800:700),'font-size':(sz||38),'data-fs':(sz||38),'letter-spacing':'1.5',opacity:0});}
    const capA=caption(40),capB=caption(46),capC=caption(36),capD=caption(36),capE=caption(34),capF=caption(34);
    const ctaEl=caption(62);
    function putCap(el,txt,cx,y,color,op){
      const MARGIN=70, MAXW=1080-2*MARGIN;
      if(el.__cap!==txt){ el.__cap=txt; el.textContent=txt;
        const nom=+el.getAttribute('data-fs')||+el.getAttribute('font-size')||38;
        el.setAttribute('font-size',nom);
        let w=el.getComputedTextLength()||0;
        if(!w) w=txt.length*nom*0.72;   // repli si la mesure échoue : estimation LARGE (>0.66) — jamais pire qu'avant
        if(w>MAXW){ const fs=Math.max(18,nom*MAXW/w); el.setAttribute('font-size',fs.toFixed(1)); w=el.getComputedTextLength()||txt.length*fs*0.72; }
        el.__hw=w/2;
      }
      const x=clamp(+cx, MARGIN+el.__hw, 1080-MARGIN-el.__hw);
      el.setAttribute('x',x.toFixed(1));el.setAttribute('y',y);el.setAttribute('fill',color);setOp(el,op);}
    function hideCaps(){for(const e of [capA,capB,capC,capD,capE,capF,ctaEl])setOp(e,0);}

    const LY=1020;               // le niveau commun (S1/S2/S3)
    const MX=380;                // abscisse du jeton posé sur le trait (moitié gauche)

    // ═══ S1 — LE MÊME TRAIT, DEUX PERSONNES : l'une POSE un jeton, l'autre REGARDE ═══
    // Verbe visuel : la POSE (un jeton teal snap sur le trait) + le guetteur planté.
    function s1(lf,t,s){
      const u=t-s; hideCaps(); hideAll();
      const gf=clamp(1-(lf-0.84)/0.10,0,1);
      // question (pop ligne par ligne, 1re ligne pleine dès t=0)
      for(let k=0;k<qEls.length;k++){const qt=(k===0?0.18:u-(0.1+k*0.30)),ap=clamp(qt/0.18,0,1),sc=0.7+0.3*backOut(ap);setOp(qEls[k],ap*gf);qEls[k].setAttribute('transform',`translate(${(CX*(1-sc)).toFixed(2)} ${(qY[k]*(1-sc)).toFixed(2)}) scale(${sc.toFixed(3)})`);}
      const qm=u-1.0,qap=clamp(qm/0.2,0,1),qsc=0.6+0.4*backOut(qap);setOp(qMark,qap*gf);qMark.setAttribute('transform',`translate(${(CX*(1-qsc)).toFixed(2)} ${(QMY*(1-qsc)).toFixed(2)}) scale(${qsc.toFixed(3)})`);
      // ÉMOTION FRAME 0 (CURIOSITÉ) : le niveau et la bougie au ras du trait sont posés, nets, dès t=0 ; deux
      // figures identiques l'encadrent. Rien ne se construit — l'énigme (pourquoi une seule porte un jeton ?) est entière.
      level(0,150,960,LY,7,INK,1);
      // la bougie teste le trait par en-dessous (deux harmoniques), puis touche à la fin
      const bob=6*Math.sin(u*1.6)+4*Math.sin(u*2.75);
      const touch=clamp((u-4.4)/1.4,0,1);
      const yTop=LY+16-bob-touch*16;
      candle(CX,yTop,1180+3*Math.sin(u*1.3),1);
      putCap(capA,'THE SAME LEVEL',210,LY+55,INK,gf);
      // figure GAUCHE : pose le jeton (bras vers le trait) puis SORT du cadre par la gauche (déplacement réel)
      const exit=clamp((u-2.8)/1.2,0,1), lfx=280-exit*470-3*Math.sin(u*1.9);
      const placing=(u>=1.0 && u<2.8);
      const lhx=placing?MX:lfx-2, lhy=placing?LY:1254;
      drawFig(figL,lfx,1200,lhx,lhy,1);
      // le jeton SNAP sur le trait à ~1.4 et y reste (bobbing léger)
      const snap=clamp((u-1.2)/0.4,0,1);
      if(snap>0){ const jr=24*(0.4+0.6*backOut(snap)); marker(0,MX,LY-2*Math.sin(u*2.2)-1.5*Math.sin(u*3.3),jr,1);
        putCap(capC,'PLACED IT',MX,LY-58,YOU,clamp((u-1.6)/0.4,0,1)); }
      // figure DROITE : reste plantée, regarde la bougie (bras le long du corps)
      const rsway=3*Math.sin(u*1.5+1);
      drawFig(figR,800+rsway,1200,800+rsway-2,1254,1);
      putCap(capD,'JUST WATCHING',800,1430,DEAD,clamp((u-3.2)/0.6,0,1)*gf);
    }

    // ═══ S2 — LE TRAIT TIENT, LE JETON MONTE AVEC LE PRIX — le guetteur ne bouge pas ═══
    // Verbe visuel : l'ASCENSION (le jeton teal remonte la trajectoire et sort par le haut).
    function s2(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideAll();
      // le trait tient (épaississement bref au rebond ~0.6s) — état repris exact de S1
      const held=1+clamp(1-Math.abs(u-0.6)/0.5,0,1);
      level(0,150,960,LY,7+2*held,INK,1);
      putCap(capA,'THE LEVEL HELD',220,LY-40,INK,1);
      // la trajectoire monte depuis le jeton (part du niveau, sort en haut à droite) — vie continue (2 harmoniques)
      const wob=(x)=>8*Math.sin(u*1.4+x*0.006)+4*Math.sin(u*2.3+x*0.011);
      const P=[]; const x0=MX, y0p=LY, x1=760, y1p=580;
      for(let i=0;i<=8;i++){const f=i/8, x=lerp(x0,x1,f), y=lerp(y0p,y1p,eIn(f)); P.push([x+wob(x)*0.4, y+wob(y)]);}
      const grow=clamp(u/2.6,0,1); const shown=P.slice(0,Math.max(2,Math.round(2+grow*(P.length-2))));
      realpath(shown,1);
      // le jeton remonte le long de la trajectoire (lent puis pressé), sort par le haut avec elle
      const ride=eIn(clamp((u-0.6)/2.6,0,1)); const idx=ride*(P.length-1); const a=Math.floor(idx), b=Math.min(P.length-1,a+1), fr=idx-a;
      const jx=lerp(P[a][0],P[b][0],fr), jy=lerp(P[a][1],P[b][1],fr);
      const gone=clamp((u-3.3)/0.8,0,1);
      marker(0,jx,jy,24,1-gone*0.0);
      if(gone>0){ marker(0,jx,jy-gone*60,24,1-gone); }
      putCap(capB,'THE MOVE RAN ALL DAY',270,650,INK,clamp((u-1.4)/0.7,0,1));
      putCap(capC,'IN THE MOVE',300,800,YOU,clamp((u-1.8)/0.6,0,1));
      // figure DROITE : toujours au même endroit, bras le long du corps, dans le cadre
      const rsway=3*Math.sin(u*1.5+1);
      drawFig(figR,800+rsway,1200,800+rsway-2,1254,1);
      putCap(capD,'STILL WATCHING',800,1430,DEAD,clamp((u-2.6)/0.6,0,1));
    }

    // ═══ S3 — LE CALQUE JUSTE… ET LE SOCKET VIDE EN DESSOUS ═══
    // Verbe visuel : la SUPERPOSITION exacte + la RÉVÉLATION du vide (un emplacement où rien n'est tombé).
    function s3(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideAll();
      // la trajectoire réelle (fantôme encre) — vie continue légère
      const wob=(x)=>5*Math.sin(u*1.3+x*0.006)+3*Math.sin(u*2.1+x*0.010);
      const RP=[]; for(let i=0;i<=8;i++){const f=i/8, x=lerp(300,780,f), y=lerp(1040,600,eIn(f)); RP.push([x, y+wob(y)]);}
      realpath(RP,0.55);
      level(0,150,900,1040,7,INK,1);
      // le CALQUE : même forme, part DÉCALÉ (déroulé par la figure) puis GLISSE se superposer EXACTEMENT
      const slide=eInOut(clamp((u-0.2)/1.8,0,1)); const dx=(1-slide)*230, dy=(1-slide)*60;
      const CP=RP.map(p=>[p[0]+dx, p[1]-dy]);
      trace(0,CP,INK,1); TRACES[0].setAttribute('stroke-dasharray','14 10');
      putCap(capB,'THE TRACE WAS RIGHT',540,660,INK,clamp((u-1.6)/0.6,0,1));
      // figure DROITE (petite, à gauche) déroule le calque, bras levé
      const fsway=3*Math.sin(u*1.6);
      drawFig(figR,180+fsway,1210,300,1000,1);
      // RÉVÉLATION : sous le niveau, un SOCKET vide — aucun jeton n'y est jamais tombé (il pulse, position)
      const rev=clamp((u-2.4)/0.7,0,1);
      const svib=2.2*Math.sin(u*3.0)+1.4*Math.sin(u*4.6);
      socket(0,300+svib,1040+34,66,52,rev);
      putCap(capC,'NOTHING WAS PLACED',450,1235,DEAD,clamp((u-2.9)/0.6,0,1));
    }

    // ═══ S4 — ESCALADE FROIDE : trois niveaux, trois calques justes, trois sockets vides, puis délavage ═══
    // Verbe visuel : la MULTIPLICATION cadencée + le délavage teal→gris (le juste ne se conserve pas).
    function s4(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideAll();
      const rowsY=[720,1000,1280];
      const fade=clamp((u-4.2)/1.4,0,1); // délavage teal→gris ensemble
      for(let i=0;i<3;i++){
        const y=rowsY[i];
        const bob=4*Math.sin(u*1.8-i*0.7)+2.5*Math.sin(u*2.9-i*0.5);
        level(i,250,850,y+bob,7,INK,1);                       // les trois niveaux PLEINS dès la frame 0 (jamais un écran qui se remplit)
        // le calque juste se pose (glisse depuis la droite) en cadence, teal, puis se délave
        const land=eOut(clamp((u-(0.2+i*0.5))/0.6,0,1)); if(land>0){
          const dx=(1-land)*180;
          const cp=[[250+dx,y-70+bob],[430+dx,y-46+bob],[610+dx,y-58+bob],[790+dx,y-30+bob]];
          trace(i,cp,lerpColor(fade),land); TRACES[i].setAttribute('stroke-dasharray','14 10'); }
        // sous chacun, un socket reste VIDE (jamais teal), il vibre (position)
        const rev=clamp((u-(0.6+i*0.5))/0.5,0,1); if(rev>0){
          const sv=1.8*Math.sin(u*3.0-i)+1.2*Math.sin(u*4.7-i*0.6);
          socket(i,200+sv,y+bob,58,46,rev); }
      }
      putCap(capB,'THE CHART PAYS POSITION',CX,612,INK,clamp((u-0.6)/0.7,0,1));
      putCap(capF,'RIGHT — AND KEPT NOTHING',CX,1440,DEAD,clamp((u-4.4)/0.7,0,1));
    }

    // ═══ S5 — DIPTYQUE : le même trait paie ou non selon qu'un jeton y a été posé AVANT ═══
    // Verbe visuel : la COMPARAISON A/B (gauche teal posé · droite encre nue) — CTA abonnement tenu.
    function s5(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideAll();
      const LYd=1080;
      // les deux socles respirent (deux harmoniques) — jamais figés, jamais un écran de deux traits morts
      const lb=5*Math.sin(u*1.5)+3*Math.sin(u*2.6), rb=5*Math.sin(u*1.4+1)+3*Math.sin(u*2.5+0.7);
      // GAUCHE — le jeton est posé, le trait se prolonge en TEAL plein
      const paid=eInOut(clamp((u-0.25)/1.5,0,1));
      level(0,140,500,LYd+lb,7,INK,1);                 // socle encre du niveau gauche
      level(1,140,140+360*paid,LYd+lb,10,YOU,paid);    // prolongement teal (croît = mouvement)
      const jset=clamp((u-0.05)/0.4,0,1);
      if(jset>0) marker(0,320,LYd+lb-2*Math.sin(u*2.2)-1.4*Math.sin(u*3.4),24*(0.4+0.6*backOut(jset)),1);
      putCap(capC,'PLACED BEFORE',320,LYd+96,YOU,clamp((u-0.4)/0.6,0,1));
      // DROITE — rien de posé, le trait reste encre ; un socket vide pulse (le manque, position)
      level(2,580,940,LYd+rb,7,INK,1);
      const sv=2.2*Math.sin(u*3.0)+1.4*Math.sin(u*4.6);
      socket(0,760+sv,LYd+rb,60,48,clamp((u+0.15)/0.55,0,1));
      putCap(capD,'NOTHING PLACED',760,LYd+96,DEAD,clamp((u-0.5)/0.6,0,1));
      // la morale citable + le CTA abonnement, tenus jusqu'à la fin
      putCap(capB,'BEING RIGHT ISN\'T BEING IN',CX,720,INK,clamp((u-1.2)/0.7,0,1));
      const ctaP=clamp((u-2.4)/0.7,0,1), ctaS=0.9+0.1*backOut(ctaP)+0.012*Math.sin(u*1.8);
      putCap(ctaEl,'FOLLOW KONGRAVE',CX,1360,YOU,ctaP);
      ctaEl.setAttribute('transform',`translate(${(CX*(1-ctaS)).toFixed(2)} ${(1360*(1-ctaS)).toFixed(2)}) scale(${ctaS.toFixed(3)})`);
    }

    const RENDER={s1,s2,s3,s4,s5};const SCENEFN=SPEC.map(s=>RENDER[s.id]||s1);
    const clock={t:0};
    function sceneAt(t){let i=0;for(let k=0;k<SC.length;k++){if(t>=SC[k].s-1e-6)i=k;}return Math.min(i,SCENEFN.length-1);}
    function render(){const t=clock.t;const i=sceneAt(t),lf=clamp((t-SC[i].s)/SC[i].d,0,1);SCENEFN[i](lf,t,SC[i].s);}
    const tl=gsap.timeline({paused:true});
    tl.to(clock,{t:TOTAL,duration:TOTAL,ease:'none',onUpdate:render},0);
    tl.to(SVG,{opacity:1,duration:0.001},TOTAL-0.001);
    window.__timelines=window.__timelines||{};window.__timelines['main']=tl;
  </script>
</body>
