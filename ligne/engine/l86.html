<!doctype html>
<html lang="en" data-resolution="portrait" data-fps="30">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>:root{--paper:#F2EFE7}*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}#stage{position:absolute;inset:0}svg{position:absolute;inset:0;width:1080px;height:1920px}</style>
</head>
<body>
  <!-- L86 « THE SCOREBOARD THAT ISN'T YOURS » — MENTAL, MÉTAPHORE SEULE. TOFU. Tu cours ta course en regardant le tableau d'un autre couloir.
       S1 : une piste teal, un coureur fil-de-fer, la tête tournée vers un TABLEAU d'un autre couloir. S2 : sous chaque couloir quatre
       CONDITIONS (capital, temps, risque/trade, ancienneté) aux valeurs différentes — rien au tableau. S3 : le tableau grossit sur UN
       chiffre ; les conditions passent DERRIÈRE et disparaissent. S4 : le coureur ACCÉLÈRE, sa foulée se dégrade ; seule une condition
       bouge — le RISQUE/trade qui monte ; l'écart reste identique. S5 : la prise — le tableau extérieur SORT, un tableau sur SA piste
       n'affiche que SES quatre conditions + CTA @kongrave_. Doctrine : teal = ta piste/toi ; gris = tableau extérieur/risque monté ; pas de brun. -->
  <div id="stage" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="1"><svg id="svg" viewBox="0 0 1080 1920"></svg></div>
  <script>
    const TOTAL=__TOTAL__, SC=__SCENES__, SPEC=__SPEC__;
    const NS='http://www.w3.org/2000/svg', SVG=document.getElementById('svg');
    const YOU='#1E5F6E', INK='#20242A', PAPER='#F2EFE7', DEAD='#474D50';
    const CX=540;
    function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);(p||SVG).appendChild(e);return e;}
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,f)=>a+(b-a)*clamp(f,0,1),eIn=f=>f*f,eOut=f=>1-(1-f)*(1-f),eInOut=f=>f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
    const backOut=(p,s)=>{s=(s==null?1.9:s);const q=clamp(p,0,1)-1;return 1+(s+1)*q*q*q+s*q*q;};
    const setOp=(el,o)=>el.setAttribute('opacity',clamp(o,0,1).toFixed(3));

    const laneY=mk('line',{stroke:YOU,'stroke-width':5,'stroke-linecap':'round',opacity:0}), laneG=mk('line',{stroke:DEAD,'stroke-width':5,'stroke-linecap':'round',opacity:0});
    // coureur fil-de-fer
    const run=mk('g',{});
    const rHead=mk('circle',{r:20,fill:'none',stroke:YOU,'stroke-width':4},run);
    const rBody=mk('line',{x1:0,y1:20,x2:0,y2:74,stroke:YOU,'stroke-width':4},run);
    const rArm1=mk('line',{x1:0,y1:36,x2:34,y2:24,stroke:YOU,'stroke-width':4},run), rArm2=mk('line',{x1:0,y1:36,x2:-30,y2:52,stroke:YOU,'stroke-width':4},run);
    const rLeg1=mk('line',{x1:0,y1:74,x2:34,y2:120,stroke:YOU,'stroke-width':4},run), rLeg2=mk('line',{x1:0,y1:74,x2:-30,y2:120,stroke:YOU,'stroke-width':4},run);
    const gaze=mk('line',{stroke:DEAD,'stroke-width':2,'stroke-dasharray':'6 6',opacity:0});
    // tableau d'affichage
    const board=mk('rect',{fill:'none',stroke:DEAD,'stroke-width':5,rx:10,opacity:0});
    const boardNum=mk('text',{'text-anchor':'middle','font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':70,opacity:0});
    // conditions
    const CON=[]; const CONv=[];
    const conNames=['CAPITAL','TIME','RISK/TRADE','YEARS IN'];
    for(let i=0;i<8;i++){CON.push(mk('text',{'text-anchor':'start','font-family':'Helvetica Neue, Arial, sans-serif','font-weight':700,'font-size':28,opacity:0}));
      CONv.push(mk('rect',{rx:4,opacity:0}));}

    // ── QUESTION (§M15) ──
    const QL=['WHOSE RACE','ARE YOU RUNNING?'];
    const FS=82,lineH=108,y0v=210,qY=QL.map((s,li)=>y0v+li*lineH);
    const qEls=QL.map((s,li)=>{const e=mk('text',{x:CX,y:qY[li],'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':FS,'letter-spacing':'1',opacity:0});e.textContent=s;return e;});
    const QMY=y0v+2*lineH+90,qMark=mk('text',{x:CX,y:QMY,'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':150,opacity:0});qMark.textContent='?';
    qEls.forEach(e=>{const t=e.textContent,f=Math.min(FS,900/Math.max(1,t.length*0.62));e.setAttribute('font-size',f.toFixed(1));});
    function hideQ(){for(const e of qEls)setOp(e,0);setOp(qMark,0);}

    function caption(sz){return mk('text',{'text-anchor':'middle','font-family':'Helvetica Neue, Arial, sans-serif','font-weight':(sz>44?800:700),'font-size':(sz||38),'data-fs':(sz||38),'letter-spacing':'1.5',opacity:0});}
    const capA=caption(42),capB=caption(46),capC=caption(38),capD=caption(38),capE=caption(46),capF=caption(34);
    function putCap(el,txt,cx,y,color,op){
      const MARGIN=56, MAXW=1080-2*MARGIN;
      if(el.__cap!==txt){ el.__cap=txt; el.textContent=txt;
        const nom=+el.getAttribute('data-fs')||+el.getAttribute('font-size')||38;
        el.setAttribute('font-size',nom); let w=el.getComputedTextLength()||0; if(!w) w=txt.length*nom*0.72;
        if(w>MAXW){ const fs=Math.max(18,nom*MAXW/w); el.setAttribute('font-size',fs.toFixed(1)); w=el.getComputedTextLength()||txt.length*fs*0.72; }
        el.__hw=w/2;
      }
      const x=clamp(+cx, MARGIN+el.__hw, 1080-MARGIN-el.__hw);
      el.setAttribute('x',x.toFixed(1));el.setAttribute('y',y);el.setAttribute('fill',color);setOp(el,op);}
    function hideCaps(){for(const e of [capA,capB,capC,capD,capE,capF])setOp(e,0);}
    function ctaTOFU(u){putCap(capE,'@kongrave_',CX,250,YOU,clamp((u-3.6)/0.8,0,1));putCap(capF,'THE MECHANICS NOBODY EXPLAINS',CX,306,INK,clamp((u-3.9)/0.8,0,1));}
    function placeRun(x,y,sc,skew,op){run.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc.toFixed(2)}) skewX(${skew.toFixed(1)})`);setOp(run,op);}
    function stroke(col){for(const e of [rHead,rBody,rArm1,rArm2,rLeg1,rLeg2])e.setAttribute('stroke',col);}
    function hideDyn(){for(const e of [laneY,laneG,run,gaze,board,boardNum])setOp(e,0);for(const a of [CON,CONv])for(const e of a)setOp(e,0);hideCaps();}

    // ═══ S1 — LE COUREUR, LES YEUX SUR LE TABLEAU ═══
    function s1(lf,t,s){
      const u=t-s; hideDyn();
      const gf=clamp(1-(lf-0.85)/0.10,0,1);
      for(let k=0;k<qEls.length;k++){const qt=(k===0?0.18:u-(0.1+k*0.30)),ap=clamp(qt/0.18,0,1),sc=0.7+0.3*backOut(ap);setOp(qEls[k],ap*gf);qEls[k].setAttribute('transform',`translate(${(CX*(1-sc)).toFixed(2)} ${(qY[k]*(1-sc)).toFixed(2)}) scale(${sc.toFixed(3)})`);}
      const qm=u-0.95,qap=clamp(qm/0.2,0,1),qsc=0.6+0.4*backOut(qap);setOp(qMark,qap*gf);qMark.setAttribute('transform',`translate(${(CX*(1-qsc)).toFixed(2)} ${(QMY*(1-qsc)).toFixed(2)}) scale(${qsc.toFixed(3)})`);
      laneY.setAttribute('x1',150);laneY.setAttribute('x2',600);laneY.setAttribute('y1',1140);laneY.setAttribute('y2',1140);setOp(laneY,clamp(u/0.3,0,1)*gf);
      laneG.setAttribute('x1',640);laneG.setAttribute('x2',930);laneG.setAttribute('y1',1140);laneG.setAttribute('y2',1140);setOp(laneG,clamp(u/0.3,0,1)*gf);
      const skew=lerp(-4,-14,clamp(u/5,0,1));   // la foulée se désaxe
      stroke(YOU);placeRun(340, 1000+6*Math.sin(u*3), 1, skew, clamp((u-0.2)/0.4,0,1)*gf);
      // le regard vers le tableau
      gaze.setAttribute('x1',360);gaze.setAttribute('y1',1000);gaze.setAttribute('x2',790);gaze.setAttribute('y2',960);setOp(gaze,clamp((u-0.6)/0.4,0,1)*gf);
      board.setAttribute('x',740);board.setAttribute('y',900);board.setAttribute('width',150);board.setAttribute('height',110);setOp(board,clamp(u/0.4,0,1)*gf);
      boardNum.textContent='+34%';boardNum.setAttribute('font-size',48);boardNum.setAttribute('x',815);boardNum.setAttribute('y',970);boardNum.setAttribute('fill',DEAD);setOp(boardNum,clamp((u-0.3)/0.4,0,1)*gf);
      putCap(capB,'YOU’RE WATCHING SOMEONE ELSE’S BOARD',CX,1300,INK,clamp((u-3.0)/0.8,0,1)*gf);
    }

    // ═══ S2 — QUATRE CONDITIONS DIFFÉRENTES ═══
    function s2(lf,t,s){
      const u=t-s; hideQ(); hideDyn();
      const hL=[120,90,50,140], hR=[60,140,110,70];
      for(let i=0;i<4;i++){const ap=clamp((u-0.2-i*0.12)/0.4,0,1);const br=5*Math.sin(u*1.4+i*0.5);const y=780+i*100+br;
        CON[i].textContent=conNames[i];CON[i].setAttribute('x',180);CON[i].setAttribute('y',y+20);CON[i].setAttribute('fill',INK);setOp(CON[i],ap);
        CONv[i].setAttribute('x',440);CONv[i].setAttribute('y',y-6);CONv[i].setAttribute('width',(hL[i]+4*Math.sin(u*1.3+i)).toFixed(1));CONv[i].setAttribute('height',26);CONv[i].setAttribute('fill',YOU);setOp(CONv[i],ap);
        CONv[4+i].setAttribute('x',700);CONv[4+i].setAttribute('y',y-6);CONv[4+i].setAttribute('width',(hR[i]+4*Math.sin(u*1.5+i)).toFixed(1));CONv[4+i].setAttribute('height',26);CONv[4+i].setAttribute('fill',DEAD);setOp(CONv[4+i],ap);}
      putCap(capC,'YOU',480,750,YOU,clamp((u-0.3)/0.5,0,1));putCap(capD,'THEM',740,750,DEAD,clamp((u-0.3)/0.5,0,1));
      putCap(capB,'NONE OF THIS IS ON THE BOARD',CX,1250,INK,clamp((u-2.8)/0.7,0,1));
    }

    // ═══ S3 — LE TABLEAU : UN SEUL CHIFFRE ═══
    function s3(lf,t,s){
      const u=t-s; hideQ(); hideDyn();
      const grow=clamp(u/1.6,0,1);
      const w=lerp(150,420,grow), h=lerp(110,240,grow);
      board.setAttribute('x',(CX-w/2).toFixed(1));board.setAttribute('y',(900-h/2).toFixed(1));board.setAttribute('width',w);board.setAttribute('height',h);setOp(board,1);
      boardNum.textContent='+34%';boardNum.setAttribute('font-size',lerp(48,120,grow).toFixed(0));boardNum.setAttribute('x',CX);boardNum.setAttribute('y',(920).toFixed(1));boardNum.setAttribute('fill',INK);setOp(boardNum,1);
      // les conditions passent derrière et disparaissent
      for(let i=0;i<4;i++){const y=780+i*70;const fade=1-clamp((u-0.6-i*0.1)/0.5,0,1);CON[i].textContent=conNames[i];CON[i].setAttribute('x',200);CON[i].setAttribute('y',y);CON[i].setAttribute('fill',DEAD);setOp(CON[i],fade*0.6);}
      putCap(capC,'ONE NUMBER — HIDES EVERY DIFFERENCE',CX,1200,DEAD,clamp((u-1.6)/0.5,0,1));
      putCap(capB,'THE ONLY THING COMPARABLE',CX,600,INK,clamp((u-2.8)/0.7,0,1));
    }

    // ═══ S4 — IL ACCÉLÈRE, SEUL LE RISQUE BOUGE ═══
    function s4(lf,t,s){
      const u=t-s; hideQ(); hideDyn();
      laneY.setAttribute('x1',150);laneY.setAttribute('x2',600);laneY.setAttribute('y1',1000);laneY.setAttribute('y2',1000);setOp(laneY,1);
      const acc=clamp(u/2.0,0,1);
      const skew=lerp(-14,-30,acc);
      stroke(YOU);placeRun(lerp(280,460,acc), 880+10*Math.sin(u*7), lerp(1,1.1,acc), skew, 1);
      // seule la condition RISK/TRADE monte
      for(let i=0;i<4;i++){const y=1120+i*70;CON[i].textContent=conNames[i];CON[i].setAttribute('x',180);CON[i].setAttribute('y',y);CON[i].setAttribute('fill', i===2?INK:DEAD);setOp(CON[i],clamp(u/0.4,0,1));
        const grows=(i===2);const w=grows?lerp(60,220,acc):[110,90,60,120][i];CONv[i].setAttribute('x',440);CONv[i].setAttribute('y',y-24);CONv[i].setAttribute('width',w);CONv[i].setAttribute('height',24);CONv[i].setAttribute('fill', grows?DEAD:DEAD);CONv[i].setAttribute('fill-opacity', grows?1:0.4);setOp(CONv[i],clamp(u/0.4,0,1));}
      putCap(capC,'ONLY RISK/TRADE MOVED — THE OTHERS CAN’T',CX,1420,DEAD,clamp((u-2.0)/0.6,0,1));
      putCap(capB,'SPEEDING UP IS ALL YOU CHANGED',CX,600,INK,clamp((u-3.0)/0.7,0,1));
    }

    // ═══ S5 — SON PROPRE TABLEAU + CTA ═══
    function s5(lf,t,s){
      const u=t-s; hideQ(); hideDyn();
      laneY.setAttribute('x1',150);laneY.setAttribute('x2',930);laneY.setAttribute('y1',1180);laneY.setAttribute('y2',1180);setOp(laneY,clamp(u/0.3,0,1));
      const skew=lerp(-14,-4,clamp((u-0.4)/1.2,0,1));   // la foulée se réaligne
      stroke(YOU);placeRun(340, 1040+6*Math.sin(u*3), 1, skew, clamp(u/0.15,0,1));
      // son propre tableau, ses quatre conditions
      board.setAttribute('x',600);board.setAttribute('y',820);board.setAttribute('width',330);board.setAttribute('height',260);setOp(board,clamp((u-0.4)/0.4,0,1));board.setAttribute('stroke',YOU);
      for(let i=0;i<4;i++){const y=880+i*56;const ap=clamp((u-0.6-i*0.12)/0.4,0,1);CON[i].textContent=conNames[i];CON[i].setAttribute('x',630);CON[i].setAttribute('y',y);CON[i].setAttribute('fill',INK);CON[i].setAttribute('font-size',30);setOp(CON[i],ap);}
      putCap(capC,'YOUR OWN TERMS — ON YOUR TRACK',CX,760,YOU,clamp((u-0.4)/0.5,0,1));
      putCap(capD,'A COMPARISON YOU CAN’T SEE ISN’T ONE',CX,1290,INK,clamp((u-2.2)/0.6,0,1));
      ctaTOFU(u);
    }

    const RENDER={s1,s2,s3,s4,s5};const SCENEFN=SPEC.map(s=>RENDER[s.id]||s1);
    const clock={t:0};
    function sceneAt(t){let i=0;for(let k=0;k<SC.length;k++){if(t>=SC[k].s-1e-6)i=k;}return Math.min(i,SCENEFN.length-1);}
    function render(){const t=clock.t;const i=sceneAt(t),lf=clamp((t-SC[i].s)/SC[i].d,0,1);SCENEFN[i](lf,t,SC[i].s);}
    const tl=gsap.timeline({paused:true});
    tl.to(clock,{t:TOTAL,duration:TOTAL,ease:'none',onUpdate:render},0);
    tl.to(SVG,{opacity:1,duration:0.001},TOTAL-0.001);
    window.__timelines=window.__timelines||{};window.__timelines['main']=tl;
  </script>
</body>
</html>
