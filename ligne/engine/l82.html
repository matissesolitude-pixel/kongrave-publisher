<!doctype html>
<html lang="en" data-resolution="portrait" data-fps="30">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>:root{--paper:#F2EFE7}*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}#stage{position:absolute;inset:0}svg{position:absolute;inset:0;width:1080px;height:1920px}</style>
</head>
<body>
  <!-- L82 « THE ONES WHO CAME BACK » — META, MÉTAPHORE SEULE (biais du survivant). TOFU. Un port avec les bateaux revenus, le large vide.
       S1 : un port à l'encre, des bateaux amarrés nets ; au-delà le LARGE vide. S2 : au large des silhouettes en pointillé apparaissent
       (bien plus nombreuses) et s'effacent — aucune trace, aucun cours. S3 : une loupe sur les coques — deux routes côte à côte, l'une
       prudente, l'autre traversant une zone où la plupart ont disparu ; les deux bateaux sont revenus, indiscernables. S4 : trois
       signaux (compte, assurance, récit) identiques d'un bateau à l'autre ; le seul écart réel — les partis jamais revenus — est au
       large, invisible. S5 : la prise — 'combien sont partis, combien revenus ?' + CTA @kongrave_. Doctrine : teal = revenus/toi ;
       gris = perdus/large/manquant ; pas de brun ; bas du cadre vide. -->
  <div id="stage" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="1"><svg id="svg" viewBox="0 0 1080 1920"></svg></div>
  <script>
    const TOTAL=__TOTAL__, SC=__SCENES__, SPEC=__SPEC__;
    const NS='http://www.w3.org/2000/svg', SVG=document.getElementById('svg');
    const YOU='#1E5F6E', INK='#20242A', PAPER='#F2EFE7', DEAD='#474D50';
    const CX=540;
    function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);(p||SVG).appendChild(e);return e;}
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,f)=>a+(b-a)*clamp(f,0,1),eIn=f=>f*f,eOut=f=>1-(1-f)*(1-f),eInOut=f=>f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
    const backOut=(p,s)=>{s=(s==null?1.9:s);const q=clamp(p,0,1)-1;return 1+(s+1)*q*q*q+s*q*q;};
    const setOp=(el,o)=>el.setAttribute('opacity',clamp(o,0,1).toFixed(3));

    const dock=mk('line',{stroke:INK,'stroke-width':6,'stroke-linecap':'round',opacity:0});
    const seaLine=mk('line',{stroke:DEAD,'stroke-width':3,'stroke-dasharray':'14 12',opacity:0});
    // bateaux du port (teal, revenus)
    const BOAT=[]; for(let i=0;i<4;i++){const g=mk('g',{});mk('path',{d:'M -40 0 L 40 0 L 28 26 L -28 26 Z',fill:YOU,'fill-opacity':0.35,stroke:YOU,'stroke-width':4},g);mk('line',{x1:0,y1:0,x2:0,y2:-46,stroke:YOU,'stroke-width':4},g);mk('path',{d:'M 2 -44 L 30 -8 L 2 -8 Z',fill:YOU,'fill-opacity':0.5},g);BOAT.push(g);}
    // bateaux perdus (pointillé, au large)
    const LOST=[]; for(let i=0;i<8;i++){const g=mk('g',{});mk('path',{d:'M -30 0 L 30 0 L 20 20 L -20 20 Z',fill:'none',stroke:DEAD,'stroke-width':3,'stroke-dasharray':'6 6'},g);mk('line',{x1:0,y1:0,x2:0,y2:-34,stroke:DEAD,'stroke-width':2,'stroke-dasharray':'4 5'},g);LOST.push(g);}
    const lens=mk('circle',{r:66,fill:'none',stroke:INK,'stroke-width':6,opacity:0}), lensH=mk('line',{stroke:INK,'stroke-width':7,'stroke-linecap':'round',opacity:0});
    const routeA=mk('polyline',{fill:'none',stroke:YOU,'stroke-width':5,'stroke-linecap':'round',opacity:0}), routeB=mk('polyline',{fill:'none',stroke:YOU,'stroke-width':5,'stroke-linecap':'round',opacity:0});
    const danger=mk('rect',{fill:DEAD,'fill-opacity':0.14,rx:8,opacity:0});
    const SIG=[]; for(let i=0;i<6;i++)SIG.push(mk('rect',{fill:DEAD,rx:4,opacity:0}));  // 3 signaux × 2 bateaux
    const miss=mk('rect',{fill:'none',stroke:DEAD,'stroke-width':4,'stroke-dasharray':'10 8',rx:8,opacity:0});

    // ── QUESTION (§M15) ──
    const QL=['WHERE ARE','THE OTHERS?'];
    const FS=90,lineH=114,y0v=215,qY=QL.map((s,li)=>y0v+li*lineH);
    const qEls=QL.map((s,li)=>{const e=mk('text',{x:CX,y:qY[li],'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':FS,'letter-spacing':'1',opacity:0});e.textContent=s;return e;});
    const QMY=y0v+2*lineH+94,qMark=mk('text',{x:CX,y:QMY,'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':150,opacity:0});qMark.textContent='?';
    qEls.forEach(e=>{const t=e.textContent,f=Math.min(FS,900/Math.max(1,t.length*0.62));e.setAttribute('font-size',f.toFixed(1));});
    function hideQ(){for(const e of qEls)setOp(e,0);setOp(qMark,0);}

    function caption(sz){return mk('text',{'text-anchor':'middle','font-family':'Helvetica Neue, Arial, sans-serif','font-weight':(sz>44?800:700),'font-size':(sz||38),'data-fs':(sz||38),'letter-spacing':'1.5',opacity:0});}
    const capA=caption(42),capB=caption(46),capC=caption(38),capD=caption(38),capE=caption(46),capF=caption(34);
    function putCap(el,txt,cx,y,color,op){
      const MARGIN=56, MAXW=1080-2*MARGIN;
      if(el.__cap!==txt){ el.__cap=txt; el.textContent=txt;
        const nom=+el.getAttribute('data-fs')||+el.getAttribute('font-size')||38;
        el.setAttribute('font-size',nom); let w=el.getComputedTextLength()||0; if(!w) w=txt.length*nom*0.72;
        if(w>MAXW){ const fs=Math.max(18,nom*MAXW/w); el.setAttribute('font-size',fs.toFixed(1)); w=el.getComputedTextLength()||txt.length*fs*0.72; }
        el.__hw=w/2;
      }
      const x=clamp(+cx, MARGIN+el.__hw, 1080-MARGIN-el.__hw);
      el.setAttribute('x',x.toFixed(1));el.setAttribute('y',y);el.setAttribute('fill',color);setOp(el,op);}
    function hideCaps(){for(const e of [capA,capB,capC,capD,capE,capF])setOp(e,0);}
    function ctaTOFU(u){putCap(capE,'@kongrave_',CX,250,YOU,clamp((u-3.6)/0.8,0,1));putCap(capF,'THE MECHANICS NOBODY EXPLAINS',CX,306,INK,clamp((u-3.9)/0.8,0,1));}
    function place(g,x,y,op){g.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)})`);setOp(g,op);}
    function hideDyn(){for(const e of [dock,seaLine,lens,lensH,routeA,routeB,danger,miss])setOp(e,0);for(const a of [BOAT,LOST,SIG])for(const e of a)setOp(e,0);hideCaps();}

    // ═══ S1 — LE PORT ET LE LARGE VIDE ═══
    function s1(lf,t,s){
      const u=t-s; hideDyn();
      const gf=clamp(1-(lf-0.85)/0.10,0,1);
      for(let k=0;k<qEls.length;k++){const qt=(k===0?0.18:u-(0.1+k*0.30)),ap=clamp(qt/0.18,0,1),sc=0.7+0.3*backOut(ap);setOp(qEls[k],ap*gf);qEls[k].setAttribute('transform',`translate(${(CX*(1-sc)).toFixed(2)} ${(qY[k]*(1-sc)).toFixed(2)}) scale(${sc.toFixed(3)})`);}
      const qm=u-0.95,qap=clamp(qm/0.2,0,1),qsc=0.6+0.4*backOut(qap);setOp(qMark,qap*gf);qMark.setAttribute('transform',`translate(${(CX*(1-qsc)).toFixed(2)} ${(QMY*(1-qsc)).toFixed(2)}) scale(${qsc.toFixed(3)})`);
      // le quai en bas, les bateaux dessus
      dock.setAttribute('x1',150);dock.setAttribute('x2',560);dock.setAttribute('y1',1180);dock.setAttribute('y2',1180);setOp(dock,clamp(u/0.3,0,1)*gf);
      const n=Math.min(4,3+Math.floor(u/2));
      for(let i=0;i<4;i++){place(BOAT[i], 200+i*110, 1150+4*Math.sin(u*1.4+i), i<n?clamp((u-0.2-i*0.1)/0.4,0,1)*gf:0);}
      // le large : ligne d'horizon, vide
      seaLine.setAttribute('x1',620);seaLine.setAttribute('x2',930);seaLine.setAttribute('y1',1080);seaLine.setAttribute('y2',1080);setOp(seaLine,clamp(u/0.4,0,1)*gf);
      putCap(capC,'THE HARBOR',360,1250,YOU,clamp((u-0.3)/0.5,0,1)*gf);
      putCap(capD,'THE OPEN SEA',780,1160,DEAD,clamp((u-0.3)/0.5,0,1)*gf);
      putCap(capB,'THEY ALL MADE IT BACK — THAT’S WHY YOU SEE THEM',CX,1360,INK,clamp((u-3.0)/0.8,0,1)*gf);
    }

    // ═══ S2 — LES PERDUS AU LARGE ═══
    function s2(lf,t,s){
      const u=t-s; hideQ(); hideDyn();
      dock.setAttribute('x1',150);dock.setAttribute('x2',560);dock.setAttribute('y1',1180);dock.setAttribute('y2',1180);setOp(dock,0.8);
      for(let i=0;i<4;i++){place(BOAT[i], 200+i*110, 1150+4*Math.sin(u*1.4+i), 1);}
      // les silhouettes au large : nombreuses, apparaissent puis s'effacent
      const app=clamp(u/1.4,0,1);
      for(let i=0;i<8;i++){const c=i%4,r=Math.floor(i/4);const x=640+c*80,y=760+r*90;const fade=clamp((u-1.6-i*0.05)/0.6,0,1);place(LOST[i], x, y+5*Math.sin(u*1.3+i), clamp((u-0.4-i*0.06)/0.4,0,1)*(1-fade*0.85));}
      putCap(capC,'FAR MORE — AND NO TRACE',780,700,DEAD,clamp((u-1.0)/0.5,0,1));
      putCap(capB,'THE ONES WHO DIDN’T RETURN DON’T POST',CX,560,INK,clamp((u-2.8)/0.7,0,1));
    }

    // ═══ S3 — DEUX ROUTES, INDISCERNABLES ═══
    function s3(lf,t,s){
      const u=t-s; hideQ(); hideDyn();
      // zone de danger
      danger.setAttribute('x',420);danger.setAttribute('y',760);danger.setAttribute('width',300);danger.setAttribute('height',180);setOp(danger,clamp(u/0.4,0,1));
      // route A prudente (contourne), route B traverse la zone
      const pa=[];for(let i=0;i<=20;i++){const f=i/20;pa.push((200+700*f).toFixed(1)+','+(1000-120*Math.sin(f*3.14)).toFixed(1));}
      routeA.setAttribute('points',pa.join(' '));setOp(routeA,clamp(u/0.4,0,1));
      const pb=[];for(let i=0;i<=20;i++){const f=i/20;pb.push((200+700*f).toFixed(1)+','+(900-40*Math.sin(f*6.28)).toFixed(1));}
      routeB.setAttribute('points',pb.join(' '));routeB.setAttribute('stroke',DEAD);setOp(routeB,clamp((u-0.6)/0.4,0,1));
      // les deux bateaux revenus (identiques en résultat)
      place(BOAT[0], 250, 1120+4*Math.sin(u*1.4), 1); place(BOAT[1], 830, 1120+4*Math.sin(u*1.4+1), 1);
      // la loupe
      const lx=lerp(300,780,(Math.sin(u*1.1)*0.5+0.5));lens.setAttribute('cx',lx.toFixed(1));lens.setAttribute('cy',900);setOp(lens,clamp(u/0.3,0,1));
      lensH.setAttribute('x1',(lx+46).toFixed(1));lensH.setAttribute('y1',946);lensH.setAttribute('x2',(lx+84).toFixed(1));lensH.setAttribute('y2',984);setOp(lensH,clamp(u/0.3,0,1));
      putCap(capC,'CAUTIOUS',300,1210,YOU,clamp((u-0.4)/0.5,0,1));
      putCap(capD,'THROUGH THE DANGER',780,1210,DEAD,clamp((u-1.0)/0.5,0,1));
      putCap(capB,'BOTH RETURNED — SAME RESULT',CX,600,INK,clamp((u-2.8)/0.7,0,1));
    }

    // ═══ S4 — TROIS SIGNAUX IDENTIQUES, LA DONNÉE MANQUANTE AU LARGE ═══
    function s4(lf,t,s){
      const u=t-s; hideQ(); hideDyn();
      const br=5*Math.sin(u*1.4);
      place(BOAT[0], 300, 820+br, 1); place(BOAT[1], 300, 820+br, 0);
      place(BOAT[1], 300, 820+br, 0);
      place(BOAT[1], 780, 820-br, 1);
      // trois signaux identiques sous chaque bateau (visibles dès l'ouverture)
      const heights=[80,120,100];
      for(let s2=0;s2<2;s2++){const bx=(s2===0?300:780);for(let i=0;i<3;i++){const x=bx-90+i*70;const h=heights[i]*(0.3+0.7*clamp((u-i*0.12)/0.4,0,1));SIG[s2*3+i].setAttribute('x',x);SIG[s2*3+i].setAttribute('width',48);SIG[s2*3+i].setAttribute('y',(1060-h).toFixed(1));SIG[s2*3+i].setAttribute('height',h.toFixed(1));setOp(SIG[s2*3+i],clamp(u/0.15,0,1));}}
      putCap(capC,'ACCOUNT · CONFIDENCE · STORY — IDENTICAL',CX,1130,DEAD,clamp((u-0.6)/0.5,0,1));
      // la donnée manquante : au large, invisible
      miss.setAttribute('x',420);miss.setAttribute('y',1200);miss.setAttribute('width',240);miss.setAttribute('height',90);setOp(miss,clamp((u-2.0)/0.5,0,1));
      putCap(capD,'THE LOST COUNT — MISSING',CX,1330,DEAD,clamp((u-2.4)/0.5,0,1));
      putCap(capB,'YOU CAN’T TELL LUCK FROM SKILL OUTSIDE',CX,600,INK,clamp((u-3.0)/0.7,0,1));
    }

    // ═══ S5 — LA QUESTION + CTA ═══
    function s5(lf,t,s){
      const u=t-s; hideQ(); hideDyn();
      dock.setAttribute('x1',260);dock.setAttribute('x2',820);dock.setAttribute('y1',1120);dock.setAttribute('y2',1120);setOp(dock,clamp(u/0.3,0,1));
      for(let i=0;i<3;i++){place(BOAT[i], 340+i*200, 1090+4*Math.sin(u*1.4+i), clamp((u-0.2-i*0.1)/0.4,0,1));}
      // silhouettes perdues rappelées au large
      for(let i=0;i<4;i++){place(LOST[i], 300+i*160, 780+5*Math.sin(u*1.3+i), clamp((u-0.6)/0.5,0,1)*0.6);}
      putCap(capC,'HOW MANY WENT? HOW MANY RETURNED?',CX,700,YOU,clamp((u-0.4)/0.5,0,1));
      putCap(capD,'PROVEN BY SURVIVORS ISN’T PROVEN',CX,1250,INK,clamp((u-2.2)/0.6,0,1));
      ctaTOFU(u);
    }

    const RENDER={s1,s2,s3,s4,s5};const SCENEFN=SPEC.map(s=>RENDER[s.id]||s1);
    const clock={t:0};
    function sceneAt(t){let i=0;for(let k=0;k<SC.length;k++){if(t>=SC[k].s-1e-6)i=k;}return Math.min(i,SCENEFN.length-1);}
    function render(){const t=clock.t;const i=sceneAt(t),lf=clamp((t-SC[i].s)/SC[i].d,0,1);SCENEFN[i](lf,t,SC[i].s);}
    const tl=gsap.timeline({paused:true});
    tl.to(clock,{t:TOTAL,duration:TOTAL,ease:'none',onUpdate:render},0);
    tl.to(SVG,{opacity:1,duration:0.001},TOTAL-0.001);
    window.__timelines=window.__timelines||{};window.__timelines['main']=tl;
  </script>
</body>
</html>
