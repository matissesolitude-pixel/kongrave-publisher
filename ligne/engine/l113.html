<!doctype html>
<html lang="en" data-resolution="portrait" data-fps="30">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>:root{--paper:#F2EFE7}*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}#stage{position:absolute;inset:0}svg{position:absolute;inset:0;width:1080px;height:1920px}</style>
</head>
<body>
  <!-- L113 « THE WICK THAT ERASED A WEEK » — IN MEDIAS RES : on démarre dans l'action (la mèche frappe déjà).
       S1 : CHOC — 5 barres quotidiennes (teal=gains) empilées, une longue mèche (INK) les transperce vers le bas.
            Frame 0 : la mèche est DÉJÀ en train de frapper.
       S2 : Flashback — les ordres qui ont déclenché le mouvement étaient placés AVANT la hausse. Petits blocs gris sous le range.
       S3 : Les stops (petits blocs teal) deviennent du CARBURANT — ils passent au gris l'un après l'autre en cascade.
       S4 : Les stops sont partis. Un gros bloc teal apparaît EN BAS — il vient de se remplir grâce aux stops.
       S5 : La mèche comme « reçu » — elle reste seule, verticale, avec CTA. -->
  <div id="stage" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="1"><svg id="svg" viewBox="0 0 1080 1920"></svg></div>
  <script>
    const TOTAL=__TOTAL__, SC=__SCENES__, SPEC=__SPEC__;
    const NS='http://www.w3.org/2000/svg', SVG=document.getElementById('svg');
    const YOU='#1E5F6E', INK='#20242A', PAPER='#F2EFE7', DEAD='#474D50';
    const CX=540;
    function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);(p||SVG).appendChild(e);return e;}
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,f)=>a+(b-a)*clamp(f,0,1),eIn=f=>f*f,eOut=f=>1-(1-f)*(1-f),eInOut=f=>f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
    const backOut=(p,s)=>{s=(s==null?1.9:s);const q=clamp(p,0,1)-1;return 1+(s+1)*q*q*q+s*q*q;};
    const setOp=(el,o)=>el.setAttribute('opacity',clamp(o,0,1).toFixed(3));

    const POOL=[]; for(let i=0;i<64;i++)POOL.push(mk('rect',{rx:6,opacity:0}));
    let pk=0;
    function bar(x,y,w,h,color,op,rx){const e=POOL[pk++];if(!e)return;e.setAttribute('x',x.toFixed(1));e.setAttribute('y',y.toFixed(1));
      e.setAttribute('width',Math.max(1,w).toFixed(1));e.setAttribute('height',Math.max(1,h).toFixed(1));
      e.setAttribute('rx',(rx==null?6:rx));e.setAttribute('fill',color);setOp(e,op);}
    const RINGS=[]; for(let i=0;i<10;i++)RINGS.push(mk('circle',{fill:'none','stroke-width':7,opacity:0}));
    let gk=0;
    function ring(x,y,r,color,op,w){const e=RINGS[gk++];if(!e)return;e.setAttribute('cx',x.toFixed(1));e.setAttribute('cy',y.toFixed(1));
      e.setAttribute('r',Math.max(0.5,r).toFixed(1));e.setAttribute('stroke',color);e.setAttribute('stroke-width',w||7);setOp(e,op);}
    const PATHS=[]; for(let i=0;i<8;i++)PATHS.push(mk('polyline',{fill:'none','stroke-width':6,'stroke-linejoin':'round','stroke-linecap':'round',opacity:0}));
    let ptk=0;
    function path(pts,color,op,w){const e=PATHS[ptk++];if(!e)return;e.setAttribute('points',pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '));
      e.setAttribute('stroke',color);e.setAttribute('stroke-width',w||6);setOp(e,op);}
    function resetAll(){pk=0;gk=0;ptk=0;}
    function flushAll(){for(let i=pk;i<POOL.length;i++)setOp(POOL[i],0);for(let i=gk;i<RINGS.length;i++)setOp(RINGS[i],0);for(let i=ptk;i<PATHS.length;i++)setOp(PATHS[i],0);}

    // ── QUESTION — 1re ligne pleine dès la frame 0 ──
    const QLINES=['WHY DID FIVE DAYS OF GAINS','VANISH IN ONE CANDLE'];
    const FS=64,lineH=90,y0=196,qY=QLINES.map((s,li)=>y0+li*lineH);
    const qEls=QLINES.map((s,li)=>{const e=mk('text',{x:CX,y:qY[li],'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':FS,'letter-spacing':'1',opacity:0});e.textContent=s;return e;});
    const QMY=y0+2*lineH+88,qMark=mk('text',{x:CX,y:QMY,'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':150,opacity:0});qMark.textContent='?';
    qEls.forEach(e=>{const t=e.textContent,f=Math.min(FS,930/Math.max(1,t.length*0.62));e.setAttribute('font-size',f.toFixed(1));});
    function hideQ(){for(const e of qEls)setOp(e,0);setOp(qMark,0);}

    // ── ÉTIQUETTES ──
    function caption(sz){return mk('text',{'text-anchor':'middle','font-family':'Helvetica Neue, Arial, sans-serif','font-weight':(sz>44?800:700),'font-size':(sz||38),'data-fs':(sz||38),'letter-spacing':'1.5',opacity:0});}
    const capA=caption(46),capB=caption(40),capC=caption(38),capD=caption(38),capE=caption(36),capF=caption(58);
    function putCap(el,txt,cx,y,color,op){
      const MARGIN=70, MAXW=1080-2*MARGIN;
      if(el.__cap!==txt){ el.__cap=txt; el.textContent=txt;
        const nom=+el.getAttribute('data-fs')||+el.getAttribute('font-size')||38;
        el.setAttribute('font-size',nom);
        let w=el.getComputedTextLength()||0;
        if(!w) w=txt.length*nom*0.72;
        if(w>MAXW){ const fs=Math.max(18,nom*MAXW/w); el.setAttribute('font-size',fs.toFixed(1)); w=el.getComputedTextLength()||txt.length*fs*0.72; }
        el.__hw=w/2;
      }
      const x=clamp(+cx, MARGIN+el.__hw, 1080-MARGIN-el.__hw);
      el.setAttribute('x',x.toFixed(1));el.setAttribute('y',y);el.setAttribute('fill',color);setOp(el,op);}
    function hideCaps(){for(const e of [capA,capB,capC,capD,capE,capF])setOp(e,0);}

    // ═══ S1 — IN MEDIAS RES : la mèche frappe DÉJÀ ═══
    // 5 barres quotidiennes (teal) empilées en escalier montant. La mèche (ligne INK épaisse) les transperce.
    // Frame 0 : la mèche est déjà en mouvement.
    function s1(lf,t,s){
      const u=t-s; resetAll(); hideCaps();
      const gf=clamp(1-(lf-0.82)/0.10,0,1);
      // Question appears with scale animation
      for(let k=0;k<qEls.length;k++){const qt=(k===0?0.18:u-(0.1+k*0.28)),ap=clamp(qt/0.18,0,1),sc=0.7+0.3*backOut(ap);setOp(qEls[k],ap*gf);qEls[k].setAttribute('transform',`translate(${(CX*(1-sc)).toFixed(2)} ${(qY[k]*(1-sc)).toFixed(2)}) scale(${sc.toFixed(3)})`);}
      const qm=u-0.9,qap=clamp(qm/0.2,0,1),qsc=0.6+0.4*backOut(qap);setOp(qMark,qap*gf);qMark.setAttribute('transform',`translate(${(CX*(1-qsc)).toFixed(2)} ${(QMY*(1-qsc)).toFixed(2)}) scale(${qsc.toFixed(3)})`);

      // 5 daily bars (escalier montant) — teal turning grey as wick passes
      const barW=100, barGap=20, baseY=1300;
      const barHeights=[120,150,170,200,230];
      const totalW=5*barW+4*barGap;
      const startX=CX-totalW/2;

      // Wick progress — already at 0.3 at frame 0, reaches 1.0 by u=4
      const wickProgress=clamp(0.3+u*0.175, 0, 1.0);
      const wickTopY=500;
      const wickBottomTarget=baseY+60;
      const wickCurrentY=lerp(wickTopY, wickBottomTarget, wickProgress);

      for(let i=0;i<5;i++){
        const bx=startX+i*(barW+barGap);
        const bh=barHeights[i]+4*Math.sin(u*1.6-i*0.7);
        const by=baseY-bh;
        // Bar turns grey when wick reaches it
        const barMidY=by+bh/2;
        const hit=wickCurrentY > barMidY;
        const hitFade=hit ? clamp((wickCurrentY-barMidY)/60, 0, 1) : 0;
        const col=hitFade>0.5 ? DEAD : YOU;
        const opac=hit ? lerp(1, 0.5, hitFade) : 1;
        bar(bx, by, barW, bh, col, opac);
      }

      // The wick — thick vertical line plunging down
      bar(CX-4, wickTopY, 8, wickCurrentY-wickTopY, INK, 0.95, 0);
      // Wick tip — small triangle/diamond effect via ring
      ring(CX, wickCurrentY, 8+3*Math.sin(u*4.2), INK, 0.8);

      // Ground line
      bar(startX-40, baseY, totalW+80, 4, INK, 0.6, 0);

      flushAll();
    }

    // ═══ S2 — FLASHBACK : les ordres étaient placés AVANT la hausse ═══
    // Petits blocs gris sous le range, invisibles pendant la montée. Ils attendaient.
    function s2(lf,t,s){
      const u=t-s; resetAll(); hideQ(); hideCaps();

      // The price range — two horizontal lines
      const rangeTop=700, rangeBot=1050;
      bar(200, rangeTop, 680, 4, INK, 0.7, 0);
      bar(200, rangeBot, 680, 4, INK, 0.7, 0);
      putCap(capB,'THE RALLY',CX, rangeTop-30, YOU, 1);

      // 5 daily bars inside the range (the rally, faded now)
      const barW=80, barGap=16;
      const totalW=5*barW+4*barGap;
      const startX=CX-totalW/2;
      for(let i=0;i<5;i++){
        const bx=startX+i*(barW+barGap);
        const bh=60+i*30+3*Math.sin(u*1.4-i*0.5);
        bar(bx, rangeBot-bh, barW, bh, YOU, 0.3);
      }

      // Hidden orders BELOW the range — appearing one by one
      const orderY=rangeBot+80;
      const orders=[
        {x:260, w:90, delay:0.4},
        {x:390, w:70, delay:0.9},
        {x:500, w:100, delay:1.4},
        {x:640, w:80, delay:1.9},
        {x:760, w:60, delay:2.4},
      ];
      for(const o of orders){
        const ap=clamp((u-o.delay)/0.5, 0, 1);
        const h=30+5*Math.sin(u*2.1);
        bar(o.x, orderY+6*Math.sin(u*1.8), o.w, h, DEAD, ap*0.8);
      }

      putCap(capC,'ORDERS PLACED BEFORE THE RALLY',CX, orderY+80, DEAD, clamp((u-1.5)/0.6,0,1));
      putCap(capD,'WAITING',CX, orderY+120, DEAD, clamp((u-2.5)/0.6,0,1)*(.5+.3*Math.sin(u*3)));

      flushAll();
    }

    // ═══ S3 — LES STOPS DEVIENNENT DU CARBURANT ═══
    // Petits blocs teal (stops) sous le range, qui passent au gris en cascade quand la mèche passe.
    function s3(lf,t,s){
      const u=t-s; resetAll(); hideQ(); hideCaps();

      putCap(capA,'EVERY STOP BECAME FUEL',CX, 660, INK, clamp(u/0.6,0,1));

      // Stops clustered below — cascade consumption
      const baseY=900, stopW=60, stopH=35;
      const stops=[
        {x:240, y:baseY},
        {x:340, y:baseY+10},
        {x:440, y:baseY-5},
        {x:540, y:baseY+15},
        {x:640, y:baseY+5},
        {x:740, y:baseY-10},
        {x:300, y:baseY+60},
        {x:480, y:baseY+55},
        {x:620, y:baseY+70},
      ];

      // Wick sweeps left to right across the stops
      const sweepX=lerp(200, 820, clamp(u/4.0, 0, 1));

      for(let i=0;i<stops.length;i++){
        const st=stops[i];
        const consumed=(st.x < sweepX);
        const burnF=consumed ? clamp((sweepX-st.x)/80, 0, 1) : 0;
        const col=burnF>0.5 ? DEAD : YOU;
        const shake=consumed ? 3*Math.sin(u*8-i*2)*(1-burnF) : 0;
        const opac=consumed ? lerp(1, 0.4, burnF) : 0.9;
        const breath=3*Math.sin(u*1.9-i*0.6);
        bar(st.x-stopW/2+shake, st.y+breath, stopW, stopH, col, opac);
      }

      // The wick (vertical line sweeping down)
      const wickX=clamp(sweepX, 240, 740);
      bar(wickX-3, 720, 6, 250+20*Math.sin(u*2.3), INK, 0.85, 0);

      putCap(capC,'ONE SECOND FLAT',CX, 1140, DEAD, clamp((u-2.5)/0.6,0,1));

      flushAll();
    }

    // ═══ S4 — LES STOPS SONT PARTIS : un gros bloc se remplit en bas ═══
    // Un gros bloc teal apparaît en bas — il vient de se remplir grâce aux stops liquidés.
    function s4(lf,t,s){
      const u=t-s; resetAll(); hideQ(); hideCaps();

      // Empty space where the stops were — ghost outlines
      const baseY=900, stopW=60, stopH=35;
      const ghosts=[
        {x:240, y:baseY}, {x:340, y:baseY+10}, {x:440, y:baseY-5},
        {x:540, y:baseY+15}, {x:640, y:baseY+5}, {x:740, y:baseY-10},
      ];
      for(let i=0;i<ghosts.length;i++){
        const g=ghosts[i];
        const fadeOut=clamp((u-0.5-i*0.15)/0.8, 0, 1);
        bar(g.x-stopW/2, g.y, stopW, stopH, DEAD, (1-fadeOut)*0.3);
      }

      putCap(capB,'STOPS ARE GONE',CX, 800, DEAD, clamp(u/0.5,0,1));

      // Big order block appearing at the bottom
      const blockY=1100, blockW=320, blockH=140;
      const growF=eOut(clamp((u-1.2)/1.5, 0, 1));
      const currentH=blockH*growF+6*Math.sin(u*1.7);
      bar(CX-blockW/2, blockY+blockH-currentH, blockW, currentH, YOU, 0.9);

      // Arrow from where stops were → down to the big block
      if(u>1.8){
        const arrowOp=clamp((u-1.8)/0.6, 0, 1);
        path([[CX,baseY+50],[CX,blockY-10]], INK, arrowOp*0.7, 4);
        // Arrowhead
        ring(CX, blockY-10, 6, INK, arrowOp*0.7);
      }

      putCap(capC,'THEIR PROTECTION',CX, 1280, DEAD, clamp((u-2.0)/0.6,0,1));
      putCap(capD,'BECAME SOMEONE ELSE\'S ENTRY',CX, 1330, YOU, clamp((u-2.8)/0.6,0,1));

      flushAll();
    }

    // ═══ S5 — LA MÈCHE COMME REÇU + CTA ═══
    function s5(lf,t,s){
      const u=t-s; resetAll(); hideQ(); hideCaps();

      // The wick stands alone — tall, vertical, like a receipt
      const wickTop=600, wickBot=1150;
      const wickH=(wickBot-wickTop)+8*Math.sin(u*1.4);
      bar(CX-5, wickTop, 10, wickH, INK, 1, 0);

      // Small teal dot at the bottom (the filled order)
      ring(CX, wickBot+30, 14+3*Math.sin(u*2.1), YOU, 0.9);

      // Receipt lines — small horizontal dashes on each side of the wick
      for(let i=0;i<4;i++){
        const ry=wickTop+80+i*120;
        const dashOp=clamp((u-0.3-i*0.3)/0.4, 0, 1);
        bar(CX-80, ry, 60, 3, DEAD, dashOp*0.5, 0);
        bar(CX+20, ry, 60, 3, DEAD, dashOp*0.5, 0);
      }

      putCap(capA,'WICKS ARE NOT NOISE',CX, 1260, INK, clamp((u-1.0)/0.7,0,1));
      putCap(capB,'THEY ARE RECEIPTS',CX, 1310, INK, clamp((u-1.6)/0.7,0,1));
      putCap(capF,'FOLLOW @KONGRAVE_',CX, 1420, YOU, clamp((u-2.6)/0.7,0,1));

      flushAll();
    }

    const RENDER={s1,s2,s3,s4,s5};const SCENEFN=SPEC.map(s=>RENDER[s.id]||s1);
    const clock={t:0};
    function sceneAt(t){let i=0;for(let k=0;k<SC.length;k++){if(t>=SC[k].s-1e-6)i=k;}return Math.min(i,SCENEFN.length-1);}
    function render(){const t=clock.t;const i=sceneAt(t);const lf=clamp((t-SC[i].s)/SC[i].d,0,1);SCENEFN[i](lf,t,SC[i].s);}
    const tl=gsap.timeline({paused:true});
    tl.to(clock,{t:TOTAL,duration:TOTAL,ease:'none',onUpdate:render},0);
    tl.to(SVG,{opacity:1,duration:0.001},TOTAL-0.001);
    window.__timelines=window.__timelines||{};window.__timelines['main']=tl;
  </script>
</body>
</html>
