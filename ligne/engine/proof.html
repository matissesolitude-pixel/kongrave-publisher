<!doctype html>
<html lang="en" data-resolution="portrait" data-fps="30">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flubber@0.4.2/build/flubber.min.js"></script>
  <style>
    :root{--paper:#F2EFE7;--ink:#20242A;--you:#1E5F6E;--them:#8A5323;}
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
    #stage{position:absolute;inset:0} svg{position:absolute;inset:0;width:1080px;height:1920px}
    .ln{fill:none;stroke:var(--ink);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
    .you{stroke:var(--you)} .them{stroke:var(--them)}
    .lab{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:44px;letter-spacing:1px;text-transform:uppercase;fill:var(--ink)}
    .lab.you{fill:var(--you)} .lab.them{fill:var(--them)}
    .head{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:66px;letter-spacing:1px;text-transform:uppercase;fill:var(--ink)}
  </style>
</head>
<body>
  <!-- PREUVE v2 : le "?" est un vrai "?" (même police), son POINT est la balle. La balle est un
       CAMÉLÉON : elle SE TRANSFORME (morph) en chart de prix, agit, puis redevient balle. -->
  <div id="stage" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="1">
    <svg id="svg" viewBox="0 0 1080 1920"></svg>
  </div>
  <script>
    const SC=__SCENES__, TOTAL=__TOTAL__, WORDS=__WORDS__;
    const NS='http://www.w3.org/2000/svg', SVG=document.getElementById('svg');
    function wt(i,nd,fb){nd=String(nd).toLowerCase();for(const w of(WORDS[i]||[])){const t=w.w.toLowerCase().replace(/[^a-z0-9]/g,'');if(t===nd||t.startsWith(nd))return SC[i].s+w.s;}return SC[i].s+(fb==null?0.1:fb)*SC[i].d;}
    function W(i,tok,fb){return tok==null?SC[i].s+(fb==null?0.1:fb)*SC[i].d:wt(i,tok,fb);}
    function at(i,f){return SC[i].s+f*SC[i].d;} function vend(i){return SC[i].s+SC[i].v;}
    function mk(tag,a,cls){const e=document.createElementNS(NS,tag);if(cls)e.setAttribute('class',cls);for(const k in(a||{}))e.setAttribute(k,a[k]);e.setAttribute('opacity','0');SVG.appendChild(e);return e;}
    function arm(el){const L=el.getTotalLength();el.style.strokeDasharray=L;el.style.strokeDashoffset=L;el.__L=L;}
    function draw(el,t,dur,e){tl.set(el,{autoAlpha:1},t);tl.fromTo(el,{strokeDashoffset:el.__L},{strokeDashoffset:0,duration:dur,ease:e||'power1.inOut'},t);}
    function lab(txt,x,y,cls){const e=mk('text',{x,y,'text-anchor':'middle'},'lab'+(cls?' '+cls:''));e.textContent=txt;return e;}
    function head(txt,x,y){const e=mk('text',{x,y,'text-anchor':'middle'},'head');e.textContent=txt;return e;}
    // morph d'un <path> de son d courant vers targetD (flubber) sur la timeline
    function morph(el,fromD,toD,t,dur,ease){const it=flubber.interpolate(fromD,toD,{maxSegmentLength:6});const o={p:0};
      tl.to(o,{p:1,duration:dur,ease:ease||'power2.inOut',onUpdate:function(){el.setAttribute('d',it(o.p));}},t); return t+dur;}
    // primitives-paths pour le morph
    function circleD(cx,cy,r){const k=0.5523*r;return `M ${cx} ${cy-r} C ${cx+k} ${cy-r} ${cx+r} ${cy-k} ${cx+r} ${cy} C ${cx+r} ${cy+k} ${cx+k} ${cy+r} ${cx} ${cy+r} C ${cx-k} ${cy+r} ${cx-r} ${cy+k} ${cx-r} ${cy} C ${cx-r} ${cy-k} ${cx-k} ${cy-r} ${cx} ${cy-r} Z`;}
    function rectD(cx,cy,w,h){const x=cx-w/2,y=cy-h/2;return `M ${x} ${y} L ${x+w} ${y} L ${x+w} ${y+h} L ${x} ${y+h} Z`;}
    const tl=gsap.timeline({paused:true});
    const CX=540;

    // ===== LA BALLE, protagoniste. Rendue comme un <path> pour pouvoir SE TRANSFORMER. =====
    const ball=mk('path',{d:circleD(CX,250,20)},null); ball.setAttribute('fill','var(--you)');

    /* ---------- S0 : la question ; le "?" est un vrai "?", son POINT est la balle ---------- */
    (function question(){
      const i=0, q='WHAT REALLY DECIDES YOUR LOSS?';
      const words=q.replace(/\?$/,'').split(' ');
      const FS=64, chW=FS*0.62, GAP=1.7, maxW=930, lineH=108, slot=w=>(w.length+GAP)*chW;
      const rows=[[]]; let rw=0; words.forEach(w=>{const ww=slot(w);if(rw+ww>maxW&&rows[rows.length-1].length){rows.push([]);rw=0;}rows[rows.length-1].push(w);rw+=ww;});
      const yc=900, y0=yc-(rows.length*lineH)/2;   // TITRE SEUL -> centré (plus bas)
      const wEls=[]; let lastY=y0,lastR=CX;
      rows.forEach((ln,li)=>{const ws=ln.map(slot),tot=ws.reduce((a,b)=>a+b,0);let x=CX-tot/2;
        ln.forEach((w,ci)=>{const cx=x+ws[ci]/2;const e=mk('text',{x:cx,y:y0+li*lineH,'text-anchor':'middle'},'head');e.style.fontSize=FS+'px';e.textContent=w;gsap.set(e,{scale:0.82,transformOrigin:'50% 50%'});wEls.push(e);x+=ws[ci];});
        if(li===rows.length-1){lastY=y0+li*lineH;lastR=CX+tot/2;}});
      // vrai "?" en TEXTE (même police, même graisse) ; la balle = son point
      const qx=lastR+46;
      const qm=mk('text',{x:qx,y:lastY,'text-anchor':'middle'},'head'); qm.style.fontSize='96px'; qm.textContent='?';
      gsap.set(qm,{scale:0.6,transformOrigin:'50% 50%'});
      const vw=WORDS[i]||[];
      wEls.forEach((e,k)=>{const t=vw[k]!=null?SC[i].s+vw[k].s:at(i,0.05+k*0.1);tl.to(e,{autoAlpha:1,scale:1,duration:0.16,ease:'back.out(2)'},t);});
      // le "?" apparaît sur le dernier mot ; LA BALLE apparaît EN MÊME TEMPS, au point du "?"
      const tQ=W(i,'loss',0.72), dotX=qx-2, dotY=lastY+6;
      tl.to(qm,{autoAlpha:1,scale:1,duration:0.28,ease:'back.out(2)'},tQ);
      tl.set(ball,{attr:{d:circleD(dotX,dotY,17)},autoAlpha:1},tQ+0.02);
      // la question se rétracte ; le "?" s'efface ; LA BALLE (le point) RESTE et descend au centre
      const tGo=at(i,0.9);
      wEls.forEach((e,k)=>tl.to(e,{autoAlpha:0,scale:0.15,duration:0.3,ease:'power2.in'},tGo+0.01*k));
      tl.to(qm,{autoAlpha:0,duration:0.28,ease:'power2.in'},tGo+0.08);
      tl.to(ball,{attr:{d:circleD(CX,760,20)},duration:0.55,ease:'power2.inOut'},tGo+0.12);
    })();

    /* ---------- S1 : la balle SE TRANSFORME en chart de prix (le prix, c'est elle) ---------- */
    (function becomeChart(){
      const i=1, baseY=760;
      // la balle (path circle) MORPHE en une bougie (corps de chandelier)
      const tM=W(i,'price',0.15);
      morph(ball,circleD(CX,baseY,20),rectD(CX,baseY,46,150),tM,0.5,'power3.inOut');
      // puis le reste du chart se dessine AUTOUR (la balle est devenue la 1re bougie)
      const chartY=baseY;
      const candles=[]; const xs=[CX-150,CX-75,CX+75,CX+150];
      xs.forEach((x,k)=>{const up=k%2===0; const bh=70+ (k*14);
        const c=mk('rect',{x:x-16,y:chartY-bh/2,width:32,height:bh,rx:3},null); c.setAttribute('fill', up?'var(--you)':'var(--them)'); candles.push(c);});
      const t2=tM+0.5;
      candles.forEach((c,k)=>tl.fromTo(c,{autoAlpha:0,scaleY:0,transformOrigin:'50% 50%'},{autoAlpha:1,scaleY:1,duration:0.3,ease:'back.out(1.5)'},t2+0.12*k));
      const cl=lab('THE PRICE — THIS IS YOU',CX,baseY+140,'you'); tl.to(cl,{autoAlpha:1,duration:0.35},W(i,'you',0.6));
      // purge des bougies voisines (la balle-bougie, elle, continue en S2)
      tl.to([cl,...candles],{autoAlpha:0,duration:0.35},vend(i));
    })();

    /* ---------- S2 : la balle-prix TOMBE ; sans ligne -> zéro ; une ligne -> elle décide ---------- */
    (function decide(){
      const i=2, topY=760, stopY=1040;
      // la balle-bougie redevient une balle nette pour agir
      morph(ball,rectD(CX,topY,46,150),circleD(CX,topY,20),at(i,0.0),0.4,'power2.inOut');
      // LA BALLE ÉMET SA LIGNE : un stop se dessine sous elle (SA décision)
      const tLine=W(i,'draw',0.38);
      const stop=mk('path',{d:`M 250 ${stopY} L 830 ${stopY}`},'ln you'); stop.style.strokeWidth='12'; arm(stop);
      draw(stop,tLine,0.5,'power2.out');
      const sL=lab('THE LINE YOU DREW',CX,stopY+54,'you'); tl.to(sL,{autoAlpha:1,duration:0.3},tLine+0.3);
      // le marché tourne : la balle chute et HEURTE la ligne, rebondit, TIENT
      const tFall=W(i,'decide',0.6);
      tl.to(ball,{attr:{d:circleD(CX,stopY-22,20)},duration:0.44,ease:'power4.in'},tFall)
        .to(ball,{attr:{d:circleD(CX,stopY-70,20)},duration:0.16,ease:'power2.out'})
        .to(ball,{attr:{d:circleD(CX,stopY-22,20)},duration:0.18,ease:'power2.in'});
      const okL=lab('YOU SURVIVE — 1%',CX,topY-40,'you'); gsap.set(okL,{scale:0.7,transformOrigin:'50% 50%'});
      tl.to(okL,{autoAlpha:1,scale:1,duration:0.35,ease:'back.out(1.8)'},tFall+0.5);
      const vL=head('THE LINE IS THE DECISION',CX,1320); gsap.set(vL,{scale:0.8,transformOrigin:'50% 50%'});
      tl.to(vL,{autoAlpha:1,scale:1,duration:0.4,ease:'back.out(1.7)'},W(i,'wrong',0.85));
    })();

    tl.to(SVG,{opacity:1,duration:0.001},TOTAL-0.001);
    window.__timelines=window.__timelines||{}; window.__timelines['main']=tl;
  </script>
</body>
</html>
