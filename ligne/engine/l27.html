<!doctype html>
<html lang="en" data-resolution="portrait" data-fps="30">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>:root{--paper:#F2EFE7}*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}#stage{position:absolute;inset:0}svg{position:absolute;inset:0;width:1080px;height:1920px}</style>
</head>
<body>
  <!-- L27 « TWO WINS, ONE HABIT » (reproduction badlabels — putCap MESURÉ copié de l26, toutes les étiquettes
       replacées en zone VIDE, dans le cadre, jamais dans la colonne d'un objet). S1 : émotion frame 0 = levier
       CURIOSITÉ — le GAIN teal brille déjà, net ; ce sur quoi il repose est noyé sous une ombre mouvante : d'où
       vient-il ? S2 : la grille décision × résultat, colonnes écartées (GOOD gauche cx330 / BAD droite cx750),
       deux cases PIÈGES pulsent, une pièce fil-de-fer tourne dans la gouttière centrale. S3 : le gain d'une
       mauvaise décision est mal RANGÉ — la flèche dévie du tiroir LUCK vers le tiroir SKILL, et une HABITUDE se
       bâtit au centre sur un socle de chance gris fissuré (étiquettes LUCK/SKILL dans leurs tiroirs, BUILT ON LUCK
       à gauche, A HABIT à droite, hors des colonnes). S4 : diptyque — mauvais mois (compte gris qui baisse mais
       process teal qui se renforce) vs bon mois de chance (compte teal qui monte pendant que le process se
       fissure). S5 : décharge — MÊME gain, deux socles côte à côte : solide teal (mérité, survit) vs chance grise
       fissurée (la facture vient plus tard) ; la question « mille fois ? » monte en faisceau et révèle le socle.
       Doctrine : aucun chiffre ; gris = chance instable / perte ; pas de brun ; la pièce est fil-de-fer ; bas du
       cadre vide. -->
  <div id="stage" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="1"><svg id="svg" viewBox="0 0 1080 1920"></svg></div>
  <script>
    const TOTAL=__TOTAL__, SC=__SCENES__, SPEC=__SPEC__;
    const NS='http://www.w3.org/2000/svg', SVG=document.getElementById('svg');
    const YOU='#1E5F6E', INK='#20242A', PAPER='#F2EFE7', DEAD='#474D50';
    const CX=540;
    function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in(a||{}))e.setAttribute(k,a[k]);(p||SVG).appendChild(e);return e;}
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,f)=>a+(b-a)*clamp(f,0,1),eIn=f=>f*f,eOut=f=>1-(1-f)*(1-f),eInOut=f=>f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
    const backOut=(p,s)=>{s=(s==null?1.9:s);const q=clamp(p,0,1)-1;return 1+(s+1)*q*q*q+s*q*q;};
    const setOp=(el,o)=>el.setAttribute('opacity',clamp(o,0,1).toFixed(3));

    // ── LE GAIN (bloc teal) + LUEUR + SON SOCLE + L'OMBRE + LES FISSURES ──
    const winMain=mk('rect',{rx:8,fill:YOU,opacity:0});
    const glowMain=mk('ellipse',{fill:YOU,'fill-opacity':0.15,opacity:0});
    const shade=mk('rect',{fill:DEAD,'fill-opacity':0.30,rx:10,opacity:0});
    const base3=mk('rect',{rx:6,opacity:0});
    const cracks=[]; for(let i=0;i<4;i++)cracks.push(mk('polyline',{fill:'none',stroke:PAPER,'stroke-width':5,'stroke-linejoin':'round',opacity:0}));
    function setBlock(el,cx,cy,sc,op){const w=330*sc,h=165*sc;el.setAttribute('x',(cx-w/2).toFixed(1));el.setAttribute('y',(cy-h/2).toFixed(1));
      el.setAttribute('width',w.toFixed(1));el.setAttribute('height',h.toFixed(1));setOp(el,op);}
    function setGlow(el,cx,cy,rx,ry,op){el.setAttribute('cx',cx.toFixed(1));el.setAttribute('cy',cy.toFixed(1));el.setAttribute('rx',rx.toFixed(1));el.setAttribute('ry',ry.toFixed(1));setOp(el,op);}
    function setBaseRect(el,cx,top,w,h,col,op){el.setAttribute('x',(cx-w/2).toFixed(1));el.setAttribute('y',top.toFixed(1));
      el.setAttribute('width',w.toFixed(1));el.setAttribute('height',h.toFixed(1));el.setAttribute('fill',col);setOp(el,op);}
    function setCracks(cx,top,op){for(let i=0;i<cracks.length;i++){const x=cx-95+i*62, y=top+16;
      cracks[i].setAttribute('points',`${x},${y} ${x+18},${y+42} ${x-8},${y+80} ${x+14},${y+116}`);setOp(cracks[i],op);}}
    // FLOTTEMENT ÉPICYCLIQUE (deux cercles superposés) : vitesse jamais nulle → l'objet le plus contrasté ne
    // se fige JAMAIS entre deux frames (le bob à deux harmoniques, lui, s'annule à certains instants → point mort).
    function epi(u,ph){return [11*Math.sin(u*2.3+ph)+5*Math.sin(u*1.4+ph+1.0), 11*Math.cos(u*2.3+ph)+5*Math.cos(u*1.4+ph+1.0)];}

    // ── S2 : LA GRILLE DÉCISION × RÉSULTAT + LA PIÈCE ──
    const CELLS=[]; for(let i=0;i<4;i++)CELLS.push(mk('rect',{width:230,height:150,rx:8,fill:'none',stroke:INK,'stroke-width':5,opacity:0}));
    const FILLS=[]; for(let i=0;i<4;i++)FILLS.push(mk('rect',{width:230,height:150,rx:8,fill:YOU,'fill-opacity':0.22,opacity:0}));
    const coin=mk('ellipse',{fill:'none',stroke:INK,'stroke-width':6,opacity:0});
    function hideGrid(){for(const e of CELLS)setOp(e,0);for(const e of FILLS)setOp(e,0);setOp(coin,0);}

    // ── S3 : LES DEUX TIROIRS + LA FLÈCHE DE CLASSEMENT + L'HABITUDE ──
    const drawerL=mk('rect',{x:175,y:890,width:280,height:100,rx:8,fill:'none',stroke:INK,'stroke-width':5,opacity:0});
    const drawerR=mk('rect',{x:625,y:890,width:280,height:100,rx:8,fill:'none',stroke:INK,'stroke-width':5,opacity:0});
    const fileArrow=mk('line',{stroke:INK,'stroke-width':6,'stroke-linecap':'round',opacity:0});
    const arrowHead=mk('polygon',{fill:INK,opacity:0});
    const HABIT=[]; for(let i=0;i<4;i++)HABIT.push(mk('rect',{width:230,height:44,rx:5,fill:INK,stroke:PAPER,'stroke-width':3,opacity:0}));
    function hideS3(){setOp(drawerL,0);setOp(drawerR,0);setOp(fileArrow,0);setOp(arrowHead,0);for(const h of HABIT)setOp(h,0);}

    // ── S4 : LE DIPTYQUE (compte + process) ──
    const barL=mk('rect',{width:150,rx:5,opacity:0}), barR=mk('rect',{width:150,rx:5,opacity:0});
    const procL=mk('rect',{width:150,rx:5,fill:YOU,opacity:0}), procR=mk('rect',{width:150,rx:5,fill:DEAD,opacity:0});
    const conf=mk('ellipse',{fill:YOU,'fill-opacity':0.15,opacity:0});
    function hideS4(){for(const e of [barL,barR,procL,procR,conf])setOp(e,0);}

    // ── S5 : DEUX ISSUES (même gain, deux socles) + LE FAISCEAU DE LA QUESTION ──
    const winL=mk('rect',{rx:8,fill:YOU,opacity:0}), winR=mk('rect',{rx:8,fill:YOU,opacity:0});
    const glowL=mk('ellipse',{fill:YOU,'fill-opacity':0.14,opacity:0}), glowR=mk('ellipse',{fill:YOU,'fill-opacity':0.14,opacity:0});
    const baseL=mk('rect',{rx:6,opacity:0}), baseR=mk('rect',{rx:6,opacity:0});
    const beam=mk('polygon',{fill:YOU,'fill-opacity':0.15,opacity:0});
    function hideS5(){for(const e of [winL,winR,glowL,glowR,baseL,baseR,beam])setOp(e,0);}

    // ── QUESTION (§M15) — 1re ligne pleine dès la frame 0 ──
    const QLINES=['DID YOU WIN','OR DID YOU GET LUCKY'];
    const FS=68,lineH=94,y0=210,qY=QLINES.map((s,li)=>y0+li*lineH);
    const qEls=QLINES.map((s,li)=>{const e=mk('text',{x:CX,y:qY[li],'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':FS,'letter-spacing':'1',opacity:0});e.textContent=s;return e;});
    const QMY=y0+2*lineH+92,qMark=mk('text',{x:CX,y:QMY,'text-anchor':'middle',fill:INK,'font-family':'Helvetica Neue, Arial, sans-serif','font-weight':800,'font-size':150,opacity:0});qMark.textContent='?';
    // AUTO-AJUSTEMENT de la question : une ligne trop longue est réduite pour tenir dans le cadre.
    qEls.forEach(e=>{const t=e.textContent,f=Math.min(FS,930/Math.max(1,t.length*0.66));e.setAttribute('font-size',f.toFixed(1));});
    function hideQ(){for(const e of qEls)setOp(e,0);setOp(qMark,0);}

    // ── ÉTIQUETTES (§M18) ──
    function caption(sz){return mk('text',{'text-anchor':'middle','font-family':'Helvetica Neue, Arial, sans-serif','font-weight':(sz>44?800:700),'font-size':(sz||36),'data-fs':(sz||36),'letter-spacing':'1.5',opacity:0});}
    const capA=caption(40),capB=caption(44),capC=caption(36),capD=caption(36),capE=caption(34),capF=caption(34);
    function putCap(el,txt,cx,y,color,op){
      // MESURE réelle (getComputedTextLength inclut le letter-spacing, que l'ancienne estimation
      // ignorait — cause du débordement live sur L23/L25). On réduit la police tant que le texte
      // dépasse la zone sûre, puis on borne le CENTRE par la demi-largeur MESURÉE : un texte ne
      // peut PLUS être coupé au bord. NB : ça ne gère PAS le recouvrement d'un dessin — c'est au
      // placement (cx, y) de viser une zone vide (voir doctrine « voies libres »).
      const MARGIN=70, MAXW=1080-2*MARGIN;
      if(el.__cap!==txt){ el.__cap=txt; el.textContent=txt;
        const nom=+el.getAttribute('data-fs')||+el.getAttribute('font-size')||38;
        el.setAttribute('font-size',nom);
        let w=el.getComputedTextLength()||0;
        if(!w) w=txt.length*nom*0.72;   // repli si la mesure échoue : estimation LARGE (>0.66) — jamais pire qu'avant
        if(w>MAXW){ const fs=Math.max(18,nom*MAXW/w); el.setAttribute('font-size',fs.toFixed(1)); w=el.getComputedTextLength()||txt.length*fs*0.72; }
        el.__hw=w/2;
      }
      const x=clamp(+cx, MARGIN+el.__hw, 1080-MARGIN-el.__hw);
      el.setAttribute('x',x.toFixed(1));el.setAttribute('y',y);el.setAttribute('fill',color);setOp(el,op);}
    function hideCaps(){for(const e of [capA,capB,capC,capD,capE,capF])setOp(e,0);}
    function hideCore(){for(const e of [winMain,glowMain,shade,base3])setOp(e,0);for(const c of cracks)setOp(c,0);}

    // ═══ S1 — LE GAIN BRILLE, SON SOCLE EST DANS L'OMBRE ═══
    // Verbe visuel : l'énigme du dessous (ce qui porte le gain reste caché).
    function s1(lf,t,s){
      const u=t-s; hideCaps(); hideGrid(); hideS3(); hideS4(); hideS5(); setOp(base3,0); for(const c of cracks)setOp(c,0);
      const gf=clamp(1-(lf-0.82)/0.10,0,1);
      for(let k=0;k<qEls.length;k++){const qt=(k===0?0.18:u-(0.1+k*0.28)),ap=clamp(qt/0.18,0,1),sc=0.7+0.3*backOut(ap);setOp(qEls[k],ap*gf);qEls[k].setAttribute('transform',`translate(${(CX*(1-sc)).toFixed(2)} ${(qY[k]*(1-sc)).toFixed(2)}) scale(${sc.toFixed(3)})`);}
      const qm=u-0.9,qap=clamp(qm/0.2,0,1),qsc=0.6+0.4*backOut(qap);setOp(qMark,qap*gf);qMark.setAttribute('transform',`translate(${(CX*(1-qsc)).toFixed(2)} ${(QMY*(1-qsc)).toFixed(2)}) scale(${qsc.toFixed(3)})`);
      // ── ÉMOTION FRAME 0 (levier CURIOSITÉ) : le gain est DÉJÀ posé et brillant, et l'ombre qui masque son
      //    socle est DÉJÀ là, mouvante. Rien ne se construit : l'énigme est entière dès la première frame.
      const [fx,fy]=epi(u,0);
      setBlock(winMain,CX+fx,930+fy,1,1);
      setGlow(glowMain,CX+fx,930+fy,215+16*Math.sin(u*1.8)+7*Math.sin(u*2.9),120+11*Math.sin(u*1.8)+5*Math.sin(u*2.9),1);
      // 'A WIN' au-dessus du bloc (gouttière, jamais par-dessus le dessin), teal sur papier ; suit le flottement
      putCap(capA,'A WIN',CX+fx,820+fy,YOU,1);
      // l'ombre qui masque le socle : elle glisse et respire (deux harmoniques), on ne voit jamais dessous
      const sw=430+34*Math.sin(u*0.9)+14*Math.sin(u*1.9), sx=CX+13*Math.sin(u*1.15)+6*Math.sin(u*2.15);
      setBaseRect(shade,sx,1040+fy*0.35,sw,210+9*Math.sin(u*1.5)+4*Math.sin(u*2.6),DEAD,1);
      putCap(capC,'WHAT IS IT STANDING ON',CX,1350,DEAD,clamp((u-1.7)/0.7,0,1)*gf);
    }

    // ═══ S2 — DÉCISION × RÉSULTAT : les deux cases pièges ═══
    // Verbe visuel : la grille (quatre issues, deux qui trompent) + la pièce qui tourne.
    function s2(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideCore(); hideS3(); hideS4(); hideS5();
      const GX=[215,635], GY=[780,955], W=230, H=150;            // colonnes écartées : gauche cx330, droite cx750
      const cxCol=[GX[0]+W/2,GX[1]+W/2];                         // 330 / 750
      const TRAP=[1,2];                                          // bad décision → WIN (droite-haut) ; good décision → LOSS (gauche-bas)
      for(let i=0;i<4;i++){const c=i%2, r=Math.floor(i/2);
        const yy=GY[r]+3*Math.sin(u*1.45-i*0.8)+1.6*Math.sin(u*2.6+i);
        CELLS[i].setAttribute('x',GX[c]);CELLS[i].setAttribute('y',yy.toFixed(1));setOp(CELLS[i],1);
        FILLS[i].setAttribute('x',GX[c]);FILLS[i].setAttribute('y',yy.toFixed(1));
        const trap=TRAP.includes(i);
        setOp(FILLS[i], trap ? clamp((u-1.8)/0.6,0,1)*(0.55+0.45*Math.abs(Math.sin(u*1.9))) : clamp((u-0.6)/0.6,0,1)*0.35);}
      // en-têtes colonnes : chacune dans SA moitié (gauche ≤380, droite ≥700), au-dessus de la grille
      putCap(capC,'GOOD DECISION',cxCol[0],740,INK,1);
      putCap(capD,'BAD DECISION',cxCol[1],740,INK,1);
      // en-têtes lignes : gouttière gauche, hors des cases
      putCap(capE,'WIN',130,GY[0]+H/2+12,YOU,1);
      putCap(capF,'LOSS',130,GY[1]+H/2+12,DEAD,1);
      // la pièce tourne dans la gouttière centrale (x 445-635) : le hasard court terme, jamais au repos
      const rx=10+50*Math.abs(Math.cos(u*2.4));
      coin.setAttribute('cx',CX);coin.setAttribute('cy',(945+9*Math.sin(u*1.7)+4*Math.sin(u*2.7)).toFixed(1));
      coin.setAttribute('rx',rx.toFixed(1));coin.setAttribute('ry',54);setOp(coin,1);
      putCap(capB,'ONE TRADE TELLS YOU NOTHING',CX,660,INK,clamp((u-3.4)/0.7,0,1));
      putCap(capA,'THE COIN DECIDES THE SHORT RUN',CX,1210,DEAD,clamp((u-2.4)/0.6,0,1));
    }

    // ═══ S3 — LE MAUVAIS RANGEMENT : la chance classée en compétence ═══
    // Verbe visuel : le classement dans le mauvais tiroir, puis l'habitude qui pousse sur la chance.
    function s3(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideGrid(); hideS4(); hideS5();
      // le gain issu de la mauvaise décision (bloc au-dessus)
      const [fx,fy]=epi(u,0);
      setBlock(winMain,CX+fx,705+fy,0.55,1);
      setGlow(glowMain,CX+fx,705+fy,110+9*Math.sin(u*1.8)+4*Math.sin(u*2.9),64+6*Math.sin(u*1.8)+3*Math.sin(u*2.9),1);
      putCap(capA,'A LUCKY WIN, FILED AS SKILL',CX,610,INK,1);
      // les deux tiroirs
      setOp(drawerL,1);setOp(drawerR,1);
      putCap(capC,'LUCK',315,955,DEAD,1);                        // dans le tiroir gauche (tient dedans)
      putCap(capD,'SKILL',765,955,INK,1);                       // dans le tiroir droit
      // la flèche part vers LUCK puis DÉVIE vers SKILL (le mauvais rangement)
      const swing=eInOut(clamp((u-0.9)/1.0,0,1)), tipx=lerp(315,765,swing), tipy=884;
      fileArrow.setAttribute('x1',(CX+fx).toFixed(1));fileArrow.setAttribute('y1',(748+fy).toFixed(1));
      fileArrow.setAttribute('x2',tipx.toFixed(1));fileArrow.setAttribute('y2',tipy);setOp(fileArrow,clamp(u/0.5,0,1));
      arrowHead.setAttribute('points',`${tipx},${tipy+10} ${tipx-13},${tipy-14} ${tipx+13},${tipy-14}`);setOp(arrowHead,clamp((u-0.2)/0.4,0,1));
      // l'habitude se bâtit AU CENTRE sur le socle de chance (gris, fissuré)
      const built=clamp((u-2.0)/2.2,0,1);
      setBaseRect(base3,CX,1290,250,95,DEAD,clamp((u-1.9)/0.5,0,1));
      setCracks(CX,1290,clamp((u-2.6)/0.6,0,1)*(0.6+0.4*Math.abs(Math.sin(u*1.6))));
      for(let i=0;i<HABIT.length;i++){const p=clamp((built*HABIT.length-i),0,1);
        HABIT[i].setAttribute('x',(CX-115).toFixed(1));HABIT[i].setAttribute('y',(1283-i*52-3*Math.sin(u*1.7-i*0.6)-1.5*Math.sin(u*2.6-i)).toFixed(1));setOp(HABIT[i],p);}
      // deux étiquettes flanquant l'habitude, chacune dans sa moitié, hors de la colonne des briques
      putCap(capE,'BUILT ON LUCK',250,1235,DEAD,clamp((u-3.0)/0.6,0,1));
      putCap(capB,'A HABIT',800,1235,INK,clamp((u-3.2)/0.6,0,1));
    }

    // ═══ S4 — DIPTYQUE : le compte monte pendant que l'habitude pourrit ═══
    // Verbe visuel : la comparaison inversée (ce qui monte à l'écran pourrit en dessous).
    function s4(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideCore(); hideGrid(); hideS3(); hideS5();
      const BASE=1130, LX=290, RX=760, g=clamp(u/3.2,0,1);
      // flottement épicyclique des barres-compte (vitesse jamais nulle → jamais de point mort en tenue)
      const [ax,ay]=epi(u,0.5), [ax2,ay2]=epi(u,2.6);
      // GAUCHE — mauvais mois : le compte baisse (gris), mais le process se RENFORCE (teal)
      const hL=210-90*g, tL=BASE-hL-8*Math.sin(u*1.35)-4*Math.sin(u*2.25)+ay*0.6;
      barL.setAttribute('x',(LX-75+ax*0.6).toFixed(1));barL.setAttribute('y',tL.toFixed(1));barL.setAttribute('height',hL.toFixed(1));barL.setAttribute('fill',DEAD);setOp(barL,1);
      const pL=60+100*g;
      procL.setAttribute('x',LX-75);procL.setAttribute('y',(1170+5*Math.sin(u*1.15)+3*Math.sin(u*2.05)).toFixed(1));procL.setAttribute('height',pL.toFixed(1));setOp(procL,1);
      putCap(capC,'BAD MONTH',LX,680,DEAD,1);
      putCap(capE,'PROCESS EXAMINED',LX,1420,YOU,clamp((u-1.4)/0.6,0,1));
      // DROITE — bon mois de chance : le compte monte (teal), le process se fissure (gris)
      const hR=90+200*g, tR=BASE-hR-8*Math.sin(u*1.35+2)-4*Math.sin(u*2.25+1)+ay2*0.6;
      barR.setAttribute('x',(RX-75+ax2*0.6).toFixed(1));barR.setAttribute('y',tR.toFixed(1));barR.setAttribute('height',hR.toFixed(1));barR.setAttribute('fill',YOU);setOp(barR,1);
      const pR=170-100*g;
      procR.setAttribute('x',RX-75);procR.setAttribute('y',(1170+5*Math.sin(u*1.15+1.7)+3*Math.sin(u*2.05+0.9)).toFixed(1));procR.setAttribute('height',Math.max(30,pR).toFixed(1));setOp(procR,1);
      setCracks(RX,1176,clamp((u-1.6)/0.7,0,1)*(0.6+0.4*Math.abs(Math.sin(u*1.7))));
      setGlow(conf,RX,tR-64,60+80*g+16*Math.sin(u*1.25)+7*Math.sin(u*2.35),34+44*g+9*Math.sin(u*1.25)+4*Math.sin(u*2.35),clamp((u-1.0)/0.6,0,1));
      putCap(capD,'GOOD MONTH — FROM LUCK',RX,680,YOU,1);
      putCap(capF,'PROCESS ROTTING',RX,1420,DEAD,clamp((u-1.8)/0.6,0,1));
      putCap(capB,'THE ACCOUNT GROWS, THE HABIT ROTS',CX,590,INK,clamp((u-2.6)/0.7,0,1));
    }

    // ═══ S5 — DÉCHARGE : même gain, deux socles — la question révèle lequel ═══
    // Verbe visuel : la révélation par en dessous (la lumière montre le socle).
    function s5(lf,t,s){
      const u=t-s; hideQ(); hideCaps(); hideCore(); hideGrid(); hideS3(); hideS4();
      const lit=clamp((u-0.8)/1.1,0,1);
      const LXc=300, RXc=780, wy=850;
      const [lx,ly]=epi(u,0), [rx2,ry2]=epi(u,2.1);
      // MÊME gain, deux fois — flottement épicyclique (vitesse jamais nulle)
      setBlock(winL,LXc+lx,wy+ly,0.5,1); setGlow(glowL,LXc+lx,wy+ly,105+9*Math.sin(u*1.5),60+5*Math.sin(u*1.5),1);
      setBlock(winR,RXc+rx2,wy+ry2,0.5,1); setGlow(glowR,RXc+rx2,wy+ry2,105+9*Math.sin(u*1.5+1),60+5*Math.sin(u*1.5+1),1);
      putCap(capB,'SAME WIN — DIFFERENT BASE',CX,690,INK,clamp((u-0.3)/0.6,0,1));
      // le faisceau de lumière sur les socles (deux harmoniques) — cantonné à la bande des socles,
      // au-dessus des étiquettes : jamais par-dessus un texte.
      const bw=170+22*Math.sin(u*0.95)+10*Math.sin(u*1.85);
      beam.setAttribute('points',`${CX-50},1128 ${CX+50},1128 ${(CX+bw).toFixed(1)},948 ${(CX-bw).toFixed(1)},948`);setOp(beam,lit*0.9);
      // l'ombre initiale sur les deux socles, qui se lève avec la lumière
      setBaseRect(shade,CX,955,760+22*Math.sin(u*0.9),150,DEAD,(1-lit));
      // SOCLE GAUCHE — solide teal (mérité) ; SOCLE DROIT — chance grise fissurée
      setBaseRect(baseL,LXc,975,230,120,YOU,lit);
      setBaseRect(baseR,RXc,975,230,120,DEAD,lit);
      setCracks(RXc,977,lit*(0.6+0.4*Math.abs(Math.sin(u*1.6))));
      // étiquettes des issues, chacune dans sa moitié, sous son socle
      putCap(capC,'EARNED',LXc,1160,YOU,lit);
      putCap(capE,'SURVIVES A BAD RUN',LXc,1218,YOU,clamp((u-1.8)/0.7,0,1));
      putCap(capD,'LUCKY',RXc,1160,DEAD,lit);
      putCap(capF,'THE BILL COMES LATER',RXc,1218,DEAD,clamp((u-1.8)/0.7,0,1));
      // la question qui éclaire, à la base du faisceau (sous sa pointe, jamais par-dessus)
      putCap(capA,'WOULD I DO THIS A THOUSAND TIMES',CX,1360,INK,clamp((u-1.4)/0.7,0,1));
    }

    const RENDER={s1,s2,s3,s4,s5};const SCENEFN=SPEC.map(s=>RENDER[s.id]||s1);
    const clock={t:0};
    function sceneAt(t){let i=0;for(let k=0;k<SC.length;k++){if(t>=SC[k].s-1e-6)i=k;}return Math.min(i,SCENEFN.length-1);}
    function render(){const t=clock.t;const i=sceneAt(t),lf=clamp((t-SC[i].s)/SC[i].d,0,1);SCENEFN[i](lf,t,SC[i].s);}
    const tl=gsap.timeline({paused:true});
    tl.to(clock,{t:TOTAL,duration:TOTAL,ease:'none',onUpdate:render},0);
    tl.to(SVG,{opacity:1,duration:0.001},TOTAL-0.001);
    window.__timelines=window.__timelines||{};window.__timelines['main']=tl;
  </script>
