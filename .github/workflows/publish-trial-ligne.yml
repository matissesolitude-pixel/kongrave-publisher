name: LIGNE Reel d'essai (Trial Reel)

# Publie UN épisode LIGNE en Reel d'ESSAI (visible uniquement des NON-abonnés).
# Sert à MESURER la rétention d'une variante sans l'exposer à l'audience.
#
# Il publie le MASTER VALIDÉ committé dans ligne/trial/<EP>.mp4 (déterministe :
# pas de rebuild cloud, pas de re-génération voix, pas de scan qui varie).
# Transcode en 25 fps (exigence Meta) puis crée un conteneur en mode essai
# (graduation MANUAL par défaut : il ne passe aux abonnés que si TU le gradues).
#
# Réutilisable : commit ligne/trial/<EP>.mp4, puis
#   gh workflow run publish-trial-ligne.yml -f episode=<EP>
#
# Il ne touche NI la file, NI le journal, NI l'état : canal séparé. Rien n'est committé.

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Épisode à publier en essai (master requis dans ligne/trial/<EP>.mp4)"
        required: true
        type: string
      dry_run:
        description: "Dry-run : va jusqu'à FINISHED mais NE PUBLIE PAS"
        type: boolean
        default: false
      graduation:
        description: "Stratégie de graduation"
        type: choice
        options: ["MANUAL", "SS_PERFORMANCE"]
        default: "MANUAL"

concurrency:
  group: ligne-trial
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      GRAPH_VERSION: v21.0          # Trial Reels (trial_params) supporté à partir de v21.0
      EP: ${{ github.event.inputs.episode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Vérifier le master committé
        run: |
          if [ ! -f "ligne/trial/${EP}.mp4" ]; then
            echo "::error::Master introuvable : ligne/trial/${EP}.mp4 (commit-le d'abord)"; exit 1
          fi
          echo "master : ligne/trial/${EP}.mp4 ($(du -h ligne/trial/${EP}.mp4 | cut -f1))"

      - name: Publier en Reel d'ESSAI
        run: |
          ARGS="${EP} --graduation ${{ github.event.inputs.graduation }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "publish_trial_ligne.py $ARGS"
          python3 publish_trial_ligne.py $ARGS

      - name: Rappel
        run: echo "Reel d'essai traité. Aucune mise en file, aucun commit. Visible des non-abonnés uniquement."
