name: KONGRAVE autoprod

# Production autonome d'UN épisode par run (voix + bustes + seg4 + assemblage), puis commit
# dans inbox/ + schedule.json. Le publish.yml (séparé) publiera à la date planifiée.
# Secrets requis : ELEVENLABS_API_KEY, DOMOAI_API_KEY, GEMINI_API_KEY.

on:
  # Réactivé : JSON v3 (éditorial, no follow me), compositing case BD v13, crédits DomoAI OK,
  # cap 3s géré (découpe+concat). Produit ep12+ (1/run, toutes les 4 h) et commit dans inbox.
  schedule:
    - cron: "13 */4 * * *"          # toutes les 4 h (minute 13)
  workflow_dispatch:
    inputs:
      episode:
        description: "Forcer un numéro d'épisode (vide = prochain non produit)"
        required: false

concurrency:
  group: kongrave-autoprod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FFMPEG: /usr/bin/ffmpeg
      FFPROBE: /usr/bin/ffprobe
      # secrets du repo nommés sans _KEY -> mappés vers les noms attendus par le code
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API }}
      DOMOAI_API_KEY: ${{ secrets.DOMOAI_API }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Système (ffmpeg, tesseract, chromium, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr chromium-browser fontconfig fonts-dejavu-core

      - name: Polices (repo -> système, AVANT tout rendu Chromium/ffmpeg)
        run: |
          mkdir -p ~/.local/share/fonts
          cp output/v3/fonts/*.ttf ~/.local/share/fonts/ 2>/dev/null || true
          fc-cache -f >/dev/null 2>&1 || true
          fc-list | grep -i bangers || echo "(Bangers via chemin repo dans PIL, ok)"

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache modèle rembg
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-isnet-anime

      - name: Deps Python
        run: pip install -r requirements-autoprod.txt

      - name: Production (1 épisode)
        run: python autoprod.py
        env:
          FORCE_EPISODE: ${{ github.event.inputs.episode }}

      - name: Commit & push
        run: |
          git config user.name  "kongrave-autoprod"
          git config user.email "autoprod@users.noreply.github.com"
          git add -f inbox/EPISODE_*.mp4 schedule.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau à committer."
          else
            git commit -m "autoprod: nouvel épisode produit [skip ci]"
            git push
          fi
