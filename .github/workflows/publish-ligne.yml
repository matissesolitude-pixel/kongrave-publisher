name: LIGNE auto-publish (file)

# Publie LIGNE depuis une FILE (ligne/queue/), pas un planning : prend le PLUS
# ANCIEN épisode de la file, le publie sur @kongrave_, le déplace en published/.
#
# IL N'Y A PLUS DE FENÊTRE HORAIRE. Le seul garde-fou temporel est la cadence,
# lue dans ligne/config.json — 12 h au 28/08/2026, soit deux publications par
# jour. Le cron ne décide de rien : il ne fait qu'offrir des occasions, et la
# cadence tranche. Ne JAMAIS régler l'intervalle du cron sans lire la cadence
# réelle : avec un cron toutes les 8 h, aucun créneau ne retombait à 12 h
# d'intervalle et le rythme dérivait à 1,5 post par jour au lieu de 2.

on:
  schedule:
    - cron: "30 * * * *"       # TOUTES LES HEURES. GitHub n en declenche qu un sur trois environ ;
                               # multiplier les occasions est la seule parade, et le sondage court-circuite
                               # en 7 secondes, donc depuis le passage en depot public ca ne coute rien.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run : crée le conteneur mais NE PUBLIE PAS, ne déplace pas"
        type: boolean
        default: false
      force:
        description: "Force : ignore la fenêtre horaire ET la cadence"
        type: boolean
        default: false

# Un seul run à la fois (un upload peut être long).
concurrency:
  group: ligne-publish
  cancel-in-progress: false

# Nécessaire pour committer le déplacement queue->published + le journal.
permissions:
  contents: write

jobs:
  # SONDAGE — le job bon marché, celui qui tourne pour rien la plupart du temps.
  # Il ne récupère PAS ligne/published, qui pèse 3,7 Go de masters déjà en ligne :
  # un checkout complet coûtait deux minutes de runner à chaque sondage à vide.
  # Il rejoue les trois premières portes de publish_ligne.py — pause, cadence,
  # file vide — avec le python système, sans rien installer. Le filet Telegram
  # n'est lu qu'APRÈS ces portes dans le script réel : le comportement est donc
  # strictement inchangé, seul le coût tombe.
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.verdict.outputs.go }}
    steps:
      - name: Checkout partiel — config, journal et file seulement
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ligne/config.json
            ligne/publish_log.json
            ligne/precheck.py
            ligne/queue
          sparse-checkout-cone-mode: false

      - name: Court-circuit — pause, cadence, file
        id: verdict
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Force demandé — aucune porte n'est évaluée ici."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          verdict=$(/usr/bin/python3 ligne/precheck.py)
          echo "$verdict"
          case "$verdict" in
            GO*) echo "go=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "go=false" >> "$GITHUB_OUTPUT" ;;
          esac

  # PUBLICATION — le job cher, qui paie le checkout complet. Il ne démarre que
  # lorsque le sondage a dit oui, soit deux fois par jour.
  publish:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Publier le plus ancien épisode de la file
        env:
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GRAPH_VERSION: v20.0
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "publish_ligne.py $ARGS"
          python publish_ligne.py $ARGS

      - name: Persister le déplacement + le journal
        if: ${{ github.event.inputs.dry_run != 'true' && always() }}
        run: |
          if [ -z "$(git status --porcelain ligne/)" ]; then
            echo "Aucune publication — rien à committer."; exit 0
          fi
          git config user.name  "kongrave-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ligne/
          git commit -m "ligne: publication $(date -u +%FT%TZ) [skip ci]"
          # PUSH RÉSILIENT : pull --rebase --autostash + retry (même boucle que l'autoprod).
          # Sans ça, une collision avec autoprod-ligne rejette le push APRÈS la publication IG
          # réelle -> file/journal non persistés -> risque de DOUBLE publication (vu sur L20).
          for i in 1 2 3 4 5; do
            if git push; then echo "push ok (essai $i)"; exit 0; fi
            echo "push rejeté (essai $i) — pull --rebase puis retry…"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "::error::push échoué après 5 essais — publication faite mais file/journal NON persistés (réparer à la main)"
          exit 1
