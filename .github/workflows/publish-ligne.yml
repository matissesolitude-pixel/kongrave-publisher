name: LIGNE auto-publish (file)

# Publie LIGNE depuis une FILE (ligne/queue/), pas un planning : prend le PLUS
# ANCIEN épisode de la file, le publie sur @kongrave_, le déplace en published/.
#
# IL N'Y A PLUS DE FENÊTRE HORAIRE. Le seul garde-fou temporel est la cadence,
# lue dans ligne/config.json — 12 h au 28/08/2026, soit deux publications par
# jour. Le cron ne décide de rien : il ne fait qu'offrir des occasions, et la
# cadence tranche. Ne JAMAIS régler l'intervalle du cron sans lire la cadence
# réelle : avec un cron toutes les 8 h, aucun créneau ne retombait à 12 h
# d'intervalle et le rythme dérivait à 1,5 post par jour au lieu de 2.

on:
  schedule:
    - cron: "30 */2 * * *"     # 12 sondages/jour. Le court-circuit rend un sondage a vide quasi gratuit,
                               # et sonder souvent est la seule protection contre un creneau que GitHub abandonne.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run : crée le conteneur mais NE PUBLIE PAS, ne déplace pas"
        type: boolean
        default: false
      force:
        description: "Force : ignore la fenêtre horaire ET la cadence"
        type: boolean
        default: false

# Un seul run à la fois (un upload peut être long).
concurrency:
  group: ligne-publish
  cancel-in-progress: false

# Nécessaire pour committer le déplacement queue->published + le journal.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # COURT-CIRCUIT (<10 s) : rejoue les trois premières portes de publish_ligne.py
      # — pause, cadence, file vide — avec le python système, avant toute installation.
      # Un sondage à vide coûtait ~1,7 min de runner ; il en coûte quelques secondes.
      # C'est ce qui permet de sonder souvent, et sonder souvent est la seule protection
      # contre un créneau planifié que GitHub retarde ou abandonne (28/08/2026).
      - name: Court-circuit — pause, cadence, file
        id: check
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Force demandé — aucune porte n'est évaluée ici."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          verdict=$(/usr/bin/python3 ligne/precheck.py)
          echo "$verdict"
          case "$verdict" in
            GO*) echo "go=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "go=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Python
        if: steps.check.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Dépendances
        if: steps.check.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Publier le plus ancien épisode de la file
        if: steps.check.outputs.go == 'true'
        env:
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GRAPH_VERSION: v20.0
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "publish_ligne.py $ARGS"
          python publish_ligne.py $ARGS

      - name: Persister le déplacement + le journal
        if: ${{ steps.check.outputs.go == 'true' && github.event.inputs.dry_run != 'true' && always() }}
        run: |
          if [ -z "$(git status --porcelain ligne/)" ]; then
            echo "Aucune publication — rien à committer."; exit 0
          fi
          git config user.name  "kongrave-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ligne/
          git commit -m "ligne: publication $(date -u +%FT%TZ) [skip ci]"
          # PUSH RÉSILIENT : pull --rebase --autostash + retry (même boucle que l'autoprod).
          # Sans ça, une collision avec autoprod-ligne rejette le push APRÈS la publication IG
          # réelle -> file/journal non persistés -> risque de DOUBLE publication (vu sur L20).
          for i in 1 2 3 4 5; do
            if git push; then echo "push ok (essai $i)"; exit 0; fi
            echo "push rejeté (essai $i) — pull --rebase puis retry…"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "::error::push échoué après 5 essais — publication faite mais file/journal NON persistés (réparer à la main)"
          exit 1
