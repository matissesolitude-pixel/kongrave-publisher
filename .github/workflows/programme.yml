# Le calendrier éditorial dans le cloud (demande de M, 30/09 : « rien du calendrier ne doit passer à la trappe », Mac fermé).
# Un post monté à l'avance attend dans programme/, dans un dossier nommé par son créneau, à l'heure de Paris :
#   programme/2026-10-03_18h00__ligne__WB06-revenge-trade/   (le mp4 et caption.txt, comme dans ligne/queue)
#   programme/2026-10-01_17h00__story__kongrave-edu-2026-10-01/   (le manifeste <id>.json, comme dans story/queue)
# Quand le créneau est passé, ce workflow déplace le post dans la file de son type, puis déclenche sa publication.
# Il ne touche à rien d'autre. Pour arrêter un post (le « Stop » de M), on retire son dossier de programme/ avant l'heure.
# Le Stop de M dans le hub (« Prêt à partir ») est lu avant chaque départ : un post arrêté reste dans programme/.
# La pause de chaque type (ligne/config.json, story/config.json) est respectée : en pause, le post reste dans programme/.
# Si le créneau suivant tombe dans les 5 h 45, le run l'attend puis le fait partir à l'heure ; sinon il s'arrête aussitôt.
# Le déplacement se fait par l'API git (le dépôt pèse plusieurs Go, aucun checkout).
name: Calendrier programmé

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # GitHub saute la plupart des crons sur ce dépôt (30/09 : un cron horaire tourne ~toutes les 6 h).
                                   # D'où l'attente ci-dessous : un seul déclenchement dans les 5 h 45 avant un créneau suffit.
  workflow_dispatch:

concurrency:
  group: programme
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  deplacer-et-publier:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Déplacer les posts arrivés à leur créneau
        id: move
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HUB_TOKEN: ${{ secrets.HUB_INGEST_TOKEN }}
        run: |
          python3 - <<'EOF'
          import base64, json, os, re, urllib.request, urllib.error
          from datetime import datetime
          from zoneinfo import ZoneInfo
          R, TOK = os.environ["REPO"], os.environ["GH_TOKEN"]
          def api(method, path, body=None):
              req = urllib.request.Request(f"https://api.github.com/repos/{R}/{path}", method=method,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={"Authorization": f"Bearer {TOK}", "Accept": "application/vnd.github+json"})
              try:
                  return json.load(urllib.request.urlopen(req, timeout=60))
              except urllib.error.HTTPError as e:
                  if e.code == 404: return None
                  raise
          def paused(kind):
              c = api("GET", f"contents/{kind}/config.json")
              return bool(c and json.loads(base64.b64decode(c["content"])).get("paused"))
          now = datetime.now(ZoneInfo("Europe/Paris"))
          try:
              req = urllib.request.Request("https://hub-ia-inky.vercel.app/api/ingest/media", headers={"Authorization": f"Bearer {os.environ['HUB_TOKEN']}"})
              arretes = set(json.load(urllib.request.urlopen(req, timeout=30))["arretes"])
          except Exception as e:
              arretes = None; print(f"hub injoignable ({e}) : on attend le passage suivant, sauf créneau dépassé de plus de 3 h")
          dus, entries = [], []
          for d in sorted(api("GET", "contents/programme") or [], key=lambda x: x["name"]):
              m = re.fullmatch(r"(\d{4}-\d{2}-\d{2})_(\d{2})h(\d{2})__(ligne|story)__(.+)", d["name"])
              if d["type"] != "dir" or not m: continue
              quand = datetime.strptime(f"{m[1]} {m[2]}:{m[3]}", "%Y-%m-%d %H:%M").replace(tzinfo=ZoneInfo("Europe/Paris"))
              kind, nom = m[4], m[5]
              if quand > now: print(f"en attente : {d['name']}"); continue
              if any(k == kind for k, _ in dus): print(f"un {kind} déjà parti à ce passage, {d['name']} au suivant"); continue
              if arretes is not None and f"{'reel' if kind == 'ligne' else 'story'}:{nom}" in arretes:
                  print(f"STOP de M dans le hub : {d['name']} ne part pas"); continue
              if arretes is None and (now - quand).total_seconds() < 3 * 3600: continue
              if paused(kind): print(f"{kind} en pause : {d['name']} reste en attente"); continue
              for f in api("GET", f"contents/{d['path']}"):
                  dst = f"ligne/queue/{nom}/{f['name']}" if kind == "ligne" else f"story/queue/{f['name']}"
                  entries += [{"path": dst, "mode": "100644", "type": "blob", "sha": f["sha"]},
                              {"path": f["path"], "mode": "100644", "type": "blob", "sha": None}]
              dus.append((kind, nom)); print(f"créneau arrivé : {d['name']} -> file {kind}")
          if dus:
              head = api("GET", "git/ref/heads/main")["object"]["sha"]
              tree = api("POST", "git/trees", {"base_tree": api("GET", f"git/commits/{head}")["tree"]["sha"], "tree": entries})["sha"]
              msg = "programme : " + ", ".join(n for _, n in dus) + " passent en file à leur créneau [skip ci]"
              c = api("POST", "git/commits", {"message": msg, "tree": tree, "parents": [head]})["sha"]
              api("PATCH", "git/refs/heads/main", {"sha": c})
          import subprocess
          for k, n in dus:
              cmd = (["gh", "workflow", "run", "publish-ligne.yml", "-R", R, "-f", "dry_run=false", "-f", "force=true"] if k == "ligne"
                     else ["gh", "workflow", "run", "publish-story.yml", "-R", R, "-f", f"id={n}", "-f", "dry_run=false", "-f", "force=true"])
              print("Publication déclenchée :", k, n, "code", subprocess.run(cmd).returncode)
          # Prochain créneau : s'il tombe dans les 5 h 45 qui viennent, on l'attend ici et on le fait partir à l'heure exacte.
          # Sinon on s'arrête tout de suite. Aucun relais, aucune veille permanente (M, 30/09 : 2 h de retard au plus, pas 6).
          futurs = []
          for d in api("GET", "contents/programme") or []:
              m = re.fullmatch(r"(\d{4}-\d{2}-\d{2})_(\d{2})h(\d{2})__(ligne|story)__(.+)", d["name"])
              if m:
                  futurs.append(datetime.strptime(f"{m[1]} {m[2]}:{m[3]}", "%Y-%m-%d %H:%M").replace(tzinfo=ZoneInfo("Europe/Paris")))
          futurs = [q for q in futurs if q > datetime.now(ZoneInfo("Europe/Paris"))]
          attente = (min(futurs) - datetime.now(ZoneInfo("Europe/Paris"))).total_seconds() if futurs else None
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write(f"attente={int(attente) + 30 if attente is not None and attente <= 345 * 60 else ''}\n")
          print(f"prochain créneau dans {attente / 60:.0f} min" if attente is not None else "aucun créneau à venir")
          EOF
      - name: Attendre le prochain créneau s'il est proche
        if: steps.move.outputs.attente != ''
        run: |
          echo "Attente de ${{ steps.move.outputs.attente }} s jusqu'au créneau"
          sleep ${{ steps.move.outputs.attente }}
      - name: Faire partir le créneau à l'heure
        if: steps.move.outputs.attente != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run programme.yml -R "$GITHUB_REPOSITORY" && echo "Passage déclenché à l'heure du créneau."
