name: CARROUSEL auto-publish (file)

# Publie un carrousel KONGRAVE depuis une FILE (carrousel/queue/), sur @kongrave_.
#
# PAS DE FENÊTRE HORAIRE (décision PO du 03/08) : la position dans la grille dépend de
# l'ORDRE des posts, pas de l'heure. Publier à midi ou à 21h donne la même colonne.
# La seule règle est l'espacement : un carrousel tous les 5 posts.
#
# ESPACEMENT — le script compte les posts depuis le dernier carrousel EN INTERROGEANT
# INSTAGRAM, pas un compteur local. Cycle de 6 (1 carrousel + 5 reels) : 6 est multiple
# de 3, donc tous les carrousels retombent dans la même colonne. Aucun couplage avec le
# publisher de LA LIGNE — on ne touche pas à une chaîne qui tourne.
#
# Les slides ne sont PAS dans ce repo : l'API Graph ne reçoit pas de binaire pour une
# image, elle va la CHERCHER à une URL publique. Les JPEG sont hébergés sur le GitHub
# Pages de disruptive-legal ; ce workflow ne transmet que leur racine.
#
# La FILE est le garde-fou éditorial : rien ne part si aucun manifeste n'y est.

on:
  schedule:
    - cron: "5 */6 * * *"      # 4 sondages/jour : l espacement est un nombre de posts, pas une heure
  workflow_dispatch:
    inputs:
      id:
        description: "Publier CE carrousel tout de suite (laisser vide = mode file)"
        required: false
        default: ""
      base_url:
        description: "Racine publique des slides, sans slash final"
        required: true
        default: "https://matissesolitude-pixel.github.io/disruptive-legal/media/carrousel"
      dry_run:
        description: "Dry-run : crée les conteneurs mais NE PUBLIE PAS"
        type: boolean
        default: true
      force:
        description: "Ignore espacement + cadence"
        type: boolean
        default: false
      no_comment:
        description: "Publier sans poster le commentaire CTA"
        type: boolean
        default: false

concurrency:
  group: carrousel-publish
  cancel-in-progress: false

# Nécessaire pour committer le déplacement queue->published + le journal.
permissions:
  contents: write

jobs:
  # SONDAGE — tranche les deux portes qui ne demandent pas Instagram, la file
  # vide et la cadence de 20h, avec un checkout partiel : le dépôt pèse 5,6 Go
  # dont 3,7 Go de masters LIGNE dont ce workflow n'a aucun besoin.
  # L'espacement réel de la grille reste vérifié par le script complet.
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.verdict.outputs.go }}
    steps:
      - name: Checkout partiel — journal et file seulement
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            carrousel/journal.jsonl
            carrousel/precheck.py
            carrousel/queue
          sparse-checkout-cone-mode: false

      - name: Court-circuit — file et cadence
        id: verdict
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ] || [ -n "${{ github.event.inputs.id }}" ]; then
            echo "Force ou identifiant explicite — aucune porte n'est évaluée ici."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          verdict=$(/usr/bin/python3 carrousel/precheck.py)
          echo "$verdict"
          case "$verdict" in
            GO*) echo "go=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "go=false" >> "$GITHUB_OUTPUT" ;;
          esac

  publish:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Dépendances
        run: pip install requests python-dotenv

      - name: Publier le carrousel
        env:
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          GRAPH_VERSION: v20.0
        run: |
          BASE="${{ github.event.inputs.base_url }}"
          if [ -z "$BASE" ]; then
            BASE="https://matissesolitude-pixel.github.io/disruptive-legal/media/carrousel"
          fi
          ARGS=""
          if [ -n "${{ github.event.inputs.id }}" ]; then
            TARGET="${{ github.event.inputs.id }}"
          else
            TARGET="--queue"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ github.event.inputs.no_comment }}" = "true" ]; then ARGS="$ARGS --no-comment"; fi
          echo "publish_carrousel.py $TARGET $ARGS"
          python publish_carrousel.py $TARGET --base-url "$BASE" $ARGS

      - name: Persister le déplacement + le journal
        if: ${{ github.event.inputs.dry_run != 'true' && always() }}
        run: |
          if [ -z "$(git status --porcelain carrousel/)" ]; then
            echo "Aucune publication — rien à committer."; exit 0
          fi
          git config user.name  "kongrave-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A carrousel/
          git commit -m "carrousel: publication $(date -u +%FT%TZ) [skip ci]"
          # PUSH RÉSILIENT — même leçon que LA LIGNE : sans ça une collision rejette le
          # push APRÈS la publication IG réelle, la file n'est pas vidée, et le carrousel
          # repart au prochain créneau. Double publication.
          for i in 1 2 3 4 5; do
            if git push; then echo "push ok (essai $i)"; exit 0; fi
            echo "push rejeté (essai $i) — pull --rebase puis retry…"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "::error::push échoué après 5 essais — publication faite mais file/journal NON persistés (réparer à la main)"
          exit 1
