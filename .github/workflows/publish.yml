name: KONGRAVE auto-publish

# Remplace le VPS+cron : GitHub Actions exécute le publieur sur une planification.
# - Toutes les heures à :07 (on évite :00, heure de pointe où GitHub retarde le plus).
# - Déclenchable à la main (workflow_dispatch), avec option dry-run (ne publie pas).
#
# Le token n'est JAMAIS dans le repo : il vit dans GitHub > Settings > Secrets and
# variables > Actions. Il est injecté en variable d'environnement, lue par ig_api.py
# via os.getenv (python-dotenv devient un no-op quand .env.local est absent).

on:
  # Réactivé (v13 validée) : publie l'épisode dû dans schedule.json. ep02 = 02:00 Dubai.
  schedule:
    - cron: "7,37 * * * *"       # 2×/h (:07 et :37 UTC) : résilient si GitHub saute/retarde un créneau
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run : crée le conteneur mais NE PUBLIE PAS"
        type: boolean
        default: false

# Un seul run à la fois : un upload peut durer > l'intervalle de cron.
concurrency:
  group: kongrave-publish
  cancel-in-progress: false

# Nécessaire pour que le job puisse committer le journal de publication.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Publier les épisodes dus
        env:
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GRAPH_VERSION: v20.0
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "::notice::Mode DRY-RUN — aucune publication."
            python cron_publisher.py --dry-run
          else
            python cron_publisher.py
          fi

      - name: Persister le journal de publication
        if: ${{ github.event.inputs.dry_run != 'true' && always() }}
        run: |
          if [ -n "$(git status --porcelain output/publish_log.json)" ]; then
            git config user.name  "kongrave-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add output/publish_log.json
            git commit -m "log: publication $(date -u +%FT%TZ) [skip ci]"
            git push
          else
            echo "Aucune nouvelle publication — rien à committer."
          fi
