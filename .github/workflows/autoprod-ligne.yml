name: LIGNE autoprod (fabrication)

# Produit UN épisode LIGNE par run, 100% cloud (Mac éteint) — modèle KONGRAVE autoprod.yml :
#   voix George ElevenLabs -> rendu moteur ligne/engine/lXX.html (Chromium headless + hyperframes@0.7.37)
#   -> assemblage ffmpeg + filigrane -> transcode 25fps nal-hrd=cbr -> dépose en ligne/queue/LXX/
#   -> notif Telegram (send_video depuis le runner) -> commit + push (résilient).
# Cadence : 12/jour. Le court-circuit fait sortir en <1 min quand aucun moteur nouveau n'est prêt, donc
# le coût runner reste proportionnel au NOMBRE DE MOTEURS ÉCRITS, pas au nombre de créneaux.
# Court-circuit : si aucun épisode prêt (moteur existant, non produit), on SORT avant toute install.
# Garde-fous : 1 épisode/run ; seuls les épisodes dont le FICHIER moteur existe sont fabriqués.

on:
  schedule:
    - cron: "20 */2 * * *"           # 12 créneaux/jour (UTC) — les créneaux sans épisode prêt sortent en <1 min (court-circuit)
  workflow_dispatch:
    inputs:
      episode:
        description: "Forcer un numéro (vide = prochain prêt non produit)"
        required: false

concurrency:
  group: ligne-autoprod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      LIGNE_QUEUE: ${{ github.workspace }}/ligne/queue
      LIGNE_PUBLISHED: ${{ github.workspace }}/ligne/published
      LIGNE_NOTIFY_DIR: ${{ github.workspace }}
      LIGNE_AUTOPROD_NOPUSH: "1"
      FORCE_EPISODE: ${{ github.event.inputs.episode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Court-circuit — y a-t-il un épisode prêt ?
        id: check
        run: |
          n=$(/usr/bin/python3 ligne/autoprod_ligne.py --check | grep -oE 'PENDING=[0-9]+' | cut -d= -f2)
          echo "épisodes prêts : ${n:-0}"
          if [ "${n:-0}" -gt 0 ]; then
            echo "has_work=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo "Rien de prêt à fabriquer — court-circuit avant install (économie runner)."
          fi

      - name: Système (ffmpeg, chromium, polices Arial-like)
        if: steps.check.outputs.has_work == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser fontconfig fonts-liberation
          fc-cache -f >/dev/null 2>&1 || true

      - name: Python 3.12
        if: steps.check.outputs.has_work == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node 20
        if: steps.check.outputs.has_work == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deps Python
        if: steps.check.outputs.has_work == 'true'
        run: pip install -r ligne/requirements-ligne.txt

      - name: Pré-chauffe hyperframes (npx) + vérif Chromium
        if: steps.check.outputs.has_work == 'true'
        run: |
          /usr/bin/chromium-browser --version || true
          cd ligne && npx --yes hyperframes@0.7.37 --version || true

      - name: Production (1 épisode)
        if: steps.check.outputs.has_work == 'true'
        run: cd ligne && python autoprod_ligne.py --one

      - name: Commit & push (résilient aux pushes concurrents)
        if: steps.check.outputs.has_work == 'true'
        run: |
          git config user.name  "ligne-autoprod"
          git config user.email "autoprod@users.noreply.github.com"
          git add -f ligne/queue
          # Persiste aussi la quarantaine anti-blocage (autoprod_hold.json) : sans ça, un épisode
          # écarté pour temps mort/écran vide reviendrait en tête à chaque run et regèlerait la file.
          [ -f ligne/autoprod_hold.json ] && git add -f ligne/autoprod_hold.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau à mettre en file."
          else
            git commit -m "ligne: autoprod fabrication [skip ci]"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then pushed=1; break; fi
              echo "push rejeté (tentative $i/5), rebase + retry…"; sleep 5
            done
            [ "$pushed" = 1 ] || { echo "::error::push impossible après 5 tentatives"; exit 1; }
          fi
